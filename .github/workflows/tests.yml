name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Git identity for the tests that make commits
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: my-agent (L1-L4 rules and hooks)
        working-directory: plugins/my-agent
        run: python3 -m unittest discover -s tests
      - name: my-agent monitor
        working-directory: plugins/my-agent/monitor
        run: python3 -m unittest discover tests
      - name: tools (architecture page)
        run: python3 -m unittest discover -s tests
      - name: my-agent-tray (skips without swiftc)
        working-directory: plugins/my-agent-tray
        run: python3 -m unittest discover -s tests
      - name: Generated files are up to date
        run: |
          python3 tools/build-docs.py --check
          python3 plugins/my-agent/l4-tools-guards/scripts/build-codex.py --check
