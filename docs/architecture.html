 exceptions (permission-modes docs, \"Skip all checks with bypassPermissions mode\"). Apart from that the verdicts do not depend on the permission mode.<\/li><li><strong>Auto mode:<\/strong> the current hooks docs say a hook <code>ask<\/code> also forces a prompt in auto mode: the classifier can still deny the call, but it cannot approve it silently. The probe of 2026-10-25 (the auto-mode bullet above and 4.12) saw a hook <code>ask<\/code> approved without a dialog. This document claims no more than was probed. Every form the patterns hard-deny today stays a <code>deny<\/code> in the hook, so auto mode cannot soften it; only the lease form and the cannot-parse and cannot-tell cases rest on the dialog, and that is the recorded remaining risk. The ask rules <code>Bash(git push:*)<\/code> and <code>Bash(git * push*)<\/code> of the permission guard ask about every push; that is a hook ask too.<\/li><li><strong>Hosts:<\/strong> all three go through <code>ma_host<\/code>.<ul><li>Claude Code, owning main session, mode <code>default<\/code>, <code>acceptEdits<\/code> or <code>plan<\/code>: the G2 dialog (<code>permissionDecision: ask<\/code>). In <code>dontAsk<\/code> Claude Code denies a call that would prompt, so it is blocked.<\/li><li>Codex, main session: the existing path. A deny is the deny JSON with exit 0; an ask is exit 2 with a <code>my-agent G2 (git-guard):<\/code> reason and an <code>ask: gate=G2 … hook=git-guard<\/code> run-log line; L1's popup, never answered by L1; one <code>answer gate=G2<\/code> line releases one retry (4.14). The hook calls <code>ma_host.parse<\/code> first, so on Codex it leaves a hook-health mark on every Bash call, and it is in <code>ma_host.GATE_HOOKS<\/code>: <code>data-dir.py<\/code> and <code>intake.py facts<\/code> report it when Codex has not trusted it.<\/li><li>Antigravity, main session: <code>{&quot;decision&quot;:&quot;deny&quot;,…}<\/code> or <code>{&quot;decision&quot;:&quot;force_ask&quot;,…}<\/code> (4.15; unverified end to end).<\/li><li>A subagent's input carries the owner's <code>session_id<\/code> on Claude Code and Codex (scope-guard finds a subagent's scratchpad by that field, and permission-log records subagent G2 asks through <code>ma_active.owns<\/code>), so the owner test holds there. One Antigravity gap, in 4.15: a subagent input with another <code>conversationId<\/code> fails the owner test open.<\/li><\/ul><\/li><li><strong>Config environment variable:<\/strong> covered when it is on the judged command line: an assignment word <code>GIT_CONFIG_KEY_&lt;n&gt;=core.hooksPath<\/code> (any letter case) or <code>GIT_CONFIG_PARAMETERS=&lt;a value naming core.hooksPath&gt;<\/code>, as a prefix assignment, an <code>env<\/code> argument, or an <code>export<\/code> or bare assignment anywhere on the line that runs git, and a <code>--config-env=core.hooksPath=&lt;VAR&gt;<\/code> option, which is judged as a config option. Each of these is a <code>deny<\/code> (<code>hooks-path override (`GIT_CONFIG_KEY_0=core.hooksPath`)<\/code>). Not covered, and stated as limits: a variable set before the command (an earlier command, the shell profile, the host's environment); <code>GIT_CONFIG_GLOBAL<\/code>, <code>GIT_CONFIG_SYSTEM<\/code> or <code>GIT_CONFIG<\/code> pointing at another config file; <code>-c include.path=…<\/code>; a persistent <code>git config core.hooksPath …<\/code> (a config write, not an override option); git aliases, scripts, and git reached through a variable or substitution as the command word; a program that runs its arguments or a string as a command and is not in the prefix list or the shell list above (wrappers such as <code>stdbuf<\/code>, <code>ionice<\/code>, <code>caffeinate<\/code>, <code>watch<\/code>, <code>ssh<\/code>, <code>su -c<\/code>, <code>parallel<\/code>, <code>find -exec<\/code>, and shells other than <code>bash<\/code>, <code>sh<\/code>, <code>zsh<\/code>, <code>dash<\/code> and <code>ksh<\/code>, such as <code>fish -c<\/code> and <code>busybox sh -c<\/code>); text that runs later or elsewhere (an alias, a function or script defined elsewhere, <code>PROMPT_COMMAND<\/code>, <code>bind -x<\/code>, zsh hook functions); and a plain <code>$VAR<\/code> word (also <code>${VAR}<\/code>, or a <code>${VAR:-main}<\/code> whose default is no option) in an option, refspec or pathspec slot of a push or commit (<code>git push origin &quot;$B&quot;<\/code>, <code>F=-f; git push $F origin main<\/code>), which is not judged because the check cannot see its value; the same holds for words that arrive by data flow (<code>xargs<\/code> input, a script piped into a shell, a here-string or heredoc given to a shell, <code>source &lt;(…)<\/code>, a file written and then run).<\/li><li><strong>Relation to the permission guard:<\/strong> during a task both act. The git guard gives the deny verdicts for push and commit forms from the parsed command; the permission guard's ask rules ask before every <code>git commit<\/code> and <code>git push<\/code> on Claude Code. Outside a task neither acts (Q44). The Bash deny patterns that stood in front of the guard until plugin 0.25.2 are gone, and with them the deny of a commit whose message only mentioned a force push.<\/li><\/ul><\/li><li><strong>Allow scope:<\/strong> Risky actions are allowed once only, never with \"Allow for the session\". (F3)<\/li><li><strong>Install (2026-11-23, plugin 0.26.0):<\/strong> nothing is merged by hand. <code>l4-tools-guards/permissions/permissions.json<\/code> is read by <code>permission-guard.py<\/code> only; plugin.json and the instructions do not read it. Until plugin 0.25.2 the person merged the list into <code>permissions<\/code> in <code>~/.claude/settings.json<\/code> (v0.27, review E); a list merged then is removed by hand (README install steps).<\/li><li><strong>Commit after G3:<\/strong> In the dev profile, even after a commit is approved at G3, the <code>ask<\/code> rule on <code>git commit<\/code> raises one more permission prompt (the permission guard's ask). This double check is intended.<\/li><li><strong>Remote take at G3 (2026-11-21, Q41):<\/strong> in the dev profile the G3 popup offers a second take after <code>Commit<\/code> when <code>origin<\/code> has a default branch (<code>git symbolic-ref --short refs/remotes/origin/HEAD<\/code> prints <code>origin/&lt;default branch&gt;<\/code>): <code>Commit and push<\/code> on that branch, <code>Commit and merge into &lt;default branch&gt;<\/code> on any other. Its purpose is that the default branch on the remote holds the task's commit without the person typing the push.<ul><li>After the commit L1 fetches the default branch and pushes only when the remote branch has no commit the task's commit lacks (<code>git rev-list --count HEAD..origin/&lt;default branch&gt;<\/code> is 0): <code>git push origin HEAD:&lt;default branch&gt;<\/code>. That push is a fast-forward to the commit Verify and Review judged; from another branch it is the merge. With commits to bring in, L1 does not push and says so: merging after Verify would put unjudged code on the default branch (Q37), so bringing them in is a follow-up.<\/li><li>In a remote (cloud) session (<code>printenv CLAUDE_CODE_REMOTE<\/code> is <code>true<\/code>) no remote take is offered: such a session may push only to its own branch, so a push to <code>origin/&lt;default branch&gt;<\/code> would be refused. G3 then shows <code>Commit (Recommended)<\/code> / <code>Rework<\/code> / <code>Abort<\/code>, with open items <code>Rework: fix all open items (Recommended)<\/code> / <code>Commit<\/code> / <code>Rework<\/code> / <code>Abort<\/code> (2026-11-24, plugin 0.30.0). When the variable is unset or has any other value, nothing changes.<\/li><li><code>Commit<\/code> is the recommended take only with no open review item; with an open item <code>Rework: fix all open items<\/code> is recommended (4.4 \"G3 recommendation\", 2026-11-24, plugin 0.30.0), and the remote take is never recommended. Under delegated approval L1 never answers with a remote take (Q39: nothing is pushed). The <code>git push<\/code> raises the G2 dialog like any push. L1 never forces a push and pushes to no other branch or remote. A push that is denied or rejected does not undo the commit.<\/li><li>With open review items the popup would hold five choices and a popup holds four, so the remote take stands in place of plain <code>Rework<\/code>; shortfalls typed in the Other field are the <code>Rework<\/code> answer.<\/li><li>Record: <code>merge: unit=remote files=&quot;&lt;sha&gt; to origin/&lt;branch&gt;&quot; how=&quot;pushed | not pushed: &lt;reason&gt;&quot; by=L1<\/code>. The procedure is <code>l1-orchestration/retro.md<\/code> \"Remote update\", which L1 reads before the dev G3 popup.<\/li><\/ul><\/li><li><strong>Unexpected changes (2026-11-01, item 47):<\/strong> before the verifier call and again at the dev G3 report, L1 compares <code>git status --porcelain<\/code> with the files the coder reports listed plus its own <code>fix<\/code> lines, and shows unexpected paths in the chat and in the overview's \"Open risks\" row; no extra popup.<\/li><li><strong>Verify and Review scope (2026-11-06, plugin 0.12.0):<\/strong> L1 writes <code>changed-files.md<\/code> with <code>changed-files.py<\/code> before the verifier call (with <code>--previous<\/code> on a rerun) and hands it to both judges. The verifier is the only judge that runs the tests and check commands (each once per run, listed under <code>## Commands run<\/code>); on a rerun it re-judges the failed criteria and those on the map's <code>Re-judge:<\/code> line (<code>all<\/code> when an unmapped or shared file changed) and carries the other PASS lines as <code>PASS (carried from Run &lt;m&gt;)<\/code>, while the full suites still run once. The reviewer cites <code>verify.md<\/code> and runs only the tests that cover files L1 fixed after Verify. Back to Execute archives the map with the verdicts. <strong>Mapping (2026-11-22, plugin 0.25.0; #66, #75, #84):<\/strong> every backticked path of a <code>Files to change<\/code> line and of its nested bullets maps to that unit, so a nested bullet holding two paths maps both. A path is compared after it is made relative to the git root: an absolute path, a <code>./<\/code> prefix and a task location below the git root are normalized. A generated file (the Codex and Antigravity agent copies, <code>docs/architecture.html<\/code>) is listed under the work unit that changes its source (a rule of <code>architect.md<\/code>); the script maps nothing by source. A plan written with other labels (<code>Change:<\/code>) stays unmapped by design. The tests of #75 and #84 rebuild the reported cases; a case that does not reproduce at 0.24.0 is recorded as such and the script stays as it is. <strong>Review findings re-judge (2026-11-24, plugin 0.29.0):<\/strong> (a) The reviewer tags every BLOCKER and SHOULD-FIX line with the completion criteria it concerns, in one of two forms: <code>[criterion &lt;n&gt;]<\/code> or <code>[criterion &lt;n&gt;, &lt;m&gt;…]<\/code> (numbers of the task's completion criteria), or <code>[criterion none]<\/code> for a finding that belongs to no criterion. A <code>(new)<\/code> or <code>(carried)<\/code> mark may follow the tag. <code>[criterion none]<\/code> findings stay with the reviewer: they are neither counted nor copied, and the small-fix path (L1 fixes a BLOCKER and reruns only Review) is unchanged. (2026-11-26, plugin 0.33.0: it stays unchanged for a round with no <code>[plan]<\/code> finding. A round that sends one back takes the plan-finding popup before the fix, 4.8.1 \"Plan findings (Review)\". The mark stands right before the criterion tag, so the tag is read as before.) (b) <code>Re-judge:<\/code> has three sources besides the changed files: <code>--review &lt;archived review.md&gt;<\/code> (the criteria of every BLOCKER line under <code>## Findings<\/code>; the <code>## Applied after review<\/code> section is not read and removes no BLOCKER line, because those fixes were made before that review ran), <code>--rework-criterion &quot;&lt;n&gt;: &lt;shortfall&gt;&quot;<\/code> (repeatable; one per G3 Rework shortfall) and <code>--rework-finding &quot;&lt;path&gt;:&lt;line&gt;&quot;<\/code> (repeatable; it picks the SHOULD-FIX lines of the <code>--review<\/code> file at that location, and only picked lines add criteria). The value is <code>all<\/code> if the changed files give <code>all<\/code>; otherwise it is the sorted union of the changed-file value and these numbers. (c) The map gets a <code>## Findings<\/code> section after the table, only when a line goes in it: the counted BLOCKER lines and the picked SHOULD-FIX lines as written, then one <code>- Criterion &lt;n&gt; (G3 Rework): &lt;shortfall&gt;<\/code> line per <code>--rework-criterion<\/code>. The output line adds the number of criteria from findings. (d) The verifier's evidence rule: a criterion that a <code>## Findings<\/code> line names (the numbers of its valid tag, or the <code>&lt;n&gt;<\/code> of a <code>Criterion &lt;n&gt; (G3 Rework)<\/code> line) is judged again on new evidence; a <code>PASS<\/code> that rests on the same evidence as the previous run is not allowed, and the criterion is not carried. A line without a valid tag names no criterion. (e) A counted line with a missing or invalid tag makes <code>Re-judge: all<\/code>, and the output line says how many findings had no valid tag; the criteria are then judged by the usual run rules, and the evidence rule does not extend to all of them. (f) Which review counts: L1 passes <code>--review<\/code> with the <code>review.md<\/code> of the archive folder the last Back to Execute wrote, only when that file exists. If the <code>verify.md<\/code> in the same folder says <code>Verdict: FAIL<\/code>, no Review ran in that run and the <code>review.md<\/code> is a copy left over from an earlier run (<code>archive.py<\/code> copies whatever <code>review.md<\/code> the task folder holds): the script ignores it and its output line says <code>review not read (Verify FAIL in that run)<\/code>. An older archive folder is never read. Errors (exit 2, one <code>changed-files:<\/code> line, nothing written): <code>--review<\/code> names a missing or unreadable file; a <code>--rework-criterion<\/code> number is not a completion criterion or has no shortfall text; a <code>--rework-finding<\/code> is given without <code>--review<\/code> or matches no SHOULD-FIX line. L1 passes <code>--previous<\/code> on every rerun after Back to Execute (Verify FAIL, Review BLOCKER, G3 Rework), not only after a Verify FAIL.<\/li><li><strong>Korean copy of the Report texts (2026-11-06, plugin 0.12.0):<\/strong> for a Korean request L1 runs <code>report-ko.py --task &lt;folder&gt; todo<\/code> before G1-A, G1-B and G3 and writes the listed items into <code>report-ko.json<\/code> (<code>{&quot;items&quot;: {key: {sha, ko}}}<\/code>); the report JSON carries <code>*_ko<\/code> fields only for items whose sha matches the current English source, and the Report tab shows them in 한국어 mode. The judges read only the English files.<\/li><li><strong>Small scope adjustments after G3 (2026-11-01, item 4):<\/strong> adjustments the person asks for after the G3 report are collected into one <code>Scope change:<\/code> round and re-judged once (one Execute, one Verify, one Review).<\/li><li><strong>Plan Review decisions (2026-11-01, item 28):<\/strong> L1, not architect, writes the <code>## Decisions<\/code> lines in <code>plan-review.md<\/code> (<code>- &lt;severity&gt; &lt;path&gt;:&lt;line&gt; &lt;summary&gt; → applied by L1 | applied by architect | declined<\/code>).<\/li><\/ul>","hardGate":"<ul><li><strong>Mechanism:<\/strong> A plugin <code>PreToolUse<\/code> hook (<code>plan-approved-check.py<\/code>, registered in <code>hooks.json<\/code>, 4.5.1). It used to be a skill-frontmatter hook (Q8); it moved when probe r11 showed that skill hooks get no plugin settings (F35, Q21). It reads the data folder from <code>CLAUDE_PLUGIN_OPTION_DATA_DIR<\/code>.<\/li><li><strong>When the hook applies (Q21):<\/strong> A plugin hook is registered in every session that has the plugin on (F18) and runs inside subagents too (F9), so each script narrows down before it judges, in this order:<ol><li>Read the input JSON (failure → exit 2, blocked).<\/li><li>The input has <code>agent_id<\/code> (a call from inside a subagent) → pass, no output. The old skill hook did not run there either (F20); <code>scope-guard.py<\/code> covers subagents. A session started with <code>--agent<\/code> has <code>agent_id<\/code> on its main thread too, so both gate hooks skip that whole session, as the skill hooks did.<\/li><li>No <code>.active<\/code> found → pass, no output. A <code>.active<\/code> without <code>task:<\/code> → a one-line warning (C9). The warning comes before the session check, because a broken <code>.active<\/code> has no <code>session:<\/code> to compare. Every session of that repository with the plugin on gets it on each tool call until <code>.active<\/code> is fixed or deleted: noisy, but the closed side of C9.<\/li><li><code>session:<\/code> in <code>.active<\/code> and <code>session_id<\/code> in the input are both set and differ → pass, no output (fail open). So the gate applies only to the session that started the task or took it over with <code>continue<\/code>. If either is empty, the gate applies (closed side).<\/li><li>Then the verdict below.<\/li><\/ol><\/li><li><strong>What is denied and what is asked:<\/strong> <code>Agent<\/code> and <code>Workflow<\/code> are <strong>denied<\/strong> (<code>permissionDecision: deny<\/code>). <code>Edit<\/code>, <code>Write<\/code>, <code>NotebookEdit<\/code> and **<code>Bash<\/code> commands that change files** (redirects <code>&gt;<\/code>/<code>&gt;&gt;<\/code>, <code>sed -i<\/code>, <code>tee<\/code>, <code>mv<\/code>, <code>cp<\/code>, <code>rm<\/code>, <code>git checkout<\/code>/<code>git apply<\/code>, etc.) or change git are <strong>asked<\/strong> (<code>permissionDecision: ask<\/code> with a reason text) when they reach outside the task folder; inside the task folder they pass as before.<\/li><li><strong>When it applies:<\/strong> If <code>.active<\/code> exists and that task's <code>plan.md<\/code> has no approval line, the deny and the ask above apply <strong>regardless of phase<\/strong>. This includes the ① Define phase and cases where a change request moved the phase back (4.8.1).<\/li><li>**Marker of the task in progress (<code>&lt;task_dir&gt;/.active<\/code>, default <code>.my-agent/.active<\/code>):**<ul><li>So that the hook knows when to block, L1 writes the task ID and current phase to <code>.active<\/code> when a task starts. <code>session:<\/code> in it is the session the gate applies to (see \"When the hook applies\").<\/li><li>The hook finds <code>.active<\/code> in the search order of 4.8.2 (the repository of the folder it runs in → <code>active-index.json<\/code>).<\/li><li>L1 deletes this file when the task's retrospective ends (after G3 acceptance, 4.11), on abort, or when switching to another task. The retrospective needs <code>.active<\/code>, so it is deleted after the retrospective, not right after G3 acceptance.<\/li><li>If <code>.active<\/code> is missing, or the <code>plan.md<\/code> of the task it points to has an approval line, the hook <strong>simply passes<\/strong>. So other work in the same session is not blocked. Other sessions of the same repository are not blocked either (they fail the session check).<\/li><li>When a change request moves the phase back, L1 empties <code>## Approval<\/code> and updates the phase in <code>.active<\/code>. So it blocks again until the revised plan is approved.<\/li><li>If the task folder <code>.active<\/code> points to does not exist, the hook passes and leaves a one-line warning (the task folder was deleted).<\/li><\/ul><\/li><li><strong>Before approval, writes are asked (2026-10-31):<\/strong> for the owning session, a write or a git change outside the task folder is answered with a permission <code>ask<\/code> (the Claude Code dialog), not a deny. The reason reads <code>my-agent plan gate: write outside the task folder (&lt;path&gt;); allow it only if this is your own request, not the task&#x27;s<\/code>; a target that cannot be told shows <code>cannot tell: &lt;command&gt;<\/code>. In the data folder only <code>active-index.json<\/code>, <code>projects.txt<\/code> and the folder itself pass without a question; any other data-folder file is asked. Delegation (<code>Agent<\/code>) and workflows (<code>Workflow<\/code>) stay denied; writes inside the task folder keep today's result.<\/li><li><strong>Sibling task folders (2026-11-01):<\/strong> before approval only the active task folder (<code>&lt;task_dir&gt;/&lt;task&gt;/<\/code>), the records folder's <code>.active<\/code> (L1 writes <code>phase:<\/code> there), and <code>active-index.json<\/code>, <code>projects.txt<\/code> and the data folder itself pass. A write into a sibling task folder (another task in the same records folder) is not passed silently: it is asked like any write outside the active task folder (<code>permissionDecision: ask<\/code>).<\/li><li><strong>Plan gaps (2026-11-19, Q33):<\/strong> the plan cannot be approved while a format check fails. <code>ma_schema.plan_gaps<\/code> reads the completion criteria (<code>scope.md<\/code>, or <code>plan.md<\/code> without one) and the work units: (1) every criterion ends with one of the four check tags, with no case for tasks from before tags; (2) in the dev profile every <code>[check: command]<\/code> criterion has a <code>(criterion &lt;n&gt;)<\/code> mark, on a test to add or a check command, in a work unit that lists that criterion; (3) no <code>Files to change<\/code> path lies in the task records folder (2026-11-21): only a coder unit has that line and scope-guard denies a coder every write there, yet an approved plan had given a coder <code>work/repro.md<\/code>; (4) every <code>(background b&lt;n&gt;)<\/code> mark in the plan names a <code>b&lt;n&gt;<\/code> listed under <code>## Background research<\/code> in <code>scope.md<\/code> (2026-11-24, Q45): a mark whose <code>b&lt;n&gt;<\/code> is not a question of the scope is a gap. It runs in two places. L1 runs <code>l4-tools-guards/scripts/plan-lint.py --task &lt;task folder&gt;<\/code> at the start of 2B Plan Review, also when the profile skips Plan Review, and fixes each <code>plan-lint: FAIL &lt;gap&gt;<\/code> line before the person is asked. The hook runs the same check when an <code>Edit<\/code> or <code>Write<\/code> would put the <code>Approved<\/code> line into the active <code>plan.md<\/code>, and denies that write with the gaps in the reason. A plan approved earlier is not read again. A Bash write of the approval line is not read (L1 writes it with Edit), so that path stays an L1 rule. Only formats are checked here; whether a marked test really shows its criterion is plan-reviewer's judgment (4.5, Q32). Since 0.25.1 plan-reviewer no longer restates the first three format rules: the plan lint and the G1-B approval hook enforce them, and plan-reviewer judges only what code cannot.<\/li><li><strong>Exceptions:<\/strong><ul><li>Writing result files under the active task folder <code>&lt;task_dir&gt;/&lt;task-id&gt;/<\/code> in the task location, the records folder's <code>.active<\/code>, and <code>active-index.json<\/code> and <code>projects.txt<\/code> in the data folder (and <code>mkdir -p<\/code> of the data folder itself), is allowed.<\/li><li>The pre-approval write ask (<code>decide<\/code>) applies to the retrospective report copy folder too. The copy folder exception exists only for \"writes outside the working directory\" in G2 below.<\/li><li>If <code>plan.md<\/code>, or <code>scope.md<\/code> for a prototype requested at G1-A, has a <code>Prototype: requested<\/code> line inside its <code>## Prototype<\/code> section, delegating to <code>my-agent:writer<\/code> and writing to <code>&lt;task_dir&gt;/&lt;task-id&gt;/prototype/<\/code> are allowed (<code>ma_plan.scope_prototype_requested<\/code> reads the <code>scope.md<\/code> form).<\/li><li><strong>Writer gate report (2026-11-25, plugin 0.31.0):<\/strong> delegating to <code>my-agent:writer<\/code> before approval is also allowed when its prompt has the exact line <code>Gate report: G1-B<\/code> and the task folder has <code>plan-review.md<\/code> (the G1-B report, \"Gate report files (<code>report/<\/code>)\" above); scope-guard keeps its writes to <code>report/<\/code> and <code>report-ko.json<\/code> (and <code>work/<\/code>, <code>prototype/<\/code>). Any other writer call before approval is denied with a message that names both writer cases.<\/li><li><strong>Background research (2026-11-24, Q45):<\/strong> delegating to <code>my-agent:researcher<\/code> before approval is allowed only when all of these hold, tested in this order: (1) the task's profile is not research (<code>Profile:<\/code> in <code>intake.md<\/code>); (2) the scope is confirmed (a line starting with <code>Confirmed <\/code> under <code>## Confirmation<\/code> of <code>scope.md<\/code>, the line L1 writes on G1-A <code>Confirm<\/code>, also when L1 answers G1-A under delegated approval); (3) <code>scope.md<\/code> has a <code>## Background research<\/code> section; (4) the prompt has a <code>Background question: b&lt;n&gt;<\/code> line; (5) that <code>b&lt;n&gt;<\/code> is listed in the section. Any other researcher call is denied, after the usual approval-line frame, with a message that names the first condition that failed (for (5) it names the listed IDs). scope-guard keeps such a researcher's writes to <code>&lt;task_dir&gt;/&lt;task-id&gt;/background/<\/code> (4.5).<\/li><li>Only L1 writes the approval line and the <code>Prototype: requested<\/code> line (in <code>plan.md<\/code>, or in <code>scope.md<\/code> at G1-A). If architect adds either line when writing or editing <code>plan.md<\/code>, scope-guard blocks it (v0.24, final review C2; for an Edit see 4.12 \"The architect's plan edits\"). Prompt instructions alone cannot stop an injected exploration result from adding an approval line. <code>Prototype: requested<\/code> counts only inside the <code>## Prototype<\/code> section (v0.27, the same <code>ma_schema<\/code> rule for hooks and the monitor). In the same way, architect writes that delete or change <code>## Revisions<\/code> lines are blocked (v0.27, review A2: a rewritten plan used to erase the revision record).<\/li><\/ul><\/li><li><strong>Implementation:<\/strong> Same as my-dev's <code>verdict-fresh-check.py<\/code>: <code>permissionDecision: deny<\/code> with a reason for delegation and workflows, <code>permissionDecision: ask<\/code> with the reason text for writes and git changes outside the task folder.<\/li><li><strong>What the verdict freshness hook watches (v0.24):<\/strong> <code>git commit<\/code>, every tool (Bash, Write, Edit) that writes to the task folder's <code>deliverable/<\/code>, and a Bash <code>cp<\/code>, <code>mv<\/code> or <code>rsync<\/code> whose source is under the task folder's <code>work/<\/code> or <code>deliverable/<\/code> (after a <code>cd<\/code>, relative sources count from there; copying a judgment file, the run-log or any other task-folder file passes without a freshness check, and any <code>work/<\/code> source in a mixed list makes it a deliver) and whose target is outside <code>&lt;task_dir&gt;/<\/code> (2026-10-30: plain reads such as <code>cat T/x &gt; out<\/code> and other copy forms such as <code>install<\/code>, <code>tar -C<\/code>, <code>ln<\/code> or <code>cat T/x | tee out<\/code> no longer count as a deliver; a known limit). Hence the matcher <code>Bash|Edit|Write|NotebookEdit<\/code>. While moving files into <code>deliverable/<\/code>, files just moved are not counted as \"files changed after the verdict\" (so several files can be moved one after another). If a command cannot be parsed (substitution <code>$(<\/code>, backticks, an open quote) and has the shape <code>git … commit<\/code> in one simple command (a <code>;<\/code>, <code>&amp;<\/code>, <code>|<\/code> or newline between <code>git<\/code> and <code>commit<\/code> splits it, but separators inside single quotes, double quotes and <code>$( )<\/code> do not, and one inside an unbalanced quote or <code>$(<\/code> still counts), it is taken as a possible commit and asked with the text <code>my-agent verdict gate: cannot parse the command; allow it only if it is your own commit, not the task&#x27;s<\/code>; a command that only contains the word <code>git<\/code> is not, but instead of the verdict file it states that reason and \"run it split up, without substitution\" (v0.25).<ul><li><strong>Ask, not deny, for a commit (2026-10-31):<\/strong> a <code>git commit<\/code> while a judgment is stale is asked, with the stale judgment named: <code>my-agent verdict gate: &lt;verify.md|review.md&gt; is older than &lt;file&gt;; allow the commit only if it is your own change, not the task&#x27;s<\/code>, or <code>… does not start with &lt;line&gt;<\/code> when the judgment is missing or not a pass line. A stale deliver (a copy or a write into <code>deliverable/<\/code>) stays denied. Subagent calls are never gated.<\/li><li><strong>Unparsed commit-shaped command with a copy (2026-11-01):<\/strong> when the command does not parse but has the <code>git … commit<\/code> shape, the hook also scans its raw text leniently: a literal <code>cp<\/code>, <code>mv<\/code> or <code>rsync<\/code> argument that resolves under the task folder's <code>work/<\/code> or <code>deliverable/<\/code> (relative paths are resolved against the cwd and every literal <code>cd<\/code> or <code>pushd<\/code> target before it, as a union of folders; an argument containing <code>$<\/code>, such as <code>cp $F /x<\/code>, is skipped and not followed) counts as a deliver. With a stale judgment the command is then <strong>denied<\/strong>, with the reason naming the copied path and the stale judgment; without such a copy it is asked as before (<code>cannot parse the command<\/code>). A command that parses keeps the <code>copy_sources<\/code> rule.<\/li><li><strong>Auto permission mode:<\/strong> a hook <code>ask<\/code> may be approved there without a dialog and without a G2 record; see the remaining risk in 4.12 (probe 2026-10-25). This document claims no more than was probed.<\/li><\/ul><\/li><li><strong>Block when the hook fails:<\/strong><ul><li>Set <code>&quot;onFailure&quot;: &quot;block&quot;<\/code>. With the default, a hook that fails by error or timeout lets the tool run anyway (hooks docs, \"Block the action when a hook fails\").<\/li><li>In return, if <code>.active<\/code> cannot be found, the hook only checks the file and ends at once with exit 0. This keeps a hook bug from blocking unrelated work.<\/li><li>Tests pin these two cases (script error → block, no <code>.active<\/code> → pass).<\/li><\/ul><\/li><li><strong>Scope:<\/strong><ul><li>It blocks the main session from starting subagents or workflows at all, so no delegation goes down before approval.<\/li><li>The only agents that may be delegated to before approval (allow list, decision Q6) are <code>my-agent:explorer<\/code> and L2's <code>my-agent:scope-reviewer<\/code>, <code>my-agent:architect<\/code> and <code>my-agent:plan-reviewer<\/code>.<\/li><li><strong>The value the allow list checks:<\/strong> <code>tool_input.subagent_type<\/code> in the <code>Agent<\/code> call input. The hook judges only main-session calls (a call whose input has <code>agent_id<\/code>, from inside a subagent, passes at once), and <code>agent_type<\/code> in hook input is present only when the hook runs inside a subagent (hooks docs \"Common input fields\"). Judging by <code>agent_type<\/code>, the allow list would always be empty and the ② Plan phase could never start. A session started with <code>--agent<\/code> has <code>agent_id<\/code> on its main thread, so both gate hooks skip it.<\/li><li>Web research (<code>my-agent:researcher<\/code>) starts after the plan is approved, with one exception: Background research right after G1-A, for the <code>b&lt;n&gt;<\/code> questions the person confirmed with the scope (4.3, Q45). That pass is conditional, like the writer's prototype pass (see \"Exceptions\"), so the allow list keeps its four agents.<\/li><\/ul><\/li><li><strong>Effects of the move (Q21):<\/strong><ul><li>(a) The reference session changes from \"the session that called the skill\" to \"the session in <code>.active<\/code> <code>session:<\/code>\". A new session before <code>/my-agent continue<\/code> is not blocked (the <code>SessionStart<\/code> notice still fills that gap, 4.8.2); after <code>continue<\/code> takes the task over, the original session is not blocked.<\/li><li>(b) If either script breaks (an import error, for example), <code>onFailure: block<\/code> blocks that tool in every session that has the plugin on. The old escape \"open a new session that has not called the skill\" no longer works; the way out is <code>claude plugin disable<\/code> (4.11).<\/li><li>(c) The source label of the <code>ask<\/code> permission window changes from <code>[skill]<\/code> to <code>[plugin:my-agent]<\/code> (hooks docs).<\/li><li>(d) Every call of these tools in every session with the plugin on starts two more python processes (with no task they read a few files and end).<\/li><\/ul><\/li><li><strong>remaining risk:<\/strong><ul><li>Bash pattern checks do not catch every write. <code>scope-guard.py<\/code> reads inline interpreter code within the limits of 4.12 \"Inline interpreter code\" (a visible write with a literal path is judged; a script file's contents, code that starts another program, dynamic code, here-strings and in-place flags stay outside). <code>ma_bash.interpreter_writes<\/code> is called by scope-guard only: the pre-approval hook (<code>plan-approved-check.py<\/code>) and the verdict hook (<code>verdict-fresh-check.py<\/code>) do not read inline interpreter code, so they do not see such a write (the person's decision, 2026-11-22).<\/li><li>What it follows (v0.24): shell keywords (<code>if … then<\/code>, <code>for … do<\/code>, <code>{ }<\/code>, <code>!<\/code>), strings in <code>bash -c<\/code> · <code>sh -c<\/code> · <code>eval<\/code>, options that take a value such as <code>sudo -u &lt;user&gt;<\/code>, <code>cd<\/code> · <code>pushd<\/code> (<code>cd x &amp;&amp; cmd<\/code> checks <code>cmd<\/code> against <code>x<\/code> only; after the first other separator, or for <code>cd x; cmd<\/code>, <code>cd x || cmd<\/code> and a <code>cd<\/code> in <code>( )<\/code>, against every folder it could change to, because the <code>cd<\/code> may have failed). Single-quoted text is literal: a <code>$(<\/code> or backtick in a grep pattern is not a substitution. Heredoc delimiters may be any shell word (<code>EOF.txt<\/code>, <code>&#x27;EOF-1&#x27;<\/code>). Paths are compared case-insensitively (macOS default volume).<\/li><li><strong>Literal variables (2026-11-01):<\/strong> a path built from a variable is judged by where it resolves when the variable is assigned exactly once, to a literal, by a bare assignment at the top level of the same command line (<code>P=/abs/dir; cat $P/x<\/code>, <code>D=/abs/dir &amp;&amp; cd &quot;$D&quot; &amp;&amp; ls x<\/code>): not after <code>&amp;&amp;<\/code> or <code>||<\/code>, not in a pipeline, the background, <code>( )<\/code> or a compound command, and not as a prefix assignment (<code>P=/a cat $P/x<\/code>). The value is not empty, has no whitespace, glob character, brace, <code>$<\/code>, backtick, backslash or <code>!<\/code>, does not start with <code>~<\/code> and does not contain <code>:~<\/code>. Only <code>$NAME<\/code> and <code>${NAME}<\/code> expand, after the assignment, and not inside single quotes or after a backslash. Nothing else may name or set the variable, and if any command that can set a variable by a name the text does not show appears anywhere in the line (<code>eval<\/code>, <code>source<\/code>, <code>.<\/code>, <code>read<\/code>, <code>mapfile<\/code>, <code>readarray<\/code>, <code>unset<\/code>, the declaring builtins, <code>let<\/code>, <code>getopts<\/code>, <code>printf -v<\/code>, a shell with <code>-c<\/code>, <code>((<\/code>, or <code>IFS<\/code>), expansion is off for the whole line. The expanded path goes through every other rule (<code>cd<\/code>, <code>..<\/code>, links, secret paths, read and write scope), and the same rule feeds the write targets and the copy sources. Names the shell manages itself are never expanded, even when assigned once (<code>PWD<\/code>, <code>OLDPWD<\/code>, <code>REPLY<\/code>, <code>OPTIND<\/code>, <code>OPTARG<\/code>, <code>RANDOM<\/code>, <code>SECONDS<\/code>, <code>LINENO<\/code>, <code>_<\/code>, and any name starting with <code>BASH<\/code>): they stay \"cannot tell\". Every other variable (<code>$HOME<\/code> included: the environment sets it) stays unknown and is blocked as before.<\/li><li>What it cannot follow and therefore <strong>blocks<\/strong> (v0.24): command substitution outside single quotes (<code>`…`<\/code>, <code>$(…)<\/code>, also inside double quotes), a <code>$(<\/code> or backtick anywhere in the body of an unquoted heredoc (<code>&lt;&lt;EOF<\/code>; also an escaped one, which the shell keeps as text, so write such text with a quoted delimiter <code>&lt;&lt;&#x27;EOF&#x27;<\/code>), unclosed heredocs, a path with a variable that is not a literal (<code>$HOME/.ssh/x<\/code>; see the literal-variable rule below), <code>cd<\/code> to such a variable or to <code>-<\/code>, making a symlink and doing another write in the same command. For git, only a list of read subcommands (status, diff, log, show, blame, etc.) counts as reading; the <code>-c<\/code> global option and <code>--output<\/code> count as writing.<\/li><li>These gaps are accepted under principle 2 (prompt instructions are only an aid) and checked by looking at the diff at G3.<\/li><li>Patterns are pinned by case tests in <code>tests/<\/code>.<\/li><\/ul><\/li><\/ul><p><strong>What G1-B shows: mock-up and prototype<\/strong> (decided 2026-10-23)<\/p><div class=\"tbl\"><table><thead><tr><th>Item<\/th><th>Rule<\/th><\/tr><\/thead><tbody><tr><td><strong>mock-up<\/strong><\/td><td><strong>Required in every profile.<\/strong> architect writes it in the <code>## Mock-up<\/code> section of <code>plan.md<\/code>. It shows both the normal case and the exception cases listed in the scope document, and tags each case with its completion criterion number. The mock-up only illustrates the scope document; it adds no new requirements (my-dev plan.md rule).<\/td><\/tr><tr><td><strong>prototype<\/strong><\/td><td><strong>Optional.<\/strong> For work that must be seen to be judged, such as screen layout or document layout, architect writes in the <code>## Prototype<\/code> section of <code>plan.md<\/code> whether one is needed and why. The person decides whether to make it.<\/td><\/tr><tr><td><strong>prototype form<\/strong><\/td><td>A single HTML file in the task folder (<code>&lt;task_dir&gt;/&lt;task-id&gt;/prototype/index.html<\/code>), built by the writer with the plugin's own <code>mock-up<\/code> skill (<code>skills/mock-up/<\/code>: its template and references; L1 then runs <code>skills/mock-up/scripts/capture.sh<\/code> to render <code>index.png<\/code> and checks it, at most 3 fixes), and opened in the person's browser by the plugin script <code>monitor/open-html.py<\/code> (the <code>open<\/code> and <code>browser<\/code> keys of <code>monitor-config.json<\/code> on macOS, one tab through <code>webbrowser<\/code> elsewhere). It is not published anywhere and no harness tool is involved, so it works the same in Claude Code and Codex.<\/td><\/tr><tr><td><strong>Where it is shown<\/strong><\/td><td>The mock-up is saved in <code>plan.md<\/code>. The G1-B view on the Report tab shows the plan summary (the lead paragraph that architect writes at the top of <code>plan.md<\/code>), work units, estimate, <code>Models<\/code> rows and, when <code>prototype/index.html<\/code> exists, a link to the prototype that the monitor serves (<code>/api/tasks/&lt;key&gt;/prototype<\/code>, read-only) and opens in a new tab; without one the view says so. The chat report is <code>### Overview<\/code>, <code>### Takeaway<\/code>, the table and the pointer line (SKILL.md \"Gate reports\"), with a <code>Prototype<\/code> row when a prototype exists. The opener never stops the gate: on a <code>failed:<\/code> line L1 carries on and the pointer line gives the reason and the task folder. The popup question repeats the first two rows of the table.<\/td><\/tr><tr><td><strong>Overview first (2026-11-01; shorter 2026-11-03)<\/strong><\/td><td>E opens the chat report with an Item/Value table of 5–8 rows (task and profile; what is being approved; key decisions; counts; open risks or unhandled items; what each choice leads to), then a <code>### Details<\/code> heading with the full material; its \"Approving\" row says what is stuck. G1-A, G1-B and G3 (general and dev) keep the table but drop <code>### Details<\/code>: the Report tab holds the detail (plugin 0.9.0).<\/td><\/tr><tr><td><strong>Prototype at G1-A (2026-11-01)<\/strong><\/td><td>The scope interview asks once about screen behavior and look for a UI task (choice <code>Prototype before G1-A<\/code>), and a G1-A <code>Revise<\/code> answer may ask for one. L1 then adds <code>## Prototype<\/code> with <code>Prototype: requested<\/code> to <code>scope.md<\/code>; <code>plan-approved-check.py<\/code> lets <code>my-agent:writer<\/code> write <code>prototype/index.html<\/code> on that line (the same exception as the <code>plan.md<\/code> line). L1 checks and opens it (<code>open-html.py<\/code>) before showing G1-A, and the G1-B prototype is remade only if the mock-up changed (otherwise the existing file is opened again). Coder units that build UI get <code>prototype/index.html<\/code> as a layout reference (build.md step 3A).<\/td><\/tr><\/tbody><\/table><\/div><p><strong>G1-B sequence<\/strong> (run by L1)<\/p><ol><li>When the Plan Review verdict is in, write the <code>ask<\/code> line, open the Report tab (<code>open-html.py --report … --pointer<\/code>, which prints the pointer line; two calls, <code>--report<\/code> then <code>--url<\/code>, until 2026-11-16) and show <code>### Overview<\/code>, <code>### Takeaway<\/code>, the overview table and the pointer line. The mock-up is not pasted; it stays in <code>plan.md<\/code>.<\/li><li>If <code>## Prototype<\/code> is \"needed\", ask by popup: <code>Make a prototype (Recommended)<\/code> / <code>Mock-up is enough<\/code> / <code>Plan change<\/code>.<\/li><li>If a prototype is to be made:<ul><li>Leave a <code>Prototype: requested<\/code> line inside the <code>## Prototype<\/code> section of <code>plan.md<\/code>. This line opens the hard gate's exception.<\/li><li>Delegate to the L3 writer. writer makes <code>&lt;task_dir&gt;/&lt;task-id&gt;/prototype/index.html<\/code> to the <code>artifact-design<\/code> standard.<\/li><li>L1 reads and checks that file, then opens it with <code>open-html.py<\/code> and shows the local path with the script's one-line result. Nothing is published; the script only opens a local file.<\/li><\/ul><\/li><li>Show the approval popup: <code>Approve (Recommended)<\/code> / <code>Request changes<\/code> / <code>Abort<\/code>. No more than 4 choices (4.1.1).<\/li><li>On a change request, L1 archives the task folder and either edits <code>plan.md<\/code> itself when the change is small (a <code>fix: … files=plan.md before=G1-B<\/code> line) or leaves a <code>revision: … before=G1-B<\/code> line and hands it back to architect (4.8.1 \"Rewrite before approval\"), then returns to item 1. With delegated approval on, item 4 is answered by L1 with <code>Approve<\/code> (unless the third <code>REVISE<\/code> sent the judgment here). In the general profile and the dev small task G1-B is the first gate, so the person may also change the profile here (4.8.1). The prototype is remade only if the mock-up changed.<\/li><\/ol>"},"flow":" ① Define              ② Plan                  ③ Build                 ④ Accept\n Intake → Explore      Plan → Plan Review      Execute → Merge         Verify → Review·Deliver\n → Scope ──[G1-A]──►   ──[G1-B]──►             (G2: exceptions during run) ──►  ──[G3]──► done\n                                                 E: hand to the person from any phase when failures repeat","steps":[{"n":"1","phase":"① Define","name":"Intake","level":"L1 Router","what":"Classifies the request and sets the profile (the person's profile flag if given, otherwise the Router's recommendation, confirmed by the person in a popup) and task ID (4.7.3)","general":"←","research":"←","dev":"←","rules":[{"title":"Intake (step 1A, Router)","from":"plugins/my-agent/l1-orchestration/new-task.md","html":"<p>In order. In one message run the facts call (SKILL.md \"Data folder\") and Read <code>${CLAUDE_PLUGIN_ROOT}/l1-orchestration/recorder.md<\/code>. Items 1–5 and the Git check read its lines and run no command; the create call of item 6 does items 5–10 after all popups. If an item fails, show the reason and popup: <code>Retry (Recommended)<\/code> / <code>Abort<\/code>. Exit 1 or 2 of the create call wrote nothing. Exit 3 names what it wrote: show it in the popup; for both choices first finish \"Abort\" in <code>changes.md<\/code> when <code>.active<\/code> was written (<code>Retry<\/code> reruns the call).<\/p><ol><li><strong>Task already running:<\/strong> The task location candidates are the folder you ran in (its git root, if any), the location <code>&lt;data folder&gt;/active-index.json<\/code> gives for it, and the folders the item 2 popup offers. If <code>&lt;task_dir&gt;/.active<\/code> exists in one, popup: <code>Continue it (Recommended)<\/code> / <code>Abort that task and start new<\/code> / <code>Cancel<\/code>. If the task location is a git repository, add the choice <code>New task in a worktree<\/code> (\"Task worktree\" in <code>changes.md<\/code>). If its <code>uncommitted:<\/code> is above 0, ask about the changes as a second question in the popup. Continue it runs <code>continue<\/code>; abort first finishes \"Abort\" in <code>changes.md<\/code>. A valid profile flag applies only after <code>Abort that task and start new<\/code>; after <code>Continue it<\/code> or <code>Cancel<\/code> the flag is ignored. A request naming an existing file or skill outside the data folder: rerun the facts call with <code>--candidate &quot;&lt;that folder&gt;&quot;<\/code> before the item 2 popup.<\/li><li><strong>Task location:<\/strong><ul><li>Popup every time, also inside a git repository (<code>run_git:<\/code>): <code>Current folder (Recommended)<\/code> / <code>&lt;data folder&gt;<\/code> / <code>Other path<\/code>. <code>Current folder<\/code> is the repository root, or outside one the run folder. <code>Other path<\/code> asks for the path in a second popup (Other).<\/li><li>If the request names an existing file or skill outside the data folder, offer its folder (git root if any) first, <code>(Recommended)<\/code>.<\/li><li>If the chosen location is not one item 1 checked (an <code>Other path<\/code>) and has <code>&lt;task_dir&gt;/.active<\/code>, show the item 1 popup for it first (facts rerun with <code>--candidate &quot;&lt;path&gt;&quot;<\/code>).<\/li><li>The task folder is <code>&lt;task location&gt;/&lt;task_dir&gt;/&lt;task-id&gt;/<\/code>.<\/li><li>Then do the <strong>Git check<\/strong> (every profile; below item 11).<\/li><\/ul><\/li><li><strong>Profile:<\/strong> With a valid profile flag (Flags), use that profile; the Router does not pick. For <code>--dev<\/code> outside a git repository, popup with the reason: <code>Proceed as general (Recommended)<\/code> / <code>Abort<\/code> (<code>Abort<\/code> stops the call and creates nothing). After <code>Proceed as general<\/code>, <code>Request:<\/code> keeps <code>--dev<\/code> as its first word while <code>Profile:<\/code> is general; the label is <code>(set by you)<\/code>. Without a flag, the Router picks one from the request by the rules below and asks: popup with its pick first as <code>&lt;profile&gt; (Recommended)<\/code>, then the others (no <code>dev<\/code> outside a git repository); the question gives the reason for the pick in one line. If the person picks another profile, item 10 writes a <code>profile<\/code> line. Label in the report and first gate popup: <code>(set by you)<\/code> if a profile flag is among the leading flags of <code>Request:<\/code> or the run-log has a <code>profile<\/code> line (also after <code>continue<\/code>), else <code>(Router)<\/code>. Change it later: \"Profile change at the first gate\" in <code>changes.md<\/code>. The Router's pick:<ul><li><code>dev<\/code>: requests that change code in a git repository (feature, bug fix, refactoring); the deliverable is a commit. Outside a git repository, pick <code>general<\/code> and give the reason in the report.<\/li><li><code>research<\/code>: requests to research a topic into a note or report with sources (mainly web).<\/li><li><code>general<\/code>: any other multi-step task.<\/li><li><strong>Models preset:<\/strong> see \"Models preset\" below item 11.<\/li><\/ul><\/li><li><strong>Task ID:<\/strong> The create call makes <code>&lt;date&gt;-&lt;slug&gt;<\/code> from your <code>--slug<\/code> and adds <code>-b<\/code>, <code>-c<\/code> if the folder exists; the facts <code>date:<\/code> and <code>ids:<\/code> lines show the day's IDs. The slug: 2–4 English words for the request without the profile flag, lowercase, digits, hyphens, at most 30 characters. No question; the first gate popup shows it.<\/li><li>**<code>.gitignore<\/code>:** Only when the <code>gitignore:<\/code> line is <code>ask<\/code>, popup, question \"Commit the task log? The essential information goes into docs/blueprint, so committing it is not recommended.\": <code>Don&#x27;t commit (Recommended)<\/code> / <code>Commit<\/code>. Don't commit is <code>--gitignore ignore<\/code> (the line <code>*<\/code>); Commit is <code>--gitignore commit<\/code> (the line <code># my-agent: commit<\/code>).<\/li><li>**<code>.active<\/code> and index:** The one create call: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/intake.py&quot; create --loc &quot;&lt;task location&gt;&quot; --profile &lt;profile&gt; --slug &lt;slug&gt; --request=&#x27;&lt;the request line as is&gt;&#x27; [--preset &lt;name&gt;] [--follows &lt;task ID&gt;] [--gitignore ignore|commit] [--auto] [--router-pick &lt;Router&#x27;s pick&gt;] [--ask &#x27;&lt;fields&gt;&#x27; --answer &#x27;&lt;fields&gt;&#x27; ...] --model &lt;main session model ID&gt; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code>. A <code>&#x27;<\/code> in the request is written <code>&#x27;\\&#x27;&#x27;<\/code>; no other character changes. The <code>q=<\/code>, <code>rec=<\/code>, <code>choice=<\/code> values hold no quote characters (leave them out). The single-quoted <code>--request=<\/code>, <code>--ask<\/code> and <code>--answer<\/code> values are data: a backtick, <code>$(<\/code>, <code>;<\/code> or <code>|<\/code> inside them does not breach \"Tool choice\". When the create call is denied because the request quotes text the deny list refuses, write the request with Write to <code>&lt;data folder&gt;/request.txt<\/code> and pass <code>--request-file &quot;&lt;that path&gt;&quot;<\/code> in place of <code>--request=<\/code>. Exit 1 (<code>.active<\/code> or the task folder exists) and 2 (invalid argument, named in its message) write nothing. It writes <code>.active<\/code> (<code>phase: 1<\/code>, <code>started:<\/code> its own time, <code>session:<\/code> from the environment) and, when the task location differs from the folder you ran in (or its git root), one line <code>{&quot;&lt;run folder&gt;&quot;: &quot;&lt;task location&gt;&quot;}<\/code> in <code>&lt;data folder&gt;/active-index.json<\/code>.<\/li><li>**<code>intake.md<\/code>:** The create call writes it:<pre class=\"code\" data-lang=\"text\"><code>Status: active\nmy-agent: &lt;the facts plugin: value&gt;\nLocation: &lt;task location&gt;\nProfile: &lt;general | research | dev&gt;\nTask: &lt;task-id&gt;\nRequest: &lt;the request as written, one line; keep the leading valid flags as written, drop invalid flags the person let the Router replace&gt;<\/code><\/pre><p>For a follow-up, add <code>Follows: &lt;previous task ID&gt;<\/code> (<code>--follows<\/code>). When the preset file has presets for the profile, add <code>Models: &lt;preset&gt;<\/code> (<code>--preset<\/code>, Intake item 3).<\/p><\/li><li><strong>Project list:<\/strong> The create call adds one line to <code>&lt;data folder&gt;/projects.txt<\/code> when <code>listed:<\/code> is <code>no<\/code>, never deleting lines.<\/li><li><strong>Monitor:<\/strong> The create call starts it only with <code>&quot;autostart&quot;: true<\/code> in <code>&lt;data folder&gt;/monitor-config.json<\/code>; report its <code>monitor:<\/code> line as <code>Monitor: &lt;line&gt;<\/code>. Else it says <code>not started<\/code> and why (<code>autostart off<\/code>, or how to start by hand); the task goes on. Not a run-log line.<\/li><li><strong>Record:<\/strong> The create call writes the run-log lines in this order: <code>step n=1A name=Intake<\/code> (with a statusline file, also the <code>baseline<\/code> cost line); the flag popups and the item 1–5 popups in order asked, from <code>--ask &#x27;gate=Q q=&quot;&lt;question&gt;&quot; rec=&quot;&lt;choice&gt;&quot;&#x27;<\/code> / <code>--answer &#x27;gate=Q choice=&quot;&lt;choice&gt;&quot;&#x27;<\/code>; with <code>--auto<\/code>, <code>delegate state=on how=flag<\/code> (Delegation covers popups after it; the item 1–5 and flag popups go to the person); only when <code>Models:<\/code> was written, <code>models preset=&lt;name&gt; source=file<\/code>; only when the person picked another profile than the Router's (item 3), <code>profile from=&lt;Router&#x27;s pick&gt; to=&lt;choice&gt; back=- archive=-<\/code>. Handle <code>MISMATCH:<\/code> lines as <code>recorder.md<\/code> \"Failure handling\" says.<\/li><li><strong>Report:<\/strong> In 7 lines or fewer, show the task ID (<code>task:<\/code> line), task location, profile (<code>(set by you)<\/code> or <code>(Router)<\/code>) and monitor line; the git line (<code>Git: &lt;branch&gt;, clean<\/code> or <code>Git: &lt;branch&gt;, &lt;n&gt; uncommitted<\/code>, then add <code>, &lt;n&gt; behind origin/&lt;b&gt;<\/code> or <code>, behind not counted (&lt;case&gt;)<\/code>) only when the Git check ran; <code>Task folder: &lt;task_dir&gt;<\/code> only when it is not <code>.my-agent<\/code>; <code>Delegated approval: on (--auto)<\/code> only when it is on. Then step 1B in <code>define.md<\/code>.<\/li><\/ol><p><strong>Git check (item 2)<\/strong> — In every profile, once the location is set, read its <code>git:<\/code> line. Only when it is <code>true<\/code> (a local git repository), use <code>uncommitted:<\/code>, <code>branch:<\/code> and <code>behind:<\/code>. Otherwise skip the whole check: no question, no <code>Git:<\/code> line. The script leaves out <code>*.pyc<\/code> and <code>__pycache__/<\/code>; also leave out build outputs in <code>path:<\/code> lines. Popup only for a problem: uncommitted changes (not when item 1 already asked about them), a detached HEAD (<code>branch: (detached)<\/code>), the branch <code>main<\/code> or <code>master<\/code>, or a <code>behind:<\/code> count above 0 (also when it is the only one). The question lists the problems and the advice: commit or stash, or switch to a work branch; for a count, it names the count and <code>origin/&lt;default&gt;<\/code> and advises a pull or merge first. A <code>not counted (&lt;case&gt;)<\/code> line asks nothing. Choices: <code>Fix it first (Recommended)<\/code> / <code>Proceed as is<\/code> / <code>Abort<\/code> (<code>Abort<\/code> stops the call and creates nothing). After <code>Fix it first<\/code> and \"done\", rerun the facts call with <code>--candidate &quot;&lt;task location&gt;&quot;<\/code> and repeat the check. Item 11 shows the result.<\/p><p><strong>Models preset (item 3)<\/strong> — after the profile is set, read the facts <code>presets &lt;profile&gt;:<\/code> lines. Only with 2 or more presets, popup (an item 1–5 popup: to the person, recorded in item 10): the question opens with one line saying what a preset is; 2–4 choices, one per line, the first <code>(Recommended)<\/code>; each has one line on what its preset changes in cost or care, taken from its <code>presets<\/code> line. One preset or <code>none<\/code>: no popup (one preset: <code>standard<\/code> is used). An <code>error:<\/code> line: show the cause in one line and popup <code>Use definition values (Recommended)<\/code> / <code>Abort<\/code>; after <code>Use definition values<\/code> there is no <code>Models:<\/code> or <code>models<\/code> line, as with a missing file.<\/p>"}]},{"n":"2","phase":"① Define","name":"Explore → Scope <strong>(G1-A)<\/strong> → Background research","level":"L3 explorer → L1 → L2 scope-reviewer → L1 → (L3 researcher)","what":"Gathers facts, then interviews for WHAT/WHY, Scope Review judges <code>scope.md<\/code> against the request (profiles with G1-A), and the person confirms; right after G1-A <code>Confirm<\/code>, one researcher per confirmed <code>b&lt;n&gt;<\/code> question writes a note to <code>background/<\/code> before ② Plan (Background research, run-log <code>step n=1B name=Background-research<\/code>, Q45; skipped when the scope lists no question)","general":"Purpose and users, completion criteria, non-goals, deliverable location; Background research questions","research":"Questions, scope, source criteria, deliverable format; no Background research","dev":"my-dev Spec's 7 categories; Background research questions","rules":[{"title":"1B Explore → Scope","from":"plugins/my-agent/l1-orchestration/phases/define.md","html":"<ol><li>Record: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; step n=1B name=Explore-Scope --model &lt;main session model ID&gt; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code><\/li><li><strong>Explore:<\/strong> If the request is about existing files or a project, hand it to <code>my-agent:explorer<\/code>.<ul><li>Pass: the <code>intake.md<\/code> path and a list of what to find out (where the related files are, current behavior, constraints).<\/li><li>explorer writes no files; it returns a report (its last message), and L1 saves it as is to <code>explore.md<\/code>. If the first line is <code>PARTIAL<\/code>, follow recorder.md \"Failure handling\".<\/li><li>If the request alone is enough, do not delegate; write one line <code>Skipped: &lt;reason&gt;<\/code> in <code>explore.md<\/code>.<\/li><li><strong>Blueprint:<\/strong> check with Glob whether <code>&lt;task location&gt;/docs/blueprint/<\/code> has a file (the project blueprint: <code>features.md<\/code>, <code>decisions.md<\/code>, <code>backlog.md<\/code>; accept.md \"Blueprint update\"). If it has, hand Explore to explorer in every profile, also where the request alone would be enough, and add the blueprint to the list of what to find out; its report then has a <code>## Blueprint<\/code> section. When the request goes against a <code>Constraint<\/code>, <code>Non-goal<\/code> or <code>Decision<\/code> line, ask one popup that names the line: <code>Keep it (Recommended)<\/code> / <code>Change it<\/code>, with <code>ask gate=Q … rec=&quot;Keep it&quot;<\/code>/<code>answer gate=Q<\/code> lines before and after; on <code>Change it<\/code>, write the change into the scope (a criterion or a non-goal) so the plan and the blueprint follow it.<\/li><\/ul><\/li><li><strong>Scope interview:<\/strong> Settle WHAT/WHY. What to ask is in the profile file.<ul><li>If the profile file has an exception that skips the interview and G1-A (the small-task exception of the dev and general profiles), judge it from the explore result and follow it as written.<\/li><li>Ask one question at a time in a popup. When free input is needed, offer the Other field along with the choices.<\/li><li>Open with the profile file's scope-width popup.<\/li><li>Scope questions follow SKILL.md \"Question rules\" (multi-select or the Other field when the single recommended answer is likely to be replaced).<\/li><li>For a task with a screen, ask once about screen behavior and look (filters, progress graphics, animation), or put them in the recommendation. This question has the choice <code>Prototype before G1-A<\/code>, which triggers a G1-A prototype. A G1-A <code>Revise<\/code> answer that asks for a prototype does the same.<\/li><li><strong>Environment:<\/strong> for each <code>cannot run:<\/code> or <code>fail:<\/code> line under <code>## Check commands<\/code> in <code>explore.md<\/code>, ask one popup that names the command and the reason, with <code>ask gate=Q … rec=&quot;&lt;recommended choice&gt;&quot;<\/code>/<code>answer gate=Q<\/code> lines. This also holds when the interview is skipped (the small task).<ul><li><code>cannot run:<\/code> → <code>I fix the environment first (Recommended)<\/code> / <code>Judge without this command<\/code>; the Other field takes a command to use instead. After the first, run the command once when the person says it is fixed; if it still cannot run, ask again.<\/li><li><code>cannot run:<\/code> with nested project lines of which some run → <code>Run only the projects that run here (Recommended)<\/code> / <code>I fix the environment first<\/code> / <code>Judge without this command<\/code>. The first is written as <code>replaced by &lt;the command limited to those projects, each one named&gt;<\/code>.<\/li><li><code>fail:<\/code> → <code>Failures from before this task do not count (Recommended)<\/code> / <code>Fix them in this task<\/code> (then a completion criterion).<\/li><li>Write each answer except a fix that worked as one line under <code>## Environment<\/code> in <code>scope.md<\/code> (small task: in the summary's constraints): <code>- Environment: &lt;command&gt; — not run here (&lt;reason&gt;) | replaced by &lt;command&gt; | fails before the task (&lt;tests&gt;)<\/code>. The verifier follows these lines.<\/li><\/ul><\/li><li><strong>Background questions:<\/strong> at the end of the interview L1 writes questions for the web only when all three hold: (1) the answer changes a plan choice (work unit split, library, file layout); (2) the project cannot answer it (location, blueprint, reference files; <code>explore.md<\/code> <code>## Unverified<\/code> is the clue); (3) it is not the content of the deliverable (that stays with researcher units after G1-B). Write at most 4. With more candidates, keep the 4 that change the plan most; pass the rest to the architect in the step 2A call as candidates that were not researched, and it writes each as <code>To confirm<\/code>. None in the research profile, for a small task, or on a host without web tools (profile file, <code>hosts.md<\/code>). The questions get no popup of their own: the person confirms them with the scope at G1-A (<code>Revise<\/code> removes or edits one). Under delegated approval L1 answers G1-A as it does today, which confirms them.<\/li><li><strong>G1-A prototype:<\/strong> L1 adds <code>## Prototype<\/code> with the line <code>Prototype: requested<\/code> to <code>scope.md<\/code> with Edit (the plan-approved check then allows <code>my-agent:writer<\/code> to write the prototype). It hands <code>&lt;task_dir&gt;/&lt;task-id&gt;/prototype/index.html<\/code> to <code>my-agent:writer<\/code> with <code>scope.md<\/code> and the <code>mock-up<\/code> skill files (<code>${CLAUDE_PLUGIN_ROOT}/skills/mock-up/SKILL.md<\/code>, <code>templates/canvas.html<\/code> and the matching <code>references/*.md<\/code>, as plan.md \"G1-B plan approval\" item 2 lists them). L1 captures, checks and opens it as that item describes (<code>capture.sh<\/code>, <code>index.png<\/code>, <code>open-html.py<\/code>, the local path in the <code>Prototype<\/code> row), then shows G1-A. The G1-A popup keeps its three choices.<\/li><\/ul><\/li><li><strong>Confirm the scope:<\/strong><ul><li>Write <code>scope.md<\/code> (<code>## Completion criteria<\/code> as a numbered list <code>1.<\/code>, <code>2.<\/code>; every criterion ends with one check tag: <code>[check: command]<\/code>, <code>[check: file]<\/code>, <code>[check: URL]<\/code> or <code>[check: person]<\/code>), do \"Scope Review\" below, and record before and after the popup.<ul><li>Mark each line the person settled in the interview (an <code>- Environment:<\/code> line, a <code>Keep it<\/code>/<code>Change it<\/code> and a Person-check answer too) with <code> (the person&#x27;s choice)<\/code>, on a criterion right before its check tag. L1's reading and answers get no mark.<\/li><li>Background questions go in a <code>## Background research<\/code> section: one line each, <code>- b&lt;n&gt;: &lt;question&gt; — &lt;what it decides in the plan&gt;<\/code>. IDs are <code>b1<\/code>–<code>b4<\/code>, each used once, and every question has its own slug (kebab-case, for the note file name). With no questions there is no <code>## Background research<\/code> section (never an empty section or <code>none<\/code>).<\/li><li>Write no criterion only L1 can meet after G3 (the final save path, the blueprint update); name that work in the scope as done by L1 after G3.<\/li><li>Order: the Korean copy (gates.md \"Gate reports\"; Korean requests only), the <code>pre-gate.py<\/code> call, the chat report, the popup, the <code>answer<\/code> line.<\/li><li>Chat report (shown at that point; gates.md \"Gate reports\"): <code>### Overview<\/code>, <code>### Takeaway<\/code> (the scope summary: purpose, criteria count and non-goals; the findings applied after Scope Review, as at G1-B; with questions, the line <code>Background research: &lt;n&gt; questions<\/code>), the overview table (with the <code>Prototype<\/code> row when a prototype exists, and the <code>Background research<\/code> row with the questions) the findings table (gates.md \"Gate reports\") and the pointer line (both printed by <code>pre-gate.py<\/code>); no Details section. The popup follows gates.md's popup text.<\/li><li><code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/pre-gate.py&quot; --gate G1-A --task &quot;&lt;absolute task folder&gt;&quot; q=&quot;Scope confirmation: &lt;task-id&gt;&quot; rec=&quot;Confirm&quot; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code> (gates.md \"Gate reports\"; L1's own report, no writer). Then show the chat report, ending with the findings table and the pointer line it printed.<\/li><li><code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; answer gate=G1-A choice=&quot;&lt;Confirm/Revise/Abort&gt;&quot; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code><\/li><li>On <code>Revise<\/code> with a profile change, follow changes.md \"Profile change at the first gate\".<\/li><li>On Confirm, write <code>Confirmed &lt;YYYY-MM-DD HH:MM&gt;<\/code> in <code>## Confirmation<\/code> of <code>scope.md<\/code>, with the date and minute the <code>answer<\/code> line printed.<\/li><\/ul><\/li><li><strong>Person-check popup:<\/strong> before the G1-A popup, ask one popup per <code>[check: person]<\/code> criterion.<ul><li>Before it, say in the chat how the person checks it (the steps and where), then ask.<\/li><li>The question names the criterion number and text. Choices: <code>I check it before G3 and tell you (Recommended)<\/code> / <code>I check it after G3<\/code>; the Other field takes how and when the person checks it.<\/li><li>Record before the popup: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; ask gate=Q q=&quot;How criterion &lt;n&gt; is checked&quot; rec=&quot;I check it before G3 and tell you&quot; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code>, and after it: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; answer gate=Q choice=&quot;&lt;chosen choice&gt;&quot; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code>.<\/li><li>Write the answer into that criterion's text, before its tag.<\/li><li>On <code>I check it after G3<\/code>, right after the G1-B approval add the <code>Scope change: criterion &lt;n&gt; is checked by the user later<\/code> line (changes.md \"Adjust within approved scope\").<\/li><li>There is no \"decide at G3\" choice. A person who later finds they cannot check before G3 uses that same line; the verifier cites it as the evidence, and the G3 report lists such criteria.<\/li><\/ul><\/li><\/ul><\/li><li>If <code>scope.md<\/code> has a <code>## Background research<\/code> section, do \"Background research\" below. Then change <code>phase:<\/code> in <code>.active<\/code> to <code>2<\/code> and read <code>plan.md<\/code> (the phase file).<\/li><\/ol>"},{"title":"Background research","from":"plugins/my-agent/l1-orchestration/phases/define.md","html":"<p>Right after G1-A <code>Confirm<\/code>, before <code>phase:<\/code> changes to <code>2<\/code>. Only for the <code>b&lt;n&gt;<\/code> questions the person confirmed with the scope.<\/p><ol><li>Record: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; step n=1B name=Background-research --model &lt;main session model ID&gt; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code><\/li><li>Call one <code>my-agent:researcher<\/code> per question, all in one message. Prompt: first line <code>Background question: b&lt;n&gt; &lt;slug&gt;<\/code>, then the <code>scope.md<\/code> path, the question, the source criteria (the scope's, or else \"official docs and primary sources\") and the result path: the note <code>&lt;slug&gt;.md<\/code> in the <code>background<\/code> folder of the task folder, <code>&lt;task_dir&gt;/&lt;task-id&gt;/background/&lt;slug&gt;.md<\/code>.<\/li><li>Run the form check on each note (as research.md 3B Merge): the file exists and every item is <code>- &lt;claim&gt; · &lt;source URL&gt; · &quot;&lt;quote&gt;&quot;<\/code> or <code>- Not found: …<\/code>. A <code>DONE<\/code> whose note is missing or fails the form check counts as a worker that stopped once: say so in one line and follow recorder.md \"Failure handling\". A researcher that stops follows the same section.<\/li><li>If a note contradicts the scope (a fact against a criterion or a constraint, e.g. a required API is gone), the plan does not start; the note reopens G1-A with <code>Revise<\/code>, as changes.md \"Profile change at the first gate\" does, naming the note and the scope line.<\/li><\/ol>"},{"title":"Scope Review","from":"plugins/my-agent/l1-orchestration/phases/define.md","html":"<p>In profiles with G1-A, after <code>scope.md<\/code> is written and before the Person-check popups and the G1-A popup. Not when the profile skips the interview and G1-A (the small task), and not after a G1-A <code>Revise<\/code> (the person made that change).<\/p><ol><li>Hand it to <code>my-agent:scope-reviewer<\/code>. Pass: the paths of <code>intake.md<\/code>, <code>explore.md<\/code>, <code>scope.md<\/code>, and the result path <code>&lt;task_dir&gt;/&lt;task-id&gt;/scope-review.md<\/code>. Do not pass the interview or your explanation.<\/li><li>Handle the judgment like Plan Review findings (<code>plan.md<\/code> step 2B), with <code>scope.md<\/code> in place of <code>plan.md<\/code>: unmarked findings are applied without a popup. L1 wrote <code>scope.md<\/code>, so L1 makes every fix with Edit and records <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; fix what=&quot;Scope Review &lt;severity&gt; &lt;path&gt;:&lt;line&gt;&quot; files=scope.md --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code>.<ul><li><code>REVISE<\/code> (any BLOCKER): the popup first, then fix, keep that judgment with <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/archive.py&quot; --task &quot;&lt;absolute task folder&gt;&quot; --name scope-run&lt;its Run: value&gt; --only scope-review.md<\/code> (the findings table counts every round), then judge again. The third <code>REVISE<\/code> goes to the person in the G1-A popup, even while delegated approval is on (the popup is unchanged).<\/li><li>Marked findings: before the popup, the <strong>findings list table<\/strong> <code># | Severity | Location | Finding | Fix L1 would apply<\/code> (not the count table of gates.md \"Gate reports\"); the popup is laid out as in <code>plan.md<\/code> step 2B, with the SHOULD-FIX line: <code>Apply all (Recommended)<\/code> / <code>Confirm without applying<\/code> / <code>Pick myself<\/code>. <code>READY FOR CONFIRMATION<\/code>: never another round.<\/li><li>L1 writes the <code>## Decisions<\/code> lines in <code>scope-review.md<\/code>: <code>- &lt;severity&gt; &lt;path&gt;:&lt;line&gt; &lt;summary&gt; → applied by L1 | declined<\/code>.<\/li><\/ul><\/li><\/ol>"}]},{"n":"3","phase":"② Plan","name":"Plan","level":"L2 architect","what":"HOW, work split, parallel or not, number of subagents, <strong>mock-up (required)<\/strong>, whether a prototype is needed","general":"Task list + mock-up: a sample deliverable","research":"Sub-questions → research units → synthesis structure + mock-up: note outline and 1 sample paragraph","dev":"Work units (<code>### u&lt;n&gt;<\/code>) and parallel groups, flow diagram + mock-up: UI wireframe, CLI input/output, API request · response","rules":[{"title":"2A Plan","from":"plugins/my-agent/l1-orchestration/phases/plan.md","html":"<ol><li>Record: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; step n=2A name=Plan --model &lt;main session model ID&gt; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code><\/li><li>Hand it to <code>my-agent:architect<\/code>. Pass: the paths of <code>intake.md<\/code>, <code>explore.md<\/code> (and <code>scope.md<\/code>; for a small task, its 5-line summary), the <code>background/*.md<\/code> paths (when Background research ran) and the background candidates that were not researched (define.md \"Background questions\"), the preset name from <code>intake.md<\/code> <code>Models:<\/code> with the lines of <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/agent-models.py&quot; show --profile &lt;p&gt; --preset &lt;name&gt; --data-dir &quot;&lt;data folder&gt;&quot;<\/code> (none when there is no <code>Models:<\/code> line), and the result path <code>&lt;task_dir&gt;/&lt;task-id&gt;/plan.md<\/code>.<ul><li>After a plan-finding <code>Revise this task<\/code> (changes.md \"Plan findings (Review)\"), also pass as the change request the archived <code>review.md<\/code> path with the sent-back finding locations (locations only) and the shortfalls the person named in their own words, both from that revision's <code>## Revisions<\/code> line.<\/li><\/ul><\/li><li>Sections <code>plan.md<\/code> must have (if one is missing, have architect rewrite only that section):<ul><li>a lead paragraph right after the <code># Plan: &lt;task-id&gt;<\/code> title: one or two sentences on what the plan builds (not a <code>Profile:<\/code> line or a pointer to the criteria); the G1-B Report view shows it as the plan summary<\/li><li><code>## Scope summary<\/code> (small task): purpose, non-goals<\/li><li><code>## Completion criteria<\/code>: numbered list <code>1.<\/code>, <code>2.<\/code>, each criterion line ending with its check tag (small task; other tasks have it in <code>scope.md<\/code>)<\/li><li><code>## Work units<\/code>: per unit, a <code>### u&lt;n&gt; &lt;name&gt;<\/code> heading, the agent in charge, the list of files to change, the parallel group, <code>- Status: pending<\/code> (when rewriting, <code>done<\/code> for units whose results <code>## Existing work<\/code> keeps as they are)<\/li><li><code>## Reference files<\/code>: files outside the task folder that agents may read (scope-guard allows every worker's reads by this list)<\/li><li><code>## Mock-up<\/code> (<strong>required<\/strong>): first line <code>Kind: &lt;kind&gt;<\/code>, then a sample of the deliverable. Both the normal case and the exception cases in the scope, each tagged with its completion criterion number<\/li><li><code>## Models<\/code> (with a <code>Models:<\/code> line in <code>intake.md<\/code>): the preset name and a table of the agents the plan uses (model, effort, note), plus a <code>Recommendation:<\/code> line when architect proposes a change; without a preset, <code>Preset: standard (definition values)<\/code><\/li><li><code>## Prototype<\/code>: needed / not needed, and why<\/li><li><code>## Estimate<\/code>: number of subagents, workflow steps and agent count<\/li><li><code>## Existing work<\/code>: only when rewriting for a revision (rev). For each deliverable already made: keep / revise / discard<\/li><li><code>## Approval<\/code>: left empty<\/li><li><code>## Revisions<\/code>: if the previous <code>plan.md<\/code> had it, carried over as is at the very end<\/li><\/ul><\/li><li>If work units in the same parallel group change the same files, have them reordered to run in sequence.<\/li><\/ol>"}]},{"n":"4","phase":"② Plan","name":"Plan Review → (prototype) <strong>(G1-B)<\/strong>","level":"L2 plan-reviewer → (L3 writer) → L1","what":"Independent verdict → findings handled by L1 (small edit) or architect, the same in every profile → a prototype if needed → the person approves","general":"Plan Review can be skipped","research":"Scope gaps, source bias","dev":"Same as my-dev Plan Review","rules":[{"title":"2B Plan Review","from":"plugins/my-agent/l1-orchestration/phases/plan.md","html":"<ol><li>Record: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; step n=2B name=Plan-Review --model &lt;main session model ID&gt; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code><\/li><li><strong>Plan gaps:<\/strong> run <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/plan-lint.py&quot; --task &quot;&lt;absolute task folder&gt;&quot;<\/code>, also when Plan Review is skipped. Each <code>plan-lint: FAIL &lt;gap&gt;<\/code> line is fixed before anything else, like a BLOCKER in item 4 (a missing check tag in a confirmed <code>scope.md<\/code> is an L1 edit there; record <code>fix what=&quot;Plan gaps &lt;gap&gt;&quot;<\/code>), then run it again until <code>plan-lint: ok<\/code>. It is not a Plan Review round. The G1-B hook runs the same check and denies the <code>Approved<\/code> line while a gap is left. Whether to skip Plan Review follows the profile file. If skipped, write <code>SKIPPED &lt;reason&gt;<\/code> in <code>plan-review.md<\/code>.<\/li><li>Hand it to <code>my-agent:plan-reviewer<\/code>. Pass: the paths of <code>plan.md<\/code>, <code>intake.md<\/code>, <code>explore.md<\/code>, the same <code>agent-models.py show<\/code> lines as for architect, and the result path <code>plan-review.md<\/code>. Do not pass architect's explanation.<\/li><li>Handle the judgment the same way in every profile. \"Small\" is the SKILL.md level-table size (2 task files or fewer, about 10 lines); a finding that turns out larger goes to architect.<ul><li>**L1 edit of <code>plan.md<\/code>** (small): archive per \"Rewrite before approval\" below, edit <code>plan.md<\/code> with Edit (SKILL.md \"Tool choice\"), then record <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; fix what=&quot;Plan Revi
