t verdict overwrites <code>verify.md<\/code> and <code>review.md<\/code>, so the current verdict is kept first (<code>phases/accept.md<\/code>). 2026-11-26, plugin 0.33.0: a Review BLOCKER or G3 <code>Rework<\/code> round that sends back a <code>[plan]<\/code> finding takes the plan-finding popup first, and comes here only after <code>Adjust within approved scope<\/code> or <code>Fix within current plan<\/code> (\"Plan findings (Review)\" below).<\/p><p>Since 2026-11-25 (plugin 0.31.0) items 1–3 are one call, <code>l4-tools-guards/scripts/back-execute.py --task &lt;task folder&gt; --units &lt;u…&gt; --back &quot;&lt;reason&gt;&quot; --model &lt;model ID&gt; --data-dir … --task-dir …<\/code>. It checks every input before the first write (a <code>Run:<\/code> line in <code>verify.md<\/code>, at least one judgment file, each named unit a <code>### u&lt;n&gt;<\/code> heading of <code>plan.md<\/code> with a <code>- Status:<\/code> line, a <code>phase:<\/code> line in <code>.active<\/code>; a failed check exits 1 and writes nothing), then does items 1–3 in order and prints one line for each; a failure after the first write names what was written and what failed (exit 3).<\/p><ol><li>Archive <code>verify.md<\/code>, <code>review.md<\/code> and <code>changed-files.md<\/code> (each when present) with <code>archive.py --name run&lt;n&gt; --only verify.md review.md changed-files.md<\/code> to <code>archive/&lt;YYMMDD-hhmmss&gt;-run&lt;n&gt;/<\/code> (n is <code>Run:<\/code> of <code>verify.md<\/code>).<\/li><li>Set only the work units tied to the failed criteria (or the shortfalls named at G3) back to <code>Status: pending<\/code>. The last writer unit that assembles a document deliverable is also <code>pending<\/code> if any earlier unit is <code>pending<\/code>. The rest stay <code>done<\/code>.<\/li><li>Change the <code>phase:<\/code> of <code>.active<\/code> to <code>3<\/code>, and add <code>back=&quot;&lt;reason&gt;&quot; archive=&lt;archive folder&gt;<\/code> to the Execute <code>step:<\/code> line (example in 4.7.2). No new run-log kind is added. The monitor shows this line as \"back to Execute\". For a G3 <code>Rework<\/code> the reason holds the shortfalls the person named, with criterion numbers (2026-11-21), and <code>gate-report.py tally<\/code> lists every <code>back=<\/code> reason in a <code>Back to Execute reasons<\/code> row, so the retrospective can tell what the verifier missed. Since 2026-11-24 (plugin 0.29.0) the reason of a G3 <code>Rework<\/code> also holds the picked SHOULD-FIX locations (<code>&lt;path&gt;:&lt;line&gt;<\/code>), so L1 can rebuild the <code>changed-files.py<\/code> arguments after a context reset. The map step of every rerun (Verify FAIL, Review BLOCKER, G3 <code>Rework<\/code>) gets <code>--previous<\/code> and <code>--review<\/code> (the <code>review.md<\/code> of the archive folder this step wrote, when it exists and its <code>verify.md<\/code> is not <code>Verdict: FAIL<\/code>), and for a G3 <code>Rework<\/code> the <code>--rework-criterion<\/code> and <code>--rework-finding<\/code> arguments (\"Verify and Review scope\").<\/li><li>Each rerun of a work unit goes to a new worker; the prompt carries the archived paths of the earlier verdict (<code>archive/…-run&lt;n&gt;/<\/code>) and the failed criteria, and for a coder unit the path of <code>coder-notes.md<\/code> when it exists (4.7.6), not the earlier worker's transcript. A worker that stopped once is likewise replaced by a new one. 2026-11-26, plugin 0.33.0: at every coder call, a rerun or not, a coder unit's files to change include those a <code>Scope change:<\/code> line under <code>## Approval<\/code> of <code>plan.md<\/code> adds for that unit, and L1 names that line as their source (<code>build.md<\/code> step 3A item 3, where L1 builds the list).<\/li><li>The repeated Execute does not redo the base point (<code>base:<\/code>) or the uncommitted-changes popup, and coder runs in the main tree without a worktree. The changes already merged are not committed, so a worktree cannot see them (Q9).<\/li><\/ol><ul><li><strong>Small fix with only Review rerun (review A3):<\/strong> when L1 fixes a BLOCKER with a small fix and reruns only Review without Verify, L1 first archives the judgment files as for Back to Execute (2026-11-21: the new judgment overwrites <code>review.md<\/code>, and without the copy the findings table lost that round and the reviewer had no previous review to mark carried NITPICKs against), then uses Edit to add an <code>## Applied after review<\/code> section at the end of the new <code>review.md<\/code> and lists each fix on one line. The verdict freshness hook lets G3 save or commit pass only if this section exists when <code>verify.md<\/code> is older than the change (4.4). 2026-11-26, plugin 0.33.0: when the round sends back a <code>[plan]<\/code> finding, the plan-finding popup comes before this small fix, also when L1 could make it at once (\"Plan findings (Review)\" below); a round without one takes this path as before.<\/li><li><strong>Light path after G3 Rework (2026-11-25, plugin 0.31.0):<\/strong> when every open item is a NITPICK and the fix is a small fix (the SKILL.md level table), a G3 <code>Rework<\/code> takes the path of the bullet above instead of Back to Execute: L1 fixes the items (<code>fix<\/code> line), archives with <code>archive.py<\/code>, and only Review runs again, with the list of files L1 fixed; L1 then adds <code>## Applied after review<\/code>. Verify is not rerun. The round counts as one G3 Rework round (the cap of 3 under delegated approval). An open SHOULD-FIX or a larger fix still goes through Back to Execute. The rule text is <code>accept.md<\/code> step 4B item 7; the G3 popup line says so (4.4 \"Explanation lines\"). Reason: a NITPICK-only rework reran Execute and Verify for a few-line fix. 2026-11-26, plugin 0.33.0: when the items sent back include a <code>[plan]<\/code> finding, the plan-finding popup comes before the light path, and the path is taken only after <code>Adjust within approved scope<\/code> or <code>Fix within current plan<\/code>, under its own conditions (\"Plan findings (Review)\" below).<\/li><\/ul><p><strong>Plan findings (Review) (2026-11-26, plugin 0.33.0)<\/strong><\/p><p>A Review BLOCKER that is not a small fix, and a G3 <code>Rework<\/code> that is not on the light path, go to Back to Execute above, which only reruns work units the approved plan already has. A finding whose fix needs another approach, a new work unit or files outside the plan therefore had no route. The reviewer now marks such a finding, and L1 asks how to change course before any fix. The rule text is <code>changes.md<\/code> \"Plan findings (Review)\"; <code>accept.md<\/code> step 4B points to it.<\/p><ul><li><strong>A popup of its own:<\/strong> the plan-finding popup (the \"marked-finding popup\" of the task scope that added it; another popup than the marked-findings popup of Scope Review and Plan Review in 4.4). It stands next to the four-choice kind popup of \"Classify the request\" above, which is unchanged and still asked for a request the person types.<\/li><li><strong>The mark:<\/strong> <code>[plan]<\/code> means that fixing the finding needs a change to the approach of <code>plan.md<\/code>, to its set of work units or to its target files (a file added by a <code>Scope change:<\/code> line under <code>## Approval<\/code> of <code>plan.md<\/code> counts as a target file); the reviewer sets it for any severity and in every profile (4.5). A finding is marked only when, on its <code>review.md<\/code> line, the exact lower-case token stands right before <code>[criterion …]<\/code> (BLOCKER, SHOULD-FIX) or right before <code>(new)<\/code>/<code>(carried)<\/code> (NITPICK). The token anywhere else, such as quoted in the problem text, reads as unmarked.<\/li><li><strong>When it is asked:<\/strong> before any fix of a round that sends back a marked finding: the BLOCKERs after Review, or the items a G3 <code>Rework<\/code> sends back (picked, all open items, or a set that would take the light path). The popup comes before the small fix, the light path and Back to Execute, also when the marked fix is small enough for L1 to make it, and no fix starts before its answer. A round that sends back no marked finding is handled as before. A marked item that is not sent back (taken, or not picked) gets no popup and stays an open item. A shortfall the person names in their own words carries no mark and follows the rules of an unmarked round; in a round answered <code>Revise this task<\/code> it is part of the change request.<\/li><li><strong>The popup:<\/strong> one per round, also for a round with marked and unmarked findings. Its label line is <code>[4B] Review → Deliver · Q<\/code>, and it follows the popup layout of the question rules: a short question; one <code>- <\/code> line for each marked finding sent back, with what it contains (severity, location, text); when a SHOULD-FIX is listed, a plain <code>- <\/code> line that a SHOULD-FIX is a problem worth fixing that does not block the gate; one <code>- <\/code> line per choice saying what it leads to; <code>- Next:<\/code> last. It has exactly three choices, <code>Adjust within approved scope<\/code>, <code>Revise this task<\/code> and <code>Fix within current plan<\/code>, the recommended one first with <code>(Recommended)<\/code>. It is recorded with <code>ask gate=Q … rec=&quot;&lt;recommended&gt;&quot;<\/code> and <code>answer gate=Q choice=&quot;&lt;choice&gt;&quot;<\/code> (<code>by=L1<\/code> when L1 answers). The answer covers the whole round, its unmarked findings included.<\/li><li><strong>Recommendation:<\/strong> <code>Revise this task<\/code> when the approach or the set of work units must change, and also when the approved request does not stand (the fix changes the purpose, completion criteria, non-goals, constraints or exception cases). Otherwise <code>Adjust within approved scope<\/code>: the approved request stands, and the planned units can make the fix once one more target file, behavior or dependency is allowed. <code>Fix within current plan<\/code> is never recommended and is always listed last, because L1 does not set the reviewer's mark aside; the person can still pick it. With several marked findings, the largest need decides.<\/li><li>**<code>Adjust within approved scope<\/code>:** the record of the table in \"Classify the request\": the <code>Scope change:<\/code> line under <code>## Approval<\/code> and its <code>fix<\/code> line; the approval is kept. The round is then handled as without a mark (after Review: small fix or Back to Execute; after a G3 <code>Rework<\/code>: light path or Back to Execute). L1 passes the <code>Scope change:<\/code> line to every worker of the round. The line names the unit and each added file, and L1 adds those files to the files to change in each later rerun call of that unit, naming the <code>Scope change:<\/code> line as their source.<\/li><li>**<code>Revise this task<\/code>:** items 2–8 above, with no <code>back-execute.py<\/code>: back to ② Plan when only the method changes, and to ① Define when the purpose, completion criteria, non-goals, constraints or exception cases change (item 3 above); every gate is passed again from that phase. At the architect call L1 passes the path <code>archive/&lt;time&gt;-rev&lt;new rev&gt;/review.md<\/code> as the change request (the findings of the round, the unmarked ones included, so they go to the new plan with the marked ones), the locations (severity and <code>path:line<\/code>, no explanation) of the findings the round sends back (all open items for <code>Rework: fix all open items<\/code>), and the shortfalls the person named in their own words in that G3 <code>Rework<\/code> round, as written. L1 writes <code>plan finding<\/code>, those locations and those shortfalls, as written, into the <code>&lt;what changed&gt;<\/code> part of the <code>## Revisions<\/code> line (item 5), and takes the locations and shortfalls from that line at the architect call (<code>phases/plan.md<\/code> step 2A item 2). The architect carries that section over, so they survive a compaction or <code>continue<\/code>, also across ① Define.<\/li><li>**<code>Fix within current plan<\/code>:** the round is handled exactly as a round without a mark: the small fix, the light path or Back to Execute, each under its own conditions.<\/li><li><strong>Delegated approval:<\/strong> when it is on, L1 answers with the recommended choice, <code>Revise this task<\/code> included. Whatever the answer, the round counts as one round of the loop it came from: after Review, the Review BLOCKER loop; at a G3 where L1 answered <code>Rework: fix all open items<\/code>, the G3 fix loop. <code>Revise this task<\/code> restarts neither count, and there is no new cap. When it is off, the settled-popup rule (4.4) applies.<\/li><li><strong>The same finding comes back:<\/strong> when a marked finding with the same severity and location returns in a later Review after <code>Fix within current plan<\/code> or <code>Adjust within approved scope<\/code>, the popup is asked again. The earlier answer did not clear it, so this one is not settled: the person is asked unless delegated approval is on, and then the loop caps and E end the repetition. When the earlier choice could not add the unit or the approach the fix needs, <code>Revise this task<\/code> is recommended.<\/li><li><strong>Other answers and the 4th revision:<\/strong> an answer typed in the Other field, or a question back, follows the question rules. The popup before a 4th revision (item 8 above) still applies.<\/li><li><strong>What stays:<\/strong> no new gate, agent or run-log line kind; the popup uses the <code>ask<\/code>, <code>answer<\/code>, <code>fix<\/code> and <code>revision<\/code> records. The parsers need no change: the mark stays part of the finding's text, the criterion tag and <code>(new)<\/code>/<code>(carried)<\/code> are read as before, and a finding keeps its identity (severity, location), so the findings table and the Report tab count it as before. A <code>review.md<\/code> without the mark is read as before.<\/li><\/ul><p><strong>What the files look like after a revision<\/strong><\/p><pre class=\"code\" data-lang=\"text\"><code>&lt;work project&gt;/&lt;task_dir&gt;/\n├── .active                          # task unchanged, only phase set to the phase gone back to\n└── 261024-cli-json-output/          # same task, so the folder stays\n    ├── scope.md                     # (if gone back to ①) ## Confirmation emptied\n    ├── plan.md                      # ## Approval emptied, ## Revisions line at the end, ## Existing work after the rewrite\n    ├── work/                        # left as is → keep/revise/discard in Existing work\n    ├── run-log.md                   # continued (revision: rev=1 … state=pending, revision: rev=1 state=done)\n    └── archive/\n        ├── 261024-140500-rev0-draft/ # before the rewrite for a G1-B change request (rewrite before approval)\n        ├── 261024-150000-run1/       # verify.md before going back to Execute on Verify FAIL\n        └── 261024-153000-rev1/      # whole state just before the revision (incl. work/, prototype/, verdict files)\n            └── discarded/           # work/ files discarded in the changed plan<\/code><\/pre>"}]},{"id":".archived/<task-id>/","steps":["R"],"writer":"the person (archive-tasks.py)","comment":"finished tasks moved out of the monitor's list by archive-tasks.py (4.8.2)","sources":[{"title":"archive-tasks.py (docstring)","from":"plugins/my-agent/l4-tools-guards/scripts/archive-tasks.py","html":"<p>Move finished task folders out of the monitor's list (architecture 4.8.2 \"Task records over time\").<\/p><p>usage: archive-tasks.py [--days N] [--dry-run] [--projects FILE] [--data-dir DIR] [--task-dir DIR] For each project in the project list, a task folder <code>&lt;project&gt;/&lt;task_dir&gt;/&lt;task-id&gt;/<\/code> whose <code>intake.md<\/code> says <code>Status: done<\/code> or <code>Status: aborted<\/code>, and whose last run-log line (or <code>intake.md<\/code> change, without a run-log) is N days old or more (default 30), moves to <code>&lt;project&gt;/&lt;task_dir&gt;/.archived/&lt;task-id&gt;/<\/code> (<code>-b<\/code>, <code>-c<\/code> … when the name is taken). The task named in that project's <code>.active<\/code> never moves. Before a move, a task without <code>main-usage.json<\/code> gets one (usage-snapshot) while its transcript still exists; a task whose transcript is gone moves anyway. The monitor, the menu bar app and <code>/my-agent status<\/code> read only <code>&lt;task_dir&gt;/*/<\/code>, so moved tasks leave them without any change there. To bring a task back, move its folder back to <code>&lt;task_dir&gt;/<\/code>. --task-dir is the task subfolder (setting <code>task_dir<\/code>, default .my-agent). --dry-run prints what would move and changes nothing. The project list is $MA_PROJECTS_FILE, else &lt;data folder&gt;/projects.txt ($MA_TASKS_DIR, else the setting (--data-dir or CLAUDE_PLUGIN_OPTION_DATA_DIR), else ~/.my-agent-data). Transcripts: $MA_CLAUDE_PROJECTS. Run by the person (not by L1). exit: 0 done (also when nothing was due), 2 bad arguments, 3 a move failed.<\/p>"}]}],"vocab":[{"title":"agents (plugin.json lists the same ten; frontmatter `level:` and the folder say the same level)","items":[{"name":"AGENTS","value":"scope-reviewer L2 · architect L2 · plan-reviewer L2 · verifier L2 · reviewer L2 · gate-analyst L2 · explorer L3 · researcher L3 · writer L3 · coder L3","note":""},{"name":"LEVEL_FOLDER","value":"L2 l2-design-judge · L3 l3-workers","note":""},{"name":"UNIT_AGENTS","value":"researcher · writer · coder","note":"agents that run a plan.md work unit (E: unit stops)"},{"name":"BEFORE_APPROVAL","value":"explorer · scope-reviewer · architect · plan-reviewer","note":"G1-B allow list (4.4, Q6)"}]},{"title":"verdicts: the first line of each judge's file and last message","items":[{"name":"VERIFY_PASS","value":"Verdict: ALL PASS","note":""},{"name":"VERIFY_FAIL","value":"Verdict: FAIL","note":""},{"name":"PLAN_READY","value":"READY FOR APPROVAL","note":""},{"name":"PLAN_REVISE","value":"REVISE","note":""},{"name":"SCOPE_READY","value":"READY FOR CONFIRMATION","note":"scope-review.md; its other verdict is PLAN_REVISE"},{"name":"PLAN_SKIPPED","value":"SKIPPED","note":"L1 writes `SKIPPED <reason>` when the profile skips Plan Review"},{"name":"REVIEW_PASS","value":"BLOCKER 0","note":""},{"name":"REVIEW_PREFIX","value":"BLOCKER ","note":""},{"name":"WORKER_DONE","value":"DONE","note":""},{"name":"WORKER_PARTIAL","value":"PARTIAL","note":""},{"name":"APPLIED_AFTER_REVIEW","value":"Applied after review","note":"review.md section L1 adds after a fix that skips re-Verify"}]},{"title":"run-log kinds written by the L4 hooks","items":[{"name":"GUARD","value":"guard","note":"run-log kind of a guard deny (scope-guard, plan-approved-check)"},{"name":"GUARD_FIELDS","value":"hook · agent · id · tool · decision · why · cwd","note":"guard: field order; why = the reason as printed, cwd = the hook input's cwd (older lines end at why)"}]},{"title":"status values","items":[{"name":"INTAKE_STATUS","value":"active · done · aborted","note":"intake.md `Status:` (first word)"},{"name":"UNIT_STATUS","value":"pending · running · done · stale","note":"plan.md work unit `Status:`"},{"name":"UNIT_FINISHED","value":"done · stale","note":"every unit ends in one of these (check-run)"},{"name":"END","value":"ok · partial · error","note":"stop: end="},{"name":"INTERRUPTED","value":"partial · error","note":"an end that counts as a worker stop (E)"},{"name":"GATES","value":"G1-A · G1-B · G2 · G3 · E","note":""},{"name":"POPUP_TAGS","value":"G1-A · G1-B · G2 · G3 · E · Q","note":"Q: an L1 popup that is not a gate"},{"name":"PEOPLE_POPUPS","value":"G1-A · G1-B · G3 · E · Q","note":"L1 popups (G2 is Claude Code's permission window)"},{"name":"LEGACY_GATES","value":"G1a G1-A · G1b G1-B","note":"old run-log values, still read"},{"name":"STEPS","value":"('1A', 'Intake') · ('1B', 'Explore → Scope') · ('2A', 'Plan') · ('2B', 'Plan Review') · ('3A', 'Execute') · ('3B', 'Merge') · ('4A', 'Verify') · ('4B', 'Review → Deliver')","note":""},{"name":"STEP_IDS","value":"1A · 1B · 2A · 2B · 3A · 3B · 4A · 4B","note":""}]},{"title":"models","items":[{"name":"FAMILY","value":"(opus|sonnet|haiku|fable)","note":""},{"name":"CODEX_DEFAULT","value":"gpt-6-luna","note":""},{"name":"CODEX_FAMILY","value":"(gpt-6-luna|gpt-5\\.6-luna|gpt-5\\.6-terra|codex-auto-review|gpt-reserve)","note":""},{"name":"ANTIGRAVITY_FAMILY","value":"(gemini-[a-z0-9._-]+)","note":""}]},{"title":"run-log lines (4.7.2): `<YYYY-MM-DD HH:MM:SS> <kind>: <key=value ...>`","items":[{"name":"LINE_RE","value":"^(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}) ([a-z][a-z0-9-]*):(?:\\s+(.*))?$","note":""},{"name":"DELEGATE_STATES","value":"on · off","note":"`delegate: state=` (delegated approval); the last such line is the current state"},{"name":"ANSWERED_BY_L1","value":"L1","note":"`answer: ... by=L1` is an answer L1 gave under delegated approval"},{"name":"PLAN_EDIT_GATE","value":"G1-B","note":"`fix: ... before=G1-B` (old logs: G1b) is an L1 edit of plan.md before plan approval"},{"name":"STAMPED","value":"^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2} ","note":"looks like a record, readable or not"}]},{"title":"plan.md markers and work units","items":[{"name":"APPROVED","value":"Approved\\s+(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2})","note":"under ## Approval, L1 only"},{"name":"PROTOTYPE","value":"(?m)^\\s*(?:-\\s*)?Prototype:\\s*requested\\s*$","note":"under ## Prototype, L1 only"},{"name":"UNIT_HEAD","value":"^###\\s+(u\\d+)\\b\\s*(.*)$","note":"`### u1 <name>` under ## Work units"},{"name":"UNIT_STATUS_LINE","value":"^\\s*(?:-\\s*)?Status:\\s*([a-z]+)","note":""},{"name":"UNIT_MARK","value":"(?m)^Work unit:\\s*(u\\d+)\\b","note":"first prompt line L1 gives a unit's worker"},{"name":"BACKGROUND_MARK","value":"(?m)^Background question:\\s*(b\\d+)\\b","note":"first prompt line of a Background research researcher"},{"name":"BACKGROUND_ITEM","value":"^-\\s*(b\\d+):","note":"`- b<n>: <question> — …` under ## Background research"},{"name":"CONFIRMED_LINE","value":"(?m)^Confirmed ","note":"under ## Confirmation, L1 only (G1-A Confirm)"},{"name":"MOCKUP_KIND","value":"^Kind:\\s*(.*)$","note":"first line of ## Mock-up"},{"name":"DELIVERED_COMMIT","value":"commit:","note":"`Delivered: commit:<sha>` / deliver path="}]},{"title":"report parsers (monitor Report tab; each returns None or [] for a missing or empty text)","items":[{"name":"CRITERION_LINE","value":"^\\s*(\\d+)\\.\\s+(.*\\S)\\s*$","note":""},{"name":"CHECK_TAG","value":"\\s*\\[check:\\s*([^\\]]*?)\\s*\\]\\s*$","note":""},{"name":"VERIFY_ROW","value":"^\\s*-\\s*(\\d+)\\.\\s+([A-Z]+)\\b\\s*(.*)$","note":""},{"name":"RUN_LINE","value":"(?m)^Run:\\s*(\\d+)\\s*$","note":""},{"name":"REVIEW_BLOCKERS","value":"^BLOCKER\\s+(\\d+)\\b","note":""},{"name":"SEVERITIES","value":"BLOCKER · SHOULD-FIX · NITPICK","note":""},{"name":"FINDING_LINE","value":"^-\\s*(BLOCKER|SHOULD-FIX|NITPICK)\\s+(\\S+)\\s*(.*)$","note":""},{"name":"FINDING_MARK","value":"\\s*\\((new|carried)\\)\\s*$","note":""},{"name":"FINDING_CRITERION","value":"\\s*\\[criterion\\s*([^\\]]*?)\\s*\\](?=\\s*(?:\\((?:new|carried)\\)\\s*)?$)","note":""},{"name":"IMPROVEMENT_LINE","value":"^-\\s*\\[(L\\d),\\s*([a-z]+)\\]\\s*(.*\\S)\\s*$","note":""},{"name":"SUMMARY_ITEM","value":"^\\s*\\d+\\.\\s+(.*\\S)\\s*$","note":""},{"name":"UNIT_KEY","value":"^(?:-\\s*)?([A-Z][A-Za-z ]*?):\\s*(.*)$","note":""},{"name":"PATH_TOKEN","value":"[\\w./\\-]+\\.\\w+(?::\\d+(?:-\\d+)?)?|/?[\\w.\\-]+(?:/[\\w.\\-]+)+/?|[\\w.\\-]+/","note":""},{"name":"LOCATION","value":"^(.*?)(?::(\\d+)(?:-(\\d+))?)?$","note":""},{"name":"EXTENSION","value":"\\.\\w+$","note":""}]},{"title":"plan gaps (the approval check of plan-lint.py and the G1-B hook; architecture 4.4 \"Plan gaps\")","items":[{"name":"CHECK_TAGS","value":"command · file · URL · person","note":""},{"name":"COVERS","value":"\\(criteri(?:on|a)\\s+(\\d+(?:\\s*(?:,|and)\\s*\\d+)*)\\)","note":"`(criterion 2)`, `(criteria 2, 3)`"},{"name":"PROFILE_LINE","value":"(?m)^Profile:\\s*([a-z]+)","note":""},{"name":"BACKGROUND_PLAN_MARK","value":"\\(background\\s+(b\\d+)\\)","note":"`(background b2)` in plan.md"}]},{"title":"gate view parsers (monitor Report tab; same rule: None or [] for a missing text, never raise)","items":[{"name":"LABEL_LINE","value":"^(?:-\\s*)?(Background|Purpose):\\s*(.*)$","note":""},{"name":"UNLABELED_SKIP","value":"^(?:Users:|-\\s*Non-goals:|-\\s*Deliverable location:)","note":""},{"name":"VERDICT_LINE","value":"^Verdict:\\s*(ALL PASS|FAIL)\\b","note":""},{"name":"DECISION_LINE","value":"^-\\s*(BLOCKER|SHOULD-FIX|NITPICK)\\s+(\\S+)\\s*(.*)$","note":""},{"name":"ABORTED_LINE","value":"(?m)^Status:\\s*aborted\\b(?:[ \\t]+\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2})?[ \\t]*(.*?)[ \\t]*$","note":""},{"name":"MODELS_KEYS","value":"agent · model · effort · note","note":""}]},{"title":"changed-file map (`changed-files.py` writes it; the verifier and the reviewer read it, accept.md step 4A)","items":[{"name":"CHANGED_FILES","value":"changed-files.md","note":""},{"name":"CHANGED_COLUMNS","value":"file · units · criteria · fingerprint · since","note":""},{"name":"REJUDGE_LINE","value":"(?m)^Re-judge:\\s*(.*?)\\s*$","note":""},{"name":"ALL_CRITERIA","value":"all","note":""}]},{"title":"Korean copy of the report texts (`report-ko.py` lists what to translate; L1 writes it; the Report tab reads it)","items":[{"name":"KO_COPY","value":"report-ko.json","note":""}]},{"title":"findings: Found, Fixed and Open of review.md, plan-review.md and scope-review.md (Report tab and findings.py)","items":[{"name":"PLAN_REVIEW_FIX","value":"^Plan Review (BLOCKER|SHOULD-FIX|NITPICK)\\s+(.*)$","note":"`fix: what=` of a plan edit before G1-B"},{"name":"REVISION_ARCHIVE","value":"-rev\\d+(?:-profile)?(?:-[b-z])?$","note":"Revise this task, profile change: an earlier revision ends"}]}],"skillLevels":"<div class=\"tbl\"><table><thead><tr><th>Level<\/th><th>Who<\/th><th>Does<\/th><th>Does not<\/th><\/tr><\/thead><tbody><tr><td>L1<\/td><td>main session (this skill)<\/td><td>runs phases, delegates, merges, asks all questions, records<\/td><td>make deliverables (code, notes, drafts, plans) itself. Exception: small fixes a judgment pointed out (2 files or fewer, about 10 lines), and small <code>plan.md<\/code> edits before G1-B (Plan Review findings, G1-B <code>Request changes<\/code>), and an inline role's work (below). A small fix that changes a decision the person made is asked in a popup first; after an L1 HTML edit, run a syntax check.<\/td><\/tr><tr><td>L2<\/td><td>scope-reviewer · architect · plan-reviewer · verifier · reviewer · gate-analyst<\/td><td>plans, judges, interprets decisions<\/td><td>change deliverables, delegate further<\/td><\/tr><tr><td>L3<\/td><td>explorer · researcher · writer · coder<\/td><td>the one work unit assigned<\/td><td>touch files outside the scope, delegate further<\/td><\/tr><tr><td>L4<\/td><td>tools·MCP · hooks · permission rules · scripts<\/td><td>run, record, block<\/td><td>judge<\/td><\/tr><\/tbody><\/table><\/div><p>The monitor and the G2 dialog are outside the levels.<\/p><ul><li><strong>Inline role:<\/strong> when <code>agent-models.py<\/code> shows a role as <code>model=inline … pass=inline<\/code>, do not start that agent: where the phase file or the plan hands work to it, read its definition (<code>${CLAUDE_PLUGIN_ROOT}/l2-design-judge/agents/&lt;role&gt;.md<\/code> or <code>…/l3-workers/agents/&lt;role&gt;.md<\/code>) and follow it yourself with the hand-off's inputs; write its result file where the agent would, then record the <code>inline<\/code> line (Recorder rules). A role the phase does not start (explorer when <code>explore.md<\/code> says <code>Skipped:<\/code>) has no inline run or line.<\/li><li>L1 hands work to L2 and L3 directly, passing only paths and criteria. Never pass the author's explanation to a judge.<\/li><\/ul>","l1DoesNot":"make deliverables (code, notes, drafts, plans) itself. Exception: small fixes a judgment pointed out (2 files or fewer, about 10 lines), and small <code>plan.md<\/code> edits before G1-B (Plan Review findings, G1-B <code>Request changes<\/code>), and an inline role's work (below). A small fix that changes a decision the person made is asked in a popup first; after an L1 HTML edit, run a syntax check."};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lvClass = id => 'l' + String(id).replace(/\D/g, '');
const agentById = Object.fromEntries(D.agents.map(a => [a.id, a]));
const levelOf = Object.fromEntries(D.levels.flatMap(l => l.comps.map(c => [c.id, l])));
const PROFILES = ['general', 'research', 'dev'];
let profile = 'general';
try { profile = localStorage.getItem('ma-profile') || 'general'; } catch (e) {}

const TICKS = /\x60([^\x60]+)\x60/g;
function src(s, open) {
  return `<details class="src"${open ? ' open' : ''}><summary><span>${esc(s.title).replace(TICKS, '<code>$1</code>')}</span><span class="from">${esc(s.from || '')}</span></summary><div class="md">${s.html}</div></details>`;
}
function sec(title, html, open, from) { return src({ title, html, from }, open); }
function compLink(c, l) {
  return `<a class="comp" href="#levels/${c.id}"><b>${esc(c.name)}</b><small>${esc(c.sub || summary(c.id) || '')}</small></a>`;
}
function levelNote(l) {
  const paren = l.title.match(/\(([^)]*)\)\s*$/);
  return /main session/.test(l.title) ? l.title.split(' · ').slice(1).join(' · ') : paren ? paren[1] : '';
}
const plain = h => h.replace(/\s*\(<strong>[^<]*<\/strong>\)|\s*<strong>\([^<]*\)<\/strong>/g, '');
function summary(id) {
  const a = agentById[id];
  return a ? `${a.model} · ${a.effort}` : '';
}
// Same letters as STEP_CODE in plugins/my-agent/monitor/web/index.html; change both together.
const STEP_CODE = {'1':'1A','2':'1B','3':'2A','4':'2B','5':'3A','6':'3B','7':'4A','8':'4B'};
const stepCode = n => STEP_CODE[n] || n;
const stepLetter = n => STEP_CODE[n] ? STEP_CODE[n].slice(1) : n;
function stepName(n) {
  if (n === 'R') return 'Retrospective';
  if (n.startsWith('G1')) return 'G1-B approval';
  const s = D.steps.find(x => x.n === n);
  return s ? `${stepCode(n)} ${s.name.replace(/<[^>]+>/g, '')}` : n;
}
function stepChip(n) {
  const href = /^\d$|^R$/.test(n) ? `#flow/${n}` : `#flow/gates`;
  return `<a class="chip" href="${href}">${esc(stepName(n))}</a>`;
}
function artChip(a) { return `<a class="chip" href="#artifacts/${encodeURIComponent(a.id)}">${esc(a.id)}</a>`; }
function writes(agentId) { return D.artifacts.filter(a => a.writer.includes('my-agent:' + agentId)); }

/* ---------- overview ---------- */
function viewOverview() {
  const gates = D.gates.length, steps = D.steps.length;
  const phases = [...new Set(D.steps.map(s => s.phase))];
  const gateAfter = { '2': 'G1-A', '4': 'G1-B', '8': 'G3' };
  return `<h1 class="page">How my-agent is put together</h1>
  <p class="lede">${esc(D.description)}. Every value on this page is read from the plugin files of version ${esc(D.version)} (design ${esc(D.design)}) by <code>tools/build-docs.py</code>.</p>
  <div class="kpis">
    <a class="kpi" href="#levels" style="color:inherit;text-decoration:none"><b>${D.levels.length}</b><span>levels</span></a>
    <a class="kpi" href="#levels/L2" style="color:inherit;text-decoration:none"><b>${D.agents.length}</b><span>subagents (L2 ${D.agents.filter(a => a.level === 'L2').length} · L3 ${D.agents.filter(a => a.level === 'L3').length})</span></a>
    <a class="kpi" href="#flow" style="color:inherit;text-decoration:none"><b>${phases.length} · ${steps}</b><span>phases · steps</span></a>
    <a class="kpi" href="#flow/gates" style="color:inherit;text-decoration:none"><b>${gates}</b><span>human gates (${D.gates.map(g => g.id).join(' · ')})</span></a>
  </div>
  <div class="ov-grid">
    <section class="panel"><h2>Four levels <small>select a component for its role and permissions</small></h2>
      <div class="person">The person (user · maintainer) ⇄ L1 Gatekeeper: every question as a choice popup</div>
      ${D.levels.map((l, i) => `<div class="lvbox ${lvClass(l.id)}">
        <div class="lh"><b>${l.id}</b><a href="#levels/${l.id}">${esc(l.name)}</a><span>${esc(levelNote(l))}</span></div>
        <div class="comps">${l.comps.map(c => compLink(c, l)).join('')}</div></div>
        ${i === 0 ? '<div class="arrow-note">↓ L1 delegates to L2 and to L3 directly — paths and criteria only; L2 never manages L3</div>' : ''}
        ${i === 2 ? '<div class="arrow-note">↓ L2 and L3 call L4; L4 shows G2 permission requests to the person</div>' : ''}`).join('')}
    </section>
    <div class="stack">
      <section class="panel"><h2>Four phases, eight steps <small>gates close each phase</small></h2>
        <div class="rail">${phases.map(p => `<div class="ph"><div class="pn">${esc(p)}</div>
          ${D.steps.filter(s => s.phase === p).map(s => `<a class="st" href="#flow/${s.n}"><b>${stepLetter(s.n)}</b><span>${plain(s.name)}</span></a>`).join('')}
          <div class="gend">${D.steps.filter(s => s.phase === p && gateAfter[s.n]).map(s => `<a class="badge gate" href="#flow/gates">${gateAfter[s.n]}</a>`).join('')}</div></div>`).join('')}</div>
        <p class="muted" style="font-size:12.5px;margin:10px 0 0">G2 (risky action) can appear during any step; E (escalation) hands control to the person when failures repeat.</p>
      </section>
      <section class="panel"><h2>Principles</h2><div class="md">${D.principles}</div></section>
    </div>
  </div>
  <section class="panel"><h2>Delegation paths</h2><div class="md">${D.delegation}</div></section>`;
}

/* ---------- levels ---------- */
function levelsSide(cur) {
  const items = D.levels.map(l => `<a class="lvl ${lvClass(l.id)}" href="#levels/${l.id}" aria-current="${cur === l.id}">${l.id} · ${esc(l.name)}</a>`
    + l.comps.map(c => `<a class="sub ${lvClass(l.id)}" href="#levels/${c.id}" aria-current="${cur === c.id}">${esc(c.name)}${agentById[c.id] ? `<span class="tag">${agentById[c.id].model}</span>` : ''}</a>`).join('')).join('');
  const opts = D.levels.map(l => `<option value="${l.id}"${cur === l.id ? ' selected' : ''}>${l.id} · ${esc(l.name)}</option>`
    + l.comps.map(c => `<option value="${c.id}"${cur === c.id ? ' selected' : ''}>&nbsp;&nbsp;${esc(c.name)}</option>`).join('')).join('');
  return `<aside class="side"><div class="list"><h3>Levels and components</h3>${items}</div>
    <select onchange="location.hash='levels/'+this.value" aria-label="Level or component">${opts}</select></aside>`;
}
function viewLevels(id) {
  id = id || 'L1';
  const lv = D.levels.find(l => l.id === id);
  let body;
  if (lv) body = levelDetail(lv);
  else if (agentById[id]) body = agentDetail(agentById[id]);
  else if (levelOf[id]?.id === 'L1') body = l1Detail(levelOf[id].comps.find(c => c.id === id));
  else if (levelOf[id]?.id === 'L4') body = l4Detail(levelOf[id].comps.find(c => c.id === id));
  else body = `<p>Unknown component <code>${esc(id)}</code>.</p>`;
  return `<div class="split">${levelsSide(id)}<div class="${lvClass((lv || levelOf[id] || {}).id || 'L1')}">${body}</div></div>`;
}
function levelDetail(lv) {
  const cards = lv.comps.map(c => {
    const a = agentById[c.id];
    const tail = a ? `<div class="chips">${a.tools.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : '';
    return `<a class="card ${lvClass(lv.id)}" href="#levels/${c.id}"><b>${esc(c.name)}</b><p>${esc(a ? a.description.replace(/^my-agent L\d [^.]*\.\s*/, '') : c.sub)}</p>${a ? `<p class="mono">${a.model} · effort ${a.effort}${a.maxTurns ? ' · maxTurns ' + a.maxTurns : ''}</p>` : ''}${tail}</a>`;
  }).join('');
  return `<div class="panel"><div class="dhead"><span class="badge lv">${lv.id}</span><h1>${esc(lv.name)}</h1></div>
    <p class="desc">${esc(lv.title)}</p>
    <div class="kv"><div>Runs in</div><div>${lv.runsIn}</div><div>Information it sees</div><div>${lv.sees}</div>
      <div>Output</div><div>${lv.output}</div><div>What it cannot do</div><div>${lv.cannot}</div></div></div>
    <div class="panel"><h2>Components <small>${lv.comps.length}</small></h2><div class="cards">${cards}</div></div>
    ${lv.id === 'L2' || lv.id === 'L3' ? `<div class="panel"><h2>Read and write scope <small>scope-guard.py, every my-agent:* call</small></h2><div class="md">${D.scopeDoc}</div>${scopeMatrix(D.agents.filter(a => a.level === lv.id))}</div>` : ''}
    ${lv.id === 'L1' ? `<div class="panel"><h2>Level table in SKILL.md</h2><div class="md">${D.skillLevels}</div></div>` : ''}
    ${lv.id === 'L4' ? `<div class="panel"><h2>About the levels</h2><div class="md">${D.levelNotes}</div></div>` : ''}`;
}
function scopeList(xs) { return xs.length ? xs.map(x => `<code>${esc(x)}</code>`).join(' ') : '<span class="muted">nothing</span>'; }
function scopeMatrix(list) {
  return `<div class="tbl"><table><thead><tr><th>Agent</th><th>Reads</th><th>Writes</th><th>Bash writes</th><th>Web</th><th>Before G1-B</th></tr></thead><tbody>
    ${list.map(a => `<tr><td><a class="mono" href="#levels/${a.id}">${a.id}</a></td><td>${scopeList(a.scope.read)}</td><td>${scopeList(a.scope.write)}${a.scope.denyWrite.length ? `<br><span class="muted">never: </span>${scopeList(a.scope.denyWrite)}` : ''}</td>
      <td>${a.scope.bashWrites ? '<span class="badge ok">yes</span>' : '<span class="badge no">no</span>'}</td><td>${a.scope.web ? '<span class="badge ok">yes</span>' : '<span class="badge no">no</span>'}</td>
      <td>${a.beforeApproval ? '<span class="badge ok">allowed</span>' : '<span class="badge">after approval</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}
function agentDetail(a) {
  const allTools = D.l4.tools;
  const used = PROFILES.map(p => {
    const u = D.profiles[p].used[a.id];
    return `<tr><td class="mono">${p}</td><td>${u ? u[0] : '<span class="muted">not used</span>'}</td><td>${u ? u[1] : ''}</td></tr>`;
  }).join('');
  const ws = writes(a.id);
  const fmt = a.sections.filter(s => /format|sections/i.test(s.title));
  const rest = a.sections.filter(s => !fmt.includes(s));
  return `<div class="panel"><div class="dhead"><span class="badge lv">${a.level}</span><h1>${esc(a.call)}</h1></div>
    <p class="desc">${esc(a.description)}</p>
    <div class="md">${a.role}</div>
    <div class="facts"><div class="fact"><span>Model</span><b>${esc(a.model)}</b></div><div class="fact"><span>Effort</span><b>${esc(a.effort)}</b></div>
      <div class="fact"><span>maxTurns</span><b>${esc(a.maxTurns || '—')}</b></div>
      <div class="fact"><span>Before G1-B approval</span><b>${a.beforeApproval ? 'allowed' : 'blocked'}</b></div>
      <div class="fact"><span>Runs plan work units</span><b>${a.unitAgent ? 'yes (unit=u&lt;n&gt;)' : 'no'}</b></div></div>
    <p class="muted mono" style="font-size:11.5px;margin:8px 0 0">${esc(a.file)}</p></div>
  <div class="panel"><h2>Permissions <small>tools from the definition frontmatter; paths enforced by scope-guard.py</small></h2>
    <div class="chips" style="margin-bottom:10px">${allTools.map(t => `<span class="chip ${a.tools.includes(t) ? '' : 'off'}">${esc(t)}</span>`).join('')}<span class="chip off">Agent</span></div>
    <div class="tbl"><table><tbody>
      <tr class="scope-row"><td>Reads</td><td>${scopeList(a.scope.read)}</td></tr>
      <tr class="scope-row"><td>Writes</td><td>${scopeList(a.scope.write)}</td></tr>
      ${a.scope.denyWrite.length ? `<tr class="scope-row"><td>Never writes</td><td>${scopeList(a.scope.denyWrite)}</td></tr>` : ''}
      <tr class="scope-row"><td>Bash that writes</td><td>${a.scope.bashWrites ? 'allowed' : 'blocked (read and check commands only)'}</td></tr>
      <tr class="scope-row"><td>Web</td><td>${a.scope.web ? 'allowed' : 'blocked'}</td></tr>
      <tr class="scope-row"><td>Secret files</td><td>blocked for every agent — <code>deny</code> rules: ${D.l4.deny.filter(x => x.startsWith('Read(')).map(x => `<code>${esc(x)}</code>`).join(' ')}</td></tr>
      <tr class="scope-row"><td>Delegate further</td><td>no — the <code>Agent</code> tool is left out of every definition</td></tr>
    </tbody></table></div></div>
  <div class="panel"><h2>Where it is used <small>"Agents used" in each profile file</small></h2>
    <div class="tbl"><table><thead><tr><th>Profile</th><th>Steps</th><th>Result</th></tr></thead><tbody>${used}</tbody></table></div>
    ${ws.length ? `<p style="margin:8px 0 0"><span class="muted">Deliverables: </span>${ws.map(artChip).join(' ')}</p>` : ''}</div>
  <div class="panel"><h2>Definition <small>sections of the agent file</small></h2>
    ${fmt.map(s => sec(s.title, s.html, true, 'output format')).join('')}
    ${rest.map(s => sec(s.title, s.html, s.title === 'Rules' || s.title === 'Input' || s.title === 'When done')).join('')}</div>`;
}
function l1Detail(c) {
  const d = D.l1[c.id] || { leads: [], sources: [] };
  const steps = d.leads.map(n => D.steps.find(s => s.n === n));
  return `<div class="panel"><div class="dhead"><span class="badge lv">L1</span><h1>${esc(c.name)}</h1></div>
    <p class="desc">${esc(c.sub)} · runs inside the main session as part of the my-agent skill</p>
    ${steps.length ? `<p><span class="muted">Leads steps: </span>${steps.map(s => stepChip(s.n)).join(' ')}</p>` : ''}
    <p class="muted" style="font-size:12.5px"><span class="muted">Does not: </span>${D.l1DoesNot}</p></div>
    <div class="panel"><h2>Rules</h2>${d.sources.map(s => src(s, true)).join('')}
    ${steps.map(s => s.rules.map(r => src({ ...r, title: `Step ${stepCode(s.n)} · ${r.title}` }, false)).join('')).join('')}</div>`;
}
function l4Detail(c) {
  const L = D.l4;
  if (c.id === 'hooks') {
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>hooks</h1></div><p class="desc">${esc(c.sub)}</p>
      <div class="tbl"><table><thead><tr><th>Event</th><th>Matcher</th><th>Script</th><th>Where</th><th>On failure</th><th>What it does</th></tr></thead><tbody>
      ${L.hooks.map(h => `<tr><td class="mono">${esc(h.event)}</td><td><code>${esc(h.matcher)}</code></td><td class="mono">${esc(h.script)} ${esc(h.arg)}</td><td>${esc(h.where)}</td><td>${h.onFailure === 'block' ? '<span class="badge no">block</span>' : '<span class="badge">exit 0</span>'}</td><td>${esc(h.doc)}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="panel"><h2>G1-B hard gate</h2><div class="md">${L.hardGate}</div></div>`;
  }
  if (c.id === 'permission-rules') {
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>permission rules</h1></div><p class="desc">${esc(c.sub)} · <code>l4-tools-guards/permissions/permissions.json</code>, applied by <code>permission-guard.py</code> only while a task is active</p>
      <div class="two"><div><h3 style="font-size:13px;margin-bottom:6px">ask <span class="badge gate">G2</span></h3><div class="chips">${L.ask.map(x => `<code>${esc(x)}</code>`).join('')}</div></div>
      <div><h3 style="font-size:13px;margin-bottom:6px">deny</h3><div class="chips">${L.deny.map(x => `<code>${esc(x)}</code>`).join('')}</div></div></div></div>
      <div class="panel"><h2>What G2 asks about</h2><div class="md">${L.g2}</div></div>`;
  }
  if (c.id === 'scripts') {
    const list = xs => `<div class="tbl"><table><tbody>${xs.map(s => `<tr><td class="mono" style="white-space:nowrap">${esc(s.name)}</td><td>${esc(s.doc)}</td></tr>`).join('')}</tbody></table></div>`;
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>scripts</h1></div><p class="desc">${esc(c.sub)} · <code>l4-tools-guards/scripts/</code></p>${list(L.scripts)}</div>
      <div class="panel"><h2>Shared library <small>l4-tools-guards/lib/ — used by hooks, scripts and the monitor</small></h2>${list(L.lib)}</div>`;
  }
  const head = `<tr><th>Agent</th>${L.tools.map(t => `<th>${esc(t)}</th>`).join('')}<th>Agent</th></tr>`;
  const rows = D.agents.map(a => `<tr><td><a href="#levels/${a.id}">${a.call}</a></td>${L.tools.map(t => a.tools.includes(t) ? '<td class="yes">●</td>' : '<td class="nope">·</td>').join('')}<td class="nope">·</td></tr>`).join('');
  return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>${esc(c.name)}</h1></div><p class="desc">Built-in tools and MCP servers run what the agents ask for. Which tools each subagent may call is fixed in its definition frontmatter (<code>tools:</code>); no definition has <code>Agent</code>, so no subagent can delegate.</p>
    <div class="tbl"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>
    <div class="panel"><h2>What limits the tools</h2><div class="md">${D.scopeDoc}</div></div>`;
}

/* ---------- flow ---------- */
function viewFlow(sub) {
  const P = D.profiles[profile];
  const phases = [...new Set(D.steps.map(s => s.phase))];
  const gateAfter = { '2': 'G1-A', '4': 'G1-B', '8': 'G3' };
  const gateById = Object.fromEntries(D.gates.map(g => [g.id, g]));
  const agentsIn = n => Object.entries(P.used).filter(([, u]) => new RegExp(`(^|[^0-9])${n}([^0-9]|$)`).test(u[0].replace(/<[^>]+>/g, ''))).map(([id]) => id);
  const stepCard = s => {
    const lvl = (s.level.match(/L\d/) || ['L1'])[0];
    const arts = D.artifacts.filter(a => a.steps.length <= 3 && (a.steps.includes(s.n) || (s.n === '4' && a.steps.some(g => g.startsWith('G1')))));
    const ag = s.n === 'R' ? ['gate-analyst'] : agentsIn(s.n);
    const lines = (s[profile] !== undefined) ? `<div class="row"><span>${esc(profile)} profile</span><div>${s[profile]}</div></div>` : '';
    return `<article class="step ${lvClass(lvl)}${sub === s.n ? ' hl' : ''}" id="step-${s.n}">
      <div class="sh"><span class="n">${s.n === 'R' ? '↺' : stepLetter(s.n)}</span><h3>${s.name}</h3><span class="badge lv">${esc(s.level)}</span></div>
      ${s.what ? `<div class="row"><span>What it does</span><div>${s.what}</div></div>` : ''}${lines}
      ${ag.length ? `<div class="row"><span>Agents</span><div class="chips">${ag.map(id => `<a class="chip" href="#levels/${id}">my-agent:${id}</a>`).join('')}</div></div>` : ''}
      ${arts.length ? `<div class="row"><span>Deliverables</span><div class="chips">${arts.map(artChip).join('')}</div></div>` : ''}
      ${s.rules.map(r => src({ ...r, title: 'L1 procedure · ' + r.title }, false)).join('')}</article>`;
  };
  const gateBar = id => { const g = gateById[id]; return g ? `<div class="gatebar"><b>${id}</b><span>${g.gate.replace(/^<strong>|<\/strong>$/g, '')} — ${g.choices}</span><a href="#flow/gates" style="margin-left:auto;font-size:12px">details</a></div>` : ''; };
  return `<h1 class="page">Steps, gates and profiles</h1>
  <p class="lede">The 8 steps run in pairs as 4 phases, and each phase ends at a gate. Pick a profile to see what changes.</p>
  <div class="toolbar"><div class="seg" role="group" aria-label="Profile">${PROFILES.map(p => `<button type="button" data-prof="${p}" aria-pressed="${p === profile}">${p}</button>`).join('')}</div>
    <span class="muted" style="font-size:12.5px">${esc(P.title)} · <a href="#artifacts/run-log.md">run-log.md</a> gets lines in every step</span></div>
  <section class="panel"><h2>Overview <small>architecture 4.3</small></h2><pre class="code flowtext"><code>${esc(D.flow)}</code></pre><div class="md">${P.intro}</div></section>
  ${phases.map(p => `<section class="phase-block"><h2>${esc(p)}</h2>${D.steps.filter(s => s.phase === p).map(s => stepCard(s) + (gateAfter[s.n] ? gateBar(gateAfter[s.n]) : '')).join('')}${p === phases[phases.length - 1] ? stepCard(D.retro) : ''}</section>`).join('')}
  <section class="panel" id="step-gates" style="scroll-margin-top:110px"><h2>HITL gates <small>architecture 4.4</small></h2>
    <div class="tbl"><table><thead><tr><th>Gate</th><th>When</th><th>Enforcement</th><th>What the person sees</th><th>Choices</th></tr></thead><tbody>
    ${D.gates.map(g => `<tr><td>${g.gate}</td><td>${g.when}</td><td>${g.enforcement}</td><td>${g.sees}</td><td>${g.choices}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><h2>Rules per phase · ${esc(profile)} <small>${esc(P.file)}</small></h2>
    <div class="tbl"><table><thead><tr><th>Step</th><th>Rule</th></tr></thead><tbody>${P.rules.map(r => `<tr><td style="white-space:nowrap">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><h2>Skipping and combining</h2><div class="md">${D.skip}</div></section>`;
}

/* ---------- artifacts ---------- */
function viewArtifacts(id) {
  id = id ? decodeURIComponent(id) : 'plan.md';
  const a = D.artifacts.find(x => x.id === id) || D.artifacts[0];
  const top = D.artifacts.filter(x => x.id.startsWith('.'));
  const inTask = D.artifacts.filter(x => !x.id.startsWith('.'));
  const link = x => `<a href="#artifacts/${encodeURIComponent(x.id)}" aria-current="${x.id === a.id}">${esc(x.id)}<span class="tag">${x.steps.length > 3 ? 'all' : x.steps.map(stepCode).join(' ')}</span></a>`;
  const opts = D.artifacts.map(x => `<option value="${encodeURIComponent(x.id)}"${x.id === a.id ? ' selected' : ''}>${esc(x.id)}</option>`).join('');
  const agents = D.agents.filter(g => a.writer.includes('my-agent:' + g.id));
  return `<div class="split"><aside class="side"><div class="list tree"><h3>&lt;task location&gt;/&lt;task_dir&gt;/</h3>${top.map(link).join('')}
      <div class="root">&lt;task-id&gt;/</div>${inTask.map(link).join('')}</div>
      <select onchange="location.hash='artifacts/'+this.value" aria-label="File">${opts}</select></aside>
    <div><div class="panel"><div class="dhead"><h1>${esc(a.id)}</h1></div>
      ${a.comment ? `<p class="desc">${a.comment}</p>` : ''}
      <div class="kv"><div>Written by</div><div>${esc(a.writer)} ${agents.map(g => `<a class="chip" href="#levels/${g.id}">${g.call}</a>`).join(' ')}</div>
        <div>Steps</div><div class="chips">${a.steps.map(stepChip).join('')}</div>
        <div>Path</div><div><code>${esc(a.id.startsWith('.') ? `<task location>/<task_dir>/${a.id}` : `<task location>/<task_dir>/<task-id>/${a.id}`)}</code></div></div></div>
      <div class="panel"><h2>Format and rules <small>${a.sources.length} source${a.sources.length > 1 ? 's' : ''}</small></h2>${a.sources.map(s => src(s, true)).join('') || '<p class="muted">No format is written down for this file.</p>'}</div></div></div>`;
}

/* ---------- shared words ---------- */
function viewVocab() {
  return `<h1 class="page">Shared words and shapes</h1>
  <p class="lede">The words hooks, scripts and the monitor parse — verdict lines, status values, gate names, run-log line shape, plan.md markers. They live in one place, <code>l4-tools-guards/lib/ma_schema.py</code>, and <code>test_schema.py</code> checks that each agent definition still spells them.</p>
  ${D.vocab.map(g => `<section class="panel"><h2>${esc(g.title)}</h2><div class="tbl"><table><thead><tr><th>Name</th><th>Value</th><th>Note</th></tr></thead><tbody>
    ${g.items.map(i => `<tr><td class="mono" style="white-space:nowrap">${esc(i.name)}</td><td><code>${esc(i.value)}</code></td><td>${esc(i.note)}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}`;
}

/* ---------- router ---------- */
function route() {
  const [view, sub] = (location.hash.replace(/^#/, '') || 'overview').split('/');
  const v = ['overview', 'levels', 'flow', 'artifacts', 'vocab'].includes(view) ? view : 'overview';
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.v === v ? 'page' : 'false'));
  $('main').innerHTML = { overview: viewOverview, levels: viewLevels, flow: viewFlow, artifacts: viewArtifacts, vocab: viewVocab }[v](sub);
  if (v === 'flow' && sub) { const el = $('step-' + sub); if (el) el.scrollIntoView({ block: 'start' }); }
  else window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-prof]');
  if (!b) return;
  profile = b.dataset.prof;
  try { localStorage.setItem('ma-profile', profile); } catch (err) {}
  const y = window.scrollY; route(); window.scrollTo(0, y);
});
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('ma-theme') || 'auto'; } catch (e) {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  $('theme').textContent = 'Theme: ' + theme;
}
$('theme').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  try { localStorage.setItem('ma-theme', theme); } catch (e) {}
  applyTheme();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const v = ['overview', 'levels', 'flow', 'artifacts', 'vocab'][+e.key - 1];
  if (v) location.hash = v;
});
$('ver').textContent = `plugin ${D.version} · design ${D.design}`;
applyTheme();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
