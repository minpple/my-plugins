 new files from <code>git -C &lt;worktree&gt; ls-files --others --exclude-standard<\/code> first, then write the diff with <code>git -C &lt;worktree&gt; diff --binary HEAD --output=&lt;task folder&gt;/work/&lt;unit&gt;.patch<\/code> and move it with <code>git apply &lt;that file&gt;<\/code>, then compare each moved file with its worktree copy (<code>cmp<\/code>, one call each); all equal: read its branch (<code>git -C &lt;worktree&gt; branch --show-current<\/code>), <code>git worktree remove --force &lt;worktree&gt;<\/code>, <code>git branch -D &lt;branch&gt;<\/code>; when that removal is refused, for any reason, make one attempt only per worktree, then keep that worktree and its branch (no <code>git branch -D<\/code>), name the path of each kept worktree in one chat line and in the \"Open risks\" row of G3. Ask no popup and go on with the next worktree and the rest of 3B Merge. Each worktree is handled on its own: the others are removed as usual. For a refused removal, no <code>git worktree unlock<\/code> and kill no process. Compare result, a difference: keep the worktree and name the files in one chat line and in the \"Open risks\" row of G3, no popup. When <code>git -C &lt;worktree&gt;<\/code> is refused, copy the files the coder report lists with <code>cp -p<\/code> (absolute paths) and compare with <code>cmp<\/code>. For conflicts, see <code>build.md<\/code> item 6. After moving everything, do \"Upstream check\" below, then run the check commands (tests, lint) from <code>explore.md<\/code>. If they fail, hand the unit back to its coder in the main tree along with the failing tests."],["4A Verify","verifier judges each criterion from the changed-file map (<code>accept.md<\/code> step 4A) and the <code>git diff<\/code> of its files, <code>git status --porcelain<\/code>, new files and check command results; it alone runs the tests and check commands (once each per run); a rerun re-judges only the failed and touched criteria. The second line of <code>verify.md<\/code>, <code>Run:<\/code>, is the round. On 3 FAILs in a row, E."],["4B Review → G3","reviewer looks at the code review and the definition of done (<code>review.md<\/code>), citing the test results in <code>verify.md<\/code> instead of running the suites again. G3 is commit approval (\"G3 in the dev profile\" below: diff stat and commit message as table rows; the message lists the criterion numbers)."]],"agents":[["<code>my-agent:explorer<\/code>","1B","report → L1 saves it to <code>explore.md<\/code>"],["<code>my-agent:scope-reviewer<\/code>","1B (before G1-A; not for a small task)","<code>scope-review.md<\/code>"],["<code>my-agent:architect<\/code>","2A, G1-B revisions","<code>plan.md<\/code>"],["<code>my-agent:plan-reviewer<\/code>","2B","<code>plan-review.md<\/code>"],["<code>my-agent:coder<\/code>","3A, 3B (failed tests, large conflicts)","code and tests (not committed)"],["<code>my-agent:writer<\/code>","prototype","<code>prototype/index.html<\/code>"],["<code>my-agent:verifier<\/code>","4A","<code>verify.md<\/code>"],["<code>my-agent:reviewer<\/code>","4B","<code>review.md<\/code>"]],"used":{"explorer":["2","report → L1 saves it to <code>explore.md<\/code>"],"scope-reviewer":["2 (before G1-A; not for a small task)","<code>scope-review.md<\/code>"],"architect":["3, G1-B revisions","<code>plan.md<\/code>"],"plan-reviewer":["4","<code>plan-review.md<\/code>"],"coder":["5, 6 (failed tests, large conflicts)","code and tests (not committed)"],"writer":["prototype","<code>prototype/index.html<\/code>"],"verifier":["7","<code>verify.md<\/code>"],"reviewer":["8","<code>review.md<\/code>"]}}},"artifacts":[{"id":".active","steps":["1"],"writer":"L1 · L4 intake.py create","comment":"task in progress: task · phase · session · started (4.7.3, deleted when the task ends)","sources":[{"title":"`.active` rules","from":"plugins/my-agent/skills/my-agent/SKILL.md","html":"<ul><li><code>&lt;task_dir&gt;/.active<\/code> in the task location marks the running task: four lines, <code>task:<\/code>, <code>phase:<\/code> (1–4), <code>session:<\/code>, <code>started:<\/code>.<\/li><li>The Intake create call writes it (<code>new-task.md<\/code> item 6). Update <code>phase:<\/code> on each phase change. Delete it when the retrospective after G3 acceptance ends, on abort and on a task switch.<\/li><li>If it already exists, overwrite it only after a popup. <code>session:<\/code> is the value of <code>$CLAUDE_CODE_SESSION_ID<\/code>.<\/li><\/ul>"}]},{"id":".gitignore","steps":["1"],"writer":"L1 · L4 intake.py create","comment":"decides whether the records folder is committed (4.8.2)","sources":[{"title":"Intake (step 1A, Router) · item 5.","from":"plugins/my-agent/l1-orchestration/new-task.md","html":"<p>**<code>.gitignore<\/code>:** Only when the <code>gitignore:<\/code> line is <code>ask<\/code>, popup, question \"Commit the task log? The essential information goes into docs/blueprint, so committing it is not recommended.\": <code>Don&#x27;t commit (Recommended)<\/code> / <code>Commit<\/code>. Don't commit is <code>--gitignore ignore<\/code> (the line <code>*<\/code>); Commit is <code>--gitignore commit<\/code> (the line <code># my-agent: commit<\/code>).<\/p>"}]},{"id":"intake.md","steps":["1"],"writer":"L1 Router · L4 intake.py create","comment":"","sources":[{"title":"template","from":"plugins/my-agent/l1-orchestration/new-task.md","html":"<pre class=\"code\" data-lang=\"text\"><code>Status: active\nmy-agent: &lt;the facts plugin: value&gt;\nLocation: &lt;task location&gt;\nProfile: &lt;general | research | dev&gt;\nTask: &lt;task-id&gt;\nRequest: &lt;the request as written, one line; keep the leading valid flags as written, drop invalid flags the person let the Router replace&gt;<\/code><\/pre>"}]},{"id":"run-log.md","steps":["1","2","3","4","5","6","7","8"],"writer":"L1 Recorder · L4 hooks","comment":"","sources":[{"title":"line format","from":"plugins/my-agent/docs/build-guide/my-agent-architecture.md","html":"<ul><li>One record per line: <code>&lt;YYYY-MM-DD HH:MM:SS&gt; &lt;kind&gt;: &lt;key=value ...&gt;<\/code>. A value with spaces is wrapped in double quotes.<\/li><li>A value with double quotes is also wrapped in double quotes, with <code>&quot;<\/code> inside written as <code>\\&quot;<\/code> and <code>\\<\/code> as <code>\\\\<\/code> (shell quoting rules, read with Python <code>shlex<\/code>). Values hold no line breaks; each is replaced by one space. This matters most for values that copy a command as is, such as <code>q=<\/code> in the G2 hook. The monitor cannot read a line that breaks this rule and skips it.<\/li><li>A line without rev takes the rev of the latest <code>revision:<\/code> line (rev0 if there is none).<\/li><li>A <code>step:<\/code> line is written on every entry into a step (1–8), with the step number, name, rev and the current session ID. The monitor uses the time and session ID of this line to count tokens per step in the main session transcript.<pre class=\"code\" data-lang=\"text\"><code>2026-10-24 15:56:02 step: n=3A name=Execute rev=0 session=4f2a…\n2026-10-24 15:56:10 call: agent=my-agent:coder model=- effort=- isolation=worktree background=true unit=u1\n2026-10-24 15:56:11 start: agent=my-agent:coder id=a81c… configured=sonnet effort=medium session=4f2a…\n2026-10-24 16:04:40 stop: id=a81c… unit=u1 actual=claude-sonnet-5-5 tokens=84213 in=61020 out=9870 cw=8113 cr=5210 secs=509 result=DONE end=ok mode=auto effort=medium\n2026-10-24 16:01:15 ask: gate=G2 agent=my-agent:coder id=a81c… tool=Bash q=&quot;npm i fast-json-stable-stringify&quot;\n2026-10-24 16:01:30 answer: gate=G2 id=a81c… result=allowed<\/code><\/pre><\/li><\/ul><ul><li>Lines added 2026-10-29: <code>delegate: state=on|off how=flag|message|person|end<\/code> (delegated approval; the latest line is the state), <code>answer: … by=L1<\/code> (answered by the main session during delegated approval, or, since 2026-11-22, for a settled popup, 4.4), <code>profile: from=&lt;old&gt; to=&lt;new&gt; back=&lt;1|2|-&gt; archive=&lt;folder or -&gt;<\/code> (profile change at the first gate), and <code>fix: what=&quot;…&quot; files=plan.md before=G1-B archive=&lt;folder&gt;<\/code> (a small <code>plan.md<\/code> edit by L1 before approval; architect rewrites keep the <code>revision … before=G1-B<\/code> line, so the tally's \"plan rewrites before approval\" counts architect rewrites only). The monitor shows them as phase items, with <code>answered by L1<\/code> beside the choice. Line added 2026-11-02: the <code>models:<\/code> line, <code>models: preset=&lt;name&gt; source=file<\/code> (the task's model preset, written at Intake and after a profile change at the first gate only when <code>Models:<\/code> is written; <code>run-log.py<\/code> needs <code>preset=<\/code> and <code>source=<\/code>).<\/li><li>The existing lines (<code>cost:<\/code>, <code>revision:<\/code>, <code>stale:<\/code>, <code>base:<\/code>, <code>fix:<\/code>, <code>merge:<\/code>, <code>abort<\/code>, <code>deliver<\/code>, <code>resume<\/code>, <code>rules-changed<\/code>, <code>log-error<\/code>) use the same format. Examples of revision and back-to-Execute lines (4.8.1):<pre class=\"code\" data-lang=\"text\"><code>2026-10-24 15:20:00 revision: rev=0 before=G1-B why=&quot;split u2 in two&quot; archive=archive/261024-152000-rev0-draft\n2026-10-24 16:50:00 step: n=3A name=Execute rev=0 session=4f2a… back=&quot;Verify FAIL 2&quot; archive=archive/261024-165000-run1\n2026-10-24 17:02:10 fix: what=&quot;Scope change: criterion 3 is checked by the user later&quot; files=plan.md\n2026-10-24 17:09:50 stale: id=a81c… rev=1\n2026-10-24 17:10:00 revision: rev=1 why=&quot;add --json to the output&quot; archive=archive/261024-171000-rev1 to=2 invalidated=plan-review.md,verify.md,review.md keep=&quot;keep work/&quot; state=pending\n2026-10-24 17:11:00 revision: rev=1 state=done<\/code><\/pre><\/li><\/ul>"},{"title":"who records what","from":"plugins/my-agent/docs/build-guide/my-agent-architecture.md","html":"<div class=\"tbl\"><table><thead><tr><th>Record<\/th><th>Written by<\/th><th>How<\/th><\/tr><\/thead><tbody><tr><td>Phase entry, step entry (<code>step:<\/code>), popup question (<code>ask:<\/code>) and choice (<code>answer:<\/code>), merge conflict handling, small fixes<\/td><td>L1 Recorder<\/td><td>Instruction: run <code>run-log.py<\/code> (includes the main session model MISMATCH check, P9). <code>ask:<\/code> is written just before the popup shows, <code>answer:<\/code> after the answer comes back. For the recommended option and the typed-in marker, see \"Popup records\" below.<\/td><\/tr><tr><td>G2 permission request and grant<\/td><td>L4 hook<\/td><td><code>PermissionRequest<\/code> → <code>permission-log.py ask<\/code>, <code>PostToolUse<\/code> → <code>permission-log.py answer<\/code> (see \"G2 records\" below). On Codex the gate hook writes the <code>ask<\/code> and <code>release<\/code> lines and L1 writes the <code>answer<\/code> (see \"Codex G2 lines\")<\/td><\/tr><tr><td>A role run in the main session (<code>inline<\/code>, plugin 0.11.0)<\/td><td>L1 Recorder<\/td><td>Instruction: <code>run-log.py inline<\/code> after the result file is written (see \"Inline lines\" below)<\/td><\/tr><tr><td>Subagent call arguments<\/td><td>L4 hook<\/td><td>Main session <code>PreToolUse<\/code>(<code>Agent<\/code>) → <code>subagent-log.py call<\/code><\/td><\/tr><tr><td>Subagent start<\/td><td>L4 hook<\/td><td><code>SubagentStart<\/code> → <code>subagent-log.py start<\/code><\/td><\/tr><tr><td>Subagent stop<\/td><td>L4 hook<\/td><td><code>SubagentStop<\/code> → <code>subagent-log.py stop<\/code><\/td><\/tr><tr><td>Guard deny (2026-11-01)<\/td><td>L4 hook<\/td><td><code>scope-guard.py<\/code> / <code>plan-approved-check.py<\/code> → a <code>guard:<\/code> line (see \"Guard lines\" below)<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"id":"explore.md","steps":["2"],"writer":"my-agent:explorer (L1 saves the report)","comment":"","sources":[{"title":"Report format","from":"plugins/my-agent/l3-workers/agents/explorer.md","html":"<pre class=\"code\" data-lang=\"text\"><code>DONE | PARTIAL &lt;reason&gt;\n\n## Related files\n- &lt;path&gt;:&lt;line&gt; &lt;one line on what is there&gt;\n\n## Current behavior\n## Constraints\n## Blueprint\n- Feature: &lt;entry name&gt; — &lt;how the request touches it&gt; (features.md:&lt;line&gt;)\n- Constraint | Non-goal | Decision: &lt;the item&gt; (decisions.md:&lt;line&gt;)\n- Backlog: &lt;the item&gt; (backlog.md:&lt;line&gt;)\n## Check commands\n- `&lt;test, lint or build command&gt;` (&lt;where you found it&gt;) → pass (&lt;n&gt; s) | fail: &lt;failing tests&gt; (&lt;n&gt; s) | cannot run: &lt;reason&gt;\n  - &lt;project or target&gt;: pass (&lt;n&gt; s) | fail: &lt;failing tests&gt; (&lt;n&gt; s) | cannot run: &lt;reason&gt;\n## Uncommitted changes\n- &lt;summary of git status --porcelain, or none&gt;\n- Derived: &lt;derived files, or none&gt;\n## Unverified<\/code><\/pre><ul><li>The first line is <code>DONE<\/code> or <code>PARTIAL &lt;reason&gt;<\/code>. <code>DONE<\/code> if you found everything you were asked to find out.<\/li><li>Real uncommitted work (changes a person made) goes on the plain lines under <code>## Uncommitted changes<\/code>. Derived files (for example <code>*.pyc<\/code>, <code>__pycache__/<\/code>, build outputs) go on their own <code>- Derived: …<\/code> line, never mixed into the plain lines.<\/li><li><code>## Blueprint<\/code> lists only the entries the request touches or must keep: the features it changes, the constraints, non-goals and decisions that apply to it, and the backlog items it would settle. Copy an item's text as written; do not judge whether the request may break it. With no blueprint folder write <code>- none (no blueprint)<\/code>; with nothing related, <code>- none<\/code>.<\/li><li>Run each check command once, as the project runs it, and write what happened after <code>→<\/code>: <code>pass (&lt;n&gt; s)<\/code>; <code>fail: &lt;the failing tests, at most 5 names, then the count&gt; (&lt;n&gt; s)<\/code> (it fails before this task changes anything); or <code>cannot run: &lt;reason&gt;<\/code> (dependencies not installed, a missing browser or tool, a blocked host, no result within the time limit of one call), with no duration. <code>&lt;n&gt;<\/code> is the wall-clock time of that one run in whole seconds, rounded up (a run of 40.2 s is <code>41 s<\/code>). The duration is measured, not estimated: take the time before and after the run (for example <code>date +%s<\/code> in the same command), or use the run time the command itself prints; L1 passes it to the coder as the measured duration. Do not install, download or fix anything to make it run, and do not run it a second time.<\/li><li>When a check command runs several named projects or targets (the <code>projects<\/code> of a Playwright config, a test matrix), list every one the configuration names on a nested line under the command, with its own result from that one run. The command's own result is then <code>cannot run: &lt;the projects that cannot&gt;<\/code> or <code>fail: …<\/code> when any nested line is, so L1 asks about it.<\/li><li>Give every fact <code>path:line<\/code> evidence. Write guesses only under <code>## Unverified<\/code>.<\/li><\/ul>"}]},{"id":"scope.md","steps":["2"],"writer":"L1","comment":"","sources":[{"title":"1B Explore → Scope · item 4.","from":"plugins/my-agent/l1-orchestration/phases/define.md","html":"<p><strong>Confirm the scope:<\/strong><\/p><ul><li>Write <code>scope.md<\/code> (<code>## Completion criteria<\/code> as a numbered list <code>1.<\/code>, <code>2.<\/code>; every criterion ends with one check tag: <code>[check: command]<\/code>, <code>[check: file]<\/code>, <code>[check: URL]<\/code> or <code>[check: person]<\/code>), do \"Scope Review\" below, and record before and after the popup.<ul><li>Mark each line the person settled in the interview (an <code>- Environment:<\/code> line, a <code>Keep it<\/code>/<code>Change it<\/code> and a Person-check answer too) with <code> (the person&#x27;s choice)<\/code>, on a criterion right before its check tag. L1's reading and answers get no mark.<\/li><li>Background questions go in a <code>## Background research<\/code> section: one line each, <code>- b&lt;n&gt;: &lt;question&gt; — &lt;what it decides in the plan&gt;<\/code>. IDs are <code>b1<\/code>–<code>b4<\/code>, each used once, and every question has its own slug (kebab-case, for the note file name). With no questions there is no <code>## Background research<\/code> section (never an empty section or <code>none<\/code>).<\/li><li>Write no criterion only L1 can meet after G3 (the final save path, the blueprint update); name that work in the scope as done by L1 after G3.<\/li><li>Order: the Korean copy (gates.md \"Gate reports\"; Korean requests only), the <code>pre-gate.py<\/code> call, the chat report, the popup, the <code>answer<\/code> line.<\/li><li>Chat report (shown at that point; gates.md \"Gate reports\"): <code>### Overview<\/code>, <code>### Takeaway<\/code> (the scope summary: purpose, criteria count and non-goals; the findings applied after Scope Review, as at G1-B; with questions, the line <code>Background research: &lt;n&gt; questions<\/code>), the overview table (with the <code>Prototype<\/code> row when a prototype exists, and the <code>Background research<\/code> row with the questions) the findings table (gates.md \"Gate reports\") and the pointer line (both printed by <code>pre-gate.py<\/code>); no Details section. The popup follows gates.md's popup text.<\/li><li><code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/pre-gate.py&quot; --gate G1-A --task &quot;&lt;absolute task folder&gt;&quot; q=&quot;Scope confirmation: &lt;task-id&gt;&quot; rec=&quot;Confirm&quot; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code> (gates.md \"Gate reports\"; L1's own report, no writer). Then show the chat report, ending with the findings table and the pointer line it printed.<\/li><li><code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; answer gate=G1-A choice=&quot;&lt;Confirm/Revise/Abort&gt;&quot; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code><\/li><li>On <code>Revise<\/code> with a profile change, follow changes.md \"Profile change at the first gate\".<\/li><li>On Confirm, write <code>Confirmed &lt;YYYY-MM-DD HH:MM&gt;<\/code> in <code>## Confirmation<\/code> of <code>scope.md<\/code>, with the date and minute the <code>answer<\/code> line printed.<\/li><\/ul><\/li><li><strong>Person-check popup:<\/strong> before the G1-A popup, ask one popup per <code>[check: person]<\/code> criterion.<ul><li>Before it, say in the chat how the person checks it (the steps and where), then ask.<\/li><li>The question names the criterion number and text. Choices: <code>I check it before G3 and tell you (Recommended)<\/code> / <code>I check it after G3<\/code>; the Other field takes how and when the person checks it.<\/li><li>Record before the popup: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; ask gate=Q q=&quot;How criterion &lt;n&gt; is checked&quot; rec=&quot;I check it before G3 and tell you&quot; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code>, and after it: <code>python3 &quot;${CLAUDE_PLUGIN_ROOT}/l4-tools-guards/scripts/run-log.py&quot; answer gate=Q choice=&quot;&lt;chosen choice&gt;&quot; --data-dir &quot;&lt;data folder&gt;&quot; --task-dir &quot;&lt;task_dir&gt;&quot;<\/code>.<\/li><li>Write the answer into that criterion's text, before its tag.<\/li><li>On <code>I check it after G3<\/code>, right after the G1-B approval add the <code>Scope change: criterion &lt;n&gt; is checked by the user later<\/code> line (changes.md \"Adjust within approved scope\").<\/li><li>There is no \"decide at G3\" choice. A person who later finds they cannot check before G3 uses that same line; the verifier cites it as the evidence, and the G3 report lists such criteria.<\/li><\/ul><\/li><\/ul>"}]},{"id":"scope-review.md","steps":["2"],"writer":"my-agent:scope-reviewer","comment":"","sources":[{"title":"`scope-review.md` format","from":"plugins/my-agent/l2-design-judge/agents/scope-reviewer.md","html":"<pre class=\"code\" data-lang=\"text\"><code>READY FOR CONFIRMATION | REVISE\nRun: &lt;n&gt;\n\n## Counts\n| Round | BLOCKER | SHOULD-FIX | NITPICK |\n|---|---|---|---|\n| 1 | &lt;n&gt; | &lt;n&gt; | &lt;n&gt; |\n\n## Findings\n- BLOCKER &lt;path&gt;:&lt;line&gt; &lt;problem&gt; → &lt;how to fix&gt;\n- SHOULD-FIX &lt;path&gt;:&lt;line&gt; &lt;problem&gt; → &lt;how to fix&gt;\n- NITPICK &lt;path&gt;:&lt;line&gt; &lt;problem&gt;\n- &lt;any finding line above&gt; [ask person]\n\n## Decisions<\/code><\/pre><ul><li>The first line is the verdict word only. If there is even one BLOCKER, <code>REVISE<\/code>; otherwise <code>READY FOR CONFIRMATION<\/code>.<\/li><li>End a finding that must go to the person with <code> [ask person]<\/code>, after <code>→ &lt;how to fix&gt;<\/code> (after <code>&lt;problem&gt;<\/code> on a NITPICK): one that adds, removes or changes a completion criterion, a non-goal or a constraint; one that changes a line marked <code>(the person&#x27;s choice)<\/code> in <code>scope.md<\/code>; one that needs the person's answer (name the question). Any severity can carry it, a NITPICK too; a marked NITPICK goes to the person like a marked SHOULD-FIX. You mark; L1 does not classify findings.<\/li><li><code>Run:<\/code> is the previous <code>scope-review.md<\/code> value + 1 if one exists, otherwise 1.<\/li><li><code>## Counts<\/code> comes right after <code>Run:<\/code>, before <code>## Findings<\/code>: one row per round. Copy the earlier rows from the previous <code>scope-review.md<\/code> table, then add this run's row with the counts of the finding lines you write below.<\/li><li>Leave <code>## Decisions<\/code> empty. L1 fills it, one line per applied or declined finding.<\/li><li>With no findings, <code>## Findings<\/code> holds <code>- none<\/code>.<\/li><\/ul>"}]},{"id":"background/","steps":["2"],"writer":"my-agent:researcher","comment":"(optional) Background research notes &lt;slug&gt;.md, one per confirmed <code>b&lt;n&gt;<\/code> question, written right after G1-A (4.3, Q45)","sources":[{"title":"Note format","from":"plugins/my-agent/l3-workers/agents/researcher.md","html":"<pre class=\"code\" data-lang=\"text\"><code># &lt;sub-question&gt;\n\n- &lt;one-sentence claim&gt; · &lt;source URL&gt; · &quot;&lt;the page&#x27;s original text verbatim, 25 words or fewer&gt;&quot;\n- Not found: &lt;what&gt;<\/code><\/pre><ul><li>Every item in the note uses one of these two forms. verifier judges a sentence that does not fit them as FAIL.<\/li><li>A quote is a short sentence exactly as it appears on a page you actually opened with WebFetch, read through before you quote it. A search result snippet is not a page you opened. Do not rewrite or combine quotes.<\/li><li>Follow the source criteria (official docs, primary sources, date range). Do not rely on a single source. Prefer a primary source (official docs, a standard, original data, a peer-reviewed paper) to a blog post, an aggregator, a forum or an encyclopedia page.<\/li><li>A claim is as specific as its page: give a figure with its unit and date, and a version by number, in place of \"recently\" or \"many\".<\/li><li>When sources disagree, write one item for each source. Attribute each claim to its own source and word it so that its own page supports it (<code>- The vendor docs state the limit is 100 requests per minute · &lt;URL&gt; · &quot;&lt;quote&gt;&quot;<\/code>). Do not write an item that says the sources disagree, and do not pick one silently: a sentence its own page does not support is a FAIL.<\/li><\/ul>"}]},{"id":"plan.md","steps":["3","G1-B"],"writer":"my-agent:architect · L1 (Approval, Prototype, Revisions lines)","comment":"","sources":[{"title":"`plan.md` sections","from":"plugins/my-agent/l2-design-judge/agents/architect.md","html":"<p>The file starts with the <code># Plan: &lt;task-id&gt;<\/code> title and a lead paragraph (one or two sentences on what the plan builds, not a <code>Profile:<\/code> line or a pointer to the criteria), which the G1-B Report view shows as the plan summary.<\/p><ol><li><code>## Scope summary<\/code> (only when there is no <code>scope.md<\/code>: a small task): purpose, non-goals, deliverable location (an absolute path (no <code>~<\/code>, no relative path)).<\/li><li><code>## Completion criteria<\/code> (only when there is no <code>scope.md<\/code>: a small task): a numbered list <code>1.<\/code>, <code>2.<\/code>; it carries each criterion's check tag (<code>[check: command]<\/code>, <code>[check: file]<\/code>, <code>[check: URL]<\/code> or <code>[check: person]<\/code>) unchanged. Other tasks use the numbers and tags in <code>scope.md<\/code> as is.<\/li><li><code>## Work units<\/code>: for each unit, a <code>### u&lt;n&gt; &lt;name&gt;<\/code> heading (<code>u1<\/code>, <code>u2<\/code> …, unique within the plan). L1 calls workers by this ID and the run-log records it as <code>unit=<\/code>.<ul><li>Under it, <code>- <\/code> lines with the agent that takes it (<code>my-agent:researcher<\/code>·<code>writer<\/code>·<code>coder<\/code>), files to read, and for a coder the files to change, or for a writer or researcher the result path (<code>&lt;task_dir&gt;/&lt;task-id&gt;/work/…<\/code>), the parallel group (<code>group 1<\/code>, <code>group 2<\/code> …) and the matching completion criterion number.<\/li><li><code>- Status: pending<\/code>; when rewriting, a unit whose result <code>## Existing work<\/code> keeps as is gets <code>- Status: done<\/code>.<\/li><li>Write these three labels exactly; scripts read them by label:<ul><li><code>- Files to change: <\/code> with each path in backticks (on that line or as nested <code>  - <\/code> bullets)<\/li><li><code>- Parallel group: group &lt;n&gt;<\/code><\/li><li><code>- Completion criteria: &lt;numbers&gt;<\/code><\/li><\/ul><\/li><li>Other labels (<code>Change:<\/code>, <code>Group:<\/code>, <code>Criteria:<\/code>) are not read: their files are <code>unmapped<\/code>, judged against all criteria.<\/li><li>A coder unit that fetches from the network (reference data, a new package) gets one line <code>- Needs host: &lt;host name&gt;<\/code> per host, as a bare DNS name. L1 checks them before G1-B, so name every one.<\/li><li>When rewriting, units you keep or revise keep their old ID; new units get the next unused number. Never reuse the ID of a discarded unit.<\/li><li>In the general and research profiles, writer and researcher results are under <code>&lt;task_dir&gt;/&lt;task-id&gt;/work/<\/code>; L1 copies them to the <code>scope.md<\/code> location after G3.<\/li><li>Do not list the final location as a file to change. scope-guard blocks that write.<\/li><li>A coder's <code>Files to change<\/code> (its test files too) are inside the task location, never under <code>&lt;task_dir&gt;/<\/code> (scope-guard denies it; the plan cannot be approved).<\/li><li>What a coder unit finds out goes in its final report; a note file under <code>work/<\/code> is a writer or researcher unit.<\/li><li>List a generated file under the work unit that changes its source.<\/li><li>Units in the same parallel group must not change the same files. If they overlap, split them into different groups.<\/li><li>A parallel group without a workflow has 4 units or fewer.<\/li><li>A choice that rests on a <code>background/<\/code> note carries <code>(background b&lt;n&gt;)<\/code>; a unit that needs the note lists it under its files to read. A <code>Not found<\/code> question and each unresearched candidate become <code>To confirm<\/code>.<\/li><\/ul><\/li><li><code>## Reference files<\/code>: files outside the task folder that agents may read, one per line as <code>- `relative path`<\/code>. If there are none, <code>- none<\/code>.<\/li><li><code>## Mock-up<\/code>: the first line is <code>Kind: &lt;kind of example&gt;<\/code>, then an example of the deliverable. Show the normal case and the exception cases in the scope document, and tag each case with its completion criterion number.<\/li><li><code>## Prototype<\/code>: <code>needed<\/code> or <code>not needed<\/code> and a one-line reason. <code>needed<\/code> only when a judgment must be made by eye (a screen or document layout). The <code>Prototype: requested<\/code> line in this section is written only by L1.<\/li><li><code>## Estimate<\/code>: the number of subagents; with a workflow, its steps and agents (9 or fewer). Write no expected tokens.<\/li><li><code>## Models<\/code>: the models and efforts the task's agents run with.<ul><li>The line <code>Preset: &lt;name&gt;<\/code>, then the table <code>| Agent | Model | Effort | Note |<\/code>.<\/li><li>One row per agent the task uses from step 2A on: architect, plan-reviewer, the workers in <code>## Work units<\/code>, writer when a prototype is made, verifier, reviewer, gate-analyst. Agents the plan does not use get no row; a preset entry for them is ignored.<\/li><li>Take the values from the preset lines L1 passes (<code>agent-models.py show<\/code> output).<\/li><li>Every difference from the passed preset lines (a recommended change of preset or of one agent) goes in that row's Note and in one line <code>Recommendation: &lt;change&gt; — &lt;reason&gt;<\/code>.<\/li><li>Without a recommendation the Note cells are empty and there is no <code>Recommendation:<\/code> line.<\/li><li>With no <code>Models:<\/code> line from L1, write <code>Preset: standard (definition values)<\/code> and the definition values in the rows.<\/li><\/ul><\/li><li><code>## Existing work<\/code> (when rewriting, if deliverables already exist): a table <code>| Target | Decision | Reason |<\/code>.<ul><li>Decisions: keep / revise / discard for notes and drafts in <code>work/<\/code>;<\/li><li>merge / redo / discard for an unmerged coder worktree;<\/li><li>keep / revise / revert for code already merged (dev).<\/li><li>A revert and a worktree discard are each a work unit of their own.<\/li><\/ul><\/li><li><code>## Approval<\/code>: leave empty. Only L1 writes this section.<\/li><\/ol><p>If <code>## Revisions<\/code> exists, leave it at the very end as is (rule above).<\/p>"}]},{"id":"plan-review.md","steps":["4"],"writer":"my-agent:plan-reviewer","comment":"","sources":[{"title":"`plan-review.md` format","from":"plugins/my-agent/l2-design-judge/agents/plan-reviewer.md","html":"<pre class=\"code\" data-lang=\"text\"><code>READY FOR APPROVAL | REVISE\nRun: &lt;n&gt;\n\n## Counts\n| Round | BLOCKER | SHOULD-FIX | NITPICK |\n|---|---|---|---|\n| 1 | &lt;n&gt; | &lt;n&gt; | &lt;n&gt; |\n\n## Findings\n- BLOCKER &lt;path&gt;:&lt;line&gt; &lt;problem&gt; → &lt;how to fix&gt;\n- SHOULD-FIX &lt;path&gt;:&lt;line&gt; &lt;problem&gt; → &lt;how to fix&gt;\n- NITPICK &lt;path&gt;:&lt;line&gt; &lt;problem&gt;\n- &lt;any finding line above&gt; [ask person]\n\n## Decisions<\/code><\/pre><ul><li>The first line is the verdict word only. If there is even one BLOCKER, <code>REVISE<\/code>; otherwise <code>READY FOR APPROVAL<\/code>.<\/li><li><code>Run:<\/code> is the previous <code>plan-review.md<\/code> value + 1 if one exists, otherwise 1.<\/li><li>End a finding that must go to the person with <code> [ask person]<\/code>, after <code>→ &lt;how to fix&gt;<\/code> (after <code>&lt;problem&gt;<\/code> on a NITPICK): one that adds, removes or changes a completion criterion, a non-goal or a constraint; one that changes a line marked <code>(the person&#x27;s choice)<\/code> in <code>scope.md<\/code>; one that needs the person's answer (name the question). Any severity can carry it, a NITPICK too; a marked NITPICK goes to the person like a marked SHOULD-FIX. You mark; L1 does not classify findings.<\/li><li><code>## Counts<\/code> comes right after <code>Run:<\/code>, before <code>## Findings<\/code>: one row per round. Copy the earlier rows from the previous <code>plan-review.md<\/code> table, then add this run's row with the counts of the finding lines you write below.<\/li><li>Leave <code>## Decisions<\/code> empty. L1 fills it, one line per applied or declined finding (an unmarked finding is applied without asking; a marked one follows the person's popup answer).<\/li><\/ul>"}]},{"id":"prototype/","steps":["G1-B"],"writer":"my-agent:writer","comment":"(optional) single-HTML prototype for G1-B","sources":[{"title":"Rules per job","from":"plugins/my-agent/l3-workers/agents/writer.md","html":"<ul><li><strong>Draft:<\/strong> follow the structure shown in <code>## Mock-up<\/code> of <code>plan.md<\/code>.<\/li><li><strong>Synthesis note (research 3B Merge):<\/strong> place the notes in <code>work/<\/code> into the synthesis structure in <code>plan.md<\/code>. Write each claim as <code>&lt;claim&gt; · &lt;source URL&gt; · &quot;&lt;quote&gt;&quot;<\/code>. If the deliverable is in another language than the English notes, translate the claim faithfully and keep the source and the quote as they are; make no new claims. If notes contradict each other, keep both and mark them <code>To confirm<\/code>.<\/li><li><strong>Blueprint update (after G3):<\/strong> L1 passes the job name <code>Blueprint update<\/code> (no <code>Work unit:<\/code> line), the path of <code>blueprint-format.md<\/code>, the blueprint folder, the task ID, the date, the task folder files and where the deliverable is. Read <code>blueprint-format.md<\/code> first and follow its formats and update rules. Change only <code>features.md<\/code>, <code>decisions.md<\/code> and <code>backlog.md<\/code> in that folder (create a missing one), and only the entries this task touches. Write nothing the passed files do not say. If L1 passes <code>problem:<\/code> lines of the format check, fix those lines too. End with the report lines the format file gives.<\/li><li><strong>Gate report:<\/strong> L1 passes the line <code>Gate report: G1-B<\/code> or <code>Gate report: G3<\/code> (no <code>Work unit:<\/code> line). Read the task folder files (G1-B: <code>scope.md<\/code>, <code>plan.md<\/code>, <code>plan-review.md<\/code>; G3: <code>scope.md<\/code>, <code>plan.md<\/code>, <code>verify.md<\/code>, <code>review.md<\/code>, <code>changed-files.md<\/code>) and the request language in <code>intake.md<\/code>. Write <code>&lt;task_dir&gt;/&lt;task-id&gt;/report/&lt;gate&gt;.md<\/code> in the request language with <code>### Overview<\/code>, <code>### Takeaway<\/code> and the <code>| Item | Value |<\/code> table; fill the rows the files give, and leave out the dev <code>Commit message<\/code> and <code>Diff<\/code> rows and the cost, which L1 adds. Write no findings table and no pointer line. For a Korean request L1 also passes the <code>report-ko.py todo<\/code> output: write the printed keys into <code>report-ko.json<\/code> with the printed sha and keep the other items already there. At G3, when an open <code>review.md<\/code> item carries <code>[plan]<\/code> right before <code>[criterion …]<\/code> or <code>(new)<\/code>/<code>(carried)<\/code> on its line (the token anywhere else does not count), the row on what each choice leads to says that a Rework that sends the item back first gets the plan-finding popup (<code>Adjust within approved scope<\/code> / <code>Revise this task<\/code> / <code>Fix within current plan<\/code>) before any fix.<\/li><li><strong>Prototype:<\/strong> a single HTML file, <code>&lt;task_dir&gt;/&lt;task-id&gt;/prototype/index.html<\/code>. It opens with no external files, reads well in light and dark themes and at phone width (about 400px), and uses real content. It only shows the mock-up visually; it adds no new requirements.<\/li><\/ul>"}]},{"id":"report/","steps":["G1-B","8"],"writer":"my-agent:writer","comment":"writer gate report prose G1-B.md, G3.md, shown through pre-gate.py --report-text (4.4 \"Gate report files\")","sources":[{"title":"Gate report files (`report/`)","from":"plugins/my-agent/docs/build-guide/my-agent-architecture.md","html":"<ul><li><code>&lt;task_dir&gt;/&lt;task-id&gt;/report/G1-B.md<\/code> and <code>report/G3.md<\/code> hold the writer's gate report prose (<code>### Overview<\/code>, <code>### Takeaway<\/code>, the <code>| Item | Value |<\/code> table, in the request language), and <code>report-ko.json<\/code> in the task folder keeps the Korean copy as before. Only <code>my-agent:writer<\/code> writes them: scope-guard lets the writer write <code>work/<\/code>, <code>prototype/<\/code>, <code>report/<\/code> and the file <code>report-ko.json<\/code> in the task folder (and the blueprint folder, 4.7.5).<\/li><li>The G1-B report is written before the plan is approved, so the hard gate (below) lets <code>my-agent:writer<\/code> through before approval only for that report and the prototype: the prompt has the exact line <code>Gate report: G1-B<\/code> and the task folder has <code>plan-review.md<\/code>. The G3 report is written after approval and needs no exception. The <code>BEFORE_APPROVAL<\/code> allow list of <code>ma_schema<\/code> does not grow.<\/li><\/ul>"}]},{"id":"work/","steps":["5","6"],"writer":"my-agent:researcher · my-agent:writer","comment":"worker results (research notes, drafts)","sources":[{"title":"Note format","from":"plugins/my-agent/l3-workers/agents/researcher.md","html":"<pre class=\"code\" data-lang=\"text\"><code># &lt;sub-question&gt;\n\n- &lt;one-sentence claim&gt; · &lt;source URL&gt; · &quot;&lt;the page&#x27;s original text verbatim, 25 words or fewer&gt;&quot;\n- Not found: &lt;what&gt;<\/code><\/pre><ul><li>Every item in the note uses one of these two forms. verifier judges a sentence that does not fit them as FAIL.<\/li><li>A quote is a short sentence exactly as it appears on a page you actually opened with WebFetch, read through before you quote it. A search result snippet is not a page you opened. Do not rewrite or combine quotes.<\/li><li>Follow the source criteria (official docs, primary sources, date range). Do not rely on a single source. Prefer a primary source (official docs, a standard, original data, a peer-reviewed paper) to a blog post, an aggregator, a forum or an encyclopedia page.<\/li><li>A claim is as specific as its page: give a figure with its unit and date, and a version by number, in place of \"recently\" or \"many\".<\/li><li>When sources disagree, write one item for each source. Attribute each claim to its own source and word it so that its own page supports it (<code>- The vendor docs state the limit is 100 requests per minute · &lt;URL&gt; · &quot;&lt;quote&gt;&quot;<\/code>). Do not write an item that says the sources disagree, and do not pick one silently: a sentence its own page does not support is a FAIL.<\/li><\/ul>"},{"title":"Rules per job","from":"plugins/my-agent/l3-workers/agents/writer.md","html":"<ul><li><strong>Draft:<\/strong> follow the structure shown in <code>## Mock-up<\/code> of <code>plan.md<\/code>.<\/li><li><strong>Synthesis note (research 3B Merge):<\/strong> place the notes in <code>work/<\/code> into the synthesis structure in <code>plan.md<\/code>. Write each claim as <code>&lt;claim&gt; · &lt;source URL&gt; · &quot;&lt;quote&gt;&quot;<\/code>. If the deliverable is in another language than the English notes, translate the claim faithfully and keep the source and the quote as they are; make no new claims. If notes contradict each other, keep both and mark them <code>To confirm<\/code>.<\/li><li><strong>Blueprint update (after G3):<\/strong> L1 passes the job name <code>Blueprint update<\/code> (no <code>Work unit:<\/code> line), the path of <code>blueprint-format.md<\/code>, the blueprint folder, the task ID, the date, the task folder files and where the deliverable is. Read <code>blueprint-format.md<\/code> first and follow its formats and update rules. Change only <code>features.md<\/code>, <code>decisions.md<\/code> and <code>backlog.md<\/code> in that folder (create a missing one), and only the entries this task touches. Write nothing the passed files do not say. If L1 passes <code>problem:<\/code> lines of the format check, fix those lines too. End with the report lines the format file gives.<\/li><li><strong>Gate report:<\/strong> L1 passes the line <code>Gate report: G1-B<\/code> or <code>Gate report: G3<\/code> (no <code>Work unit:<\/code> line). Read the task folder files (G1-B: <code>scope.md<\/code>, <code>plan.md<\/code>, <code>plan-review.md<\/code>; G3: <code>scope.md<\/code>, <code>plan.md<\/code>, <code>verify.md<\/code>, <code>review.md<\/code>, <code>changed-files.md<\/code>) and the request language in <code>intake.md<\/code>. Write <code>&lt;task_dir&gt;/&lt;task-id&gt;/report/&lt;gate&gt;.md<\/code> in the request language with <code>### Overview<\/code>, <code>### Takeaway<\/code> and the <code>| Item | Value |<\/code> table; fill the rows the files give, and leave out the dev <code>Commit message<\/code> and <code>Diff<\/code> rows and the cost, which L1 adds. Write no findings table and no pointer line. For a Korean request L1 also passes the <code>report-ko.py todo<\/code> output: write the printed keys into <code>report-ko.json<\/code> with the printed sha and keep the other items already there. At G3, when an open <code>review.md<\/code> item carries <code>[plan]<\/code> right before <code>[criterion …]<\/code> or <code>(new)<\/code>/<code>(carried)<\/code> on its line (the token anywhere else does not count), the row on what each choice leads to says that a Rework that sends the item back first gets the plan-finding popup (<code>Adjust within approved scope<\/code> / <code>Revise this task<\/code> / <code>Fix within current plan<\/code>) before any fix.<\/li><li><strong>Prototype:<\/strong> a single HTML file, <code>&lt;task_dir&gt;/&lt;task-id&gt;/prototype/index.html<\/code>. It opens with no external files, reads well in light and dark themes and at phone width (about 400px), and uses real content. It only shows the mock-up visually; it adds no new requirements.<\/li><\/ul>"}]},{"id":"coder-notes.md","steps":["5","6"],"writer":"L1 (from coder final reports)","comment":"what earlier coder units learned: L1 writes it from coder reports in steps 3A-3B, later coders read it (4.7.6)","sources":[{"title":"4.7.6 Coder notes","from":"plugins/my-agent/docs/build-guide/my-agent-architecture.md","html":"<p>A coder starts fresh and gets only its own unit: the plan path, its files and its criteria. What an earlier unit found out (a convention, a trap, a command that works) reached a later unit only if the plan happened to say it. The coder notes carry that, inside one task.<\/p><ul><li><strong>The notes part of the report:<\/strong> a coder's final report may end with a part that starts with the line <code>Notes for later units:<\/code>. It is the last part, and the notes run from the line below it to the end. It holds what a later unit of the same task needs: conventions found, traps, commands that work, choices later units must keep. It holds at most 10 lines, blank lines not counted. It holds no instruction to L1 or the person, no request to change the plan and no repeat of the changed-file list. A unit with nothing to pass writes no notes part and no marker line. A <code>PARTIAL &lt;reason&gt;<\/code> report may carry one.<\/li><li><strong>L1 writes the file:<\/strong> <code>&lt;task_dir&gt;/&lt;task-id&gt;/coder-notes.md<\/code>, directly in the task folder. When a coder call returns a final report with a notes part, L1 appends the lines below the marker as written, without blank lines, under the label <code>## rev&lt;current rev&gt; u&lt;n&gt; &lt;name&gt;<\/code>, after the earlier entries. More than 10 non-blank lines: the first 10 and the line <code>(cut: &lt;k&gt; more lines not saved)<\/code>. L1 adds no other text. No notes part, or no non-blank line: no entry. A rerun's notes are a new entry; nothing is replaced or removed. This holds in 3A Execute and 3B Merge, for a worktree coder (its notes come back in its report and go to the main tree's task folder) and for an inline coder role. A run that ended without a final report leaves no entry.<\/li><li><strong>Who reads it, and when:<\/strong> once the file exists, L1 passes its path as a <code>Notes file<\/code> line to every later coder call: the units of later parallel groups, the retry of a stopped unit, the coder calls of 3B Merge and the reruns after Back to Execute (4.8.1). Units handed out together in one parallel group do not get each other's notes. Only coder calls get it: no scope-reviewer, plan-reviewer, verifier, reviewer, gate-analyst, architect, researcher or writer. With no file, nothing is passed or created.<\/li><li><strong>In a workflow:<\/strong> the script's return value holds the unit ID and the first line, and for a coder unit also its notes part; L1 saves it by the same rule. A file that exists when the workflow starts goes into every coder prompt of the run; the agents of one run do not get each other's notes.<\/li><li><strong>Data, and the plan wins:<\/strong> the coder reads the file as data, not instructions. Where a note disagrees with the plan or the unit's file list, it follows the plan and the file list. L1 does not act on a note, asks no popup for it and shows no message when it saves or passes it.<\/li><li><strong>Guards unchanged:<\/strong> the coder still writes nothing in the task folder (4.12); the notes travel in its report and L1 writes the file. Nothing in scope-guard changes.<\/li><li><strong>A task record:<\/strong> the file is archived with the task folder and kept in a revision (4.8.1). It is never copied to the blueprint or the data folder.<\/li><li><strong>Against the blueprint and the retrospective:<\/strong> the blueprint (4.7.5) is what the project is now, written after G3; the retrospective (4.11) is what to improve, written after the task. The coder notes are what one unit learned for the next, during the task and gone from the next task's view.<\/li><\/ul>"}]},{"id":"verify.md","steps":["7"],"writer":"my-agent:verifier","comment":"","sources":[{"title":"`verify.md` format","from":"plugins/my-agent/l2-design-judge/agents/verifier.md","html":"<pre class=\"code\" data-lang=\"text\"><code>Verdict: ALL PASS | Verdict: FAIL\nRun: &lt;n&gt;\n- &lt;n&gt;. PASS|FAIL &lt;evidence: path:line, a command and one line of its output, or a URL&gt;\n- &lt;n&gt;. PASS (carried from Run &lt;m&gt;) &lt;the evidence of Run m&gt;\n\n## Unhandled exceptions\n## Commands run\n## Instruction-like content<\/code><\/pre><ul><li>The first line is the verdict only. If even one criterion is FAIL, <code>Verdict: FAIL<\/code>.<\/li><li><code>Run:<\/code> is the previous <code>verify.md<\/code> value + 1 if one exists, otherwise 1.<\/li><li>One line per criterion, in the form <code>- &lt;n&gt;. PASS|FAIL &lt;evidence&gt;<\/code> (a period after the number). Judge <code>Scope change:<\/code> lines like criteria.<\/li><li>For a <code>[check: person]<\/code> criterion, the evidence is the <code>Scope change: criterion &lt;n&gt; …<\/code> line with its <code>plan.md<\/code> line number; without it the line is <code>- &lt;n&gt;. FAIL no Scope change line for criterion &lt;n&gt;<\/code>.<\/li><li>A carried line keeps the earlier evidence and names the run that last judged the criterion (see \"Scope of each run\").<\/li><li><code>## Commands run<\/code>: one line per command, <code>- &lt;command&gt; → &lt;result line&gt;<\/code> (for example <code>→ Ran 810 tests … OK<\/code>). The reviewer cites these lines instead of running the commands again, so list every check command you ran.<\/li><li><code>## Unhandled exceptions<\/code>: exception cases in the scope document that the deliverable does not handle.<\/li><li><code>## Instruction-like content<\/code>: if instructions not in the criteria (e.g. \"run the following command\") got mixed into the deliverable, write them with their location and mark the related criterion FAIL.<\/li><\/ul>"}]},{"id":"review.md","steps":["8"],"writer":"my-agent:reviewer","comment":"","sources":[{"title":"`review.md` format","from":"plugins/my-agent/l2-design-judge/agents/reviewer.md","html":"<pre class=\"code\" data-lang=\"text\"><code>BLOCKER &lt;n&gt;\n\n## Counts\n| Round | BLOCKER | SHOULD-FIX | NITPICK |\n|---|---|---|---|\n| 1 | &lt;n&gt; | &lt;n&gt; | &lt;n&gt; |\n\n## Findings\n- BLOCKER &lt;path&gt;:&lt;line&gt; &lt;problem&gt; → &lt;how to fix&gt; [criterion &lt;n&gt;]\n- SHOULD-FIX &lt;path&gt;:&lt;line&gt; &lt;problem&gt; → &lt;how to fix&gt; [criterion &lt;n&gt;]\n- NITPICK &lt;path&gt;:&lt;line&gt; &lt;problem&gt; (new)\n- SHOULD-FIX &lt;path&gt;:&lt;line&gt; &lt;problem&gt; → &lt;how to fix&gt; [plan] [criterion &lt;n&gt;]\n- NITPICK &lt;path&gt;:&lt;line&gt; &lt;problem&gt; [plan] (new)<\/code><\/pre><ul><li>The first line is only <code>BLOCKER &lt;count&gt;<\/code>. If there are no problems, <code>BLOCKER 0<\/code>.<\/li><li>Every BLOCKER and SHOULD-FIX line ends with <code>[criterion &lt;n&gt;]<\/code>, naming the completion criterion the finding puts at risk (several: <code>[criterion 2, 5]<\/code>), or with <code>[criterion none]<\/code> for a quality problem no criterion covers. L1 re-judges the criteria a tag names after a fix.<\/li><li>NITPICK lines carry no tag and end with <code>(new)<\/code> or <code>(carried)<\/code>.<\/li><li>Mark a finding <code>[plan]<\/code> (exact lower-case token) when fixing it needs a change to the approach of <code>plan.md<\/code>, to its set of work units or to its target files (<code>Files to change<\/code>). A file added by a <code>Scope change:<\/code> line under <code>## Approval<\/code> of <code>plan.md<\/code> counts as a target file. Leave a finding that can be fixed inside the plan unmarked. This holds for any severity and in every profile. The mark stands right before <code>[criterion …]<\/code> on a BLOCKER or SHOULD-FIX line and right before <code>(new)<\/code> or <code>(carried)<\/code> on a NITPICK line. The criterion tag and <code>(new)<\/code> or <code>(carried)<\/code> stay. L1 asks how to change course before such a fix.<\/li><li><code>## Counts<\/code> comes right after the first line, before <code>## Findings<\/code>: one row per round of the current revision. Copy the earlier rows from the previous <code>review.md<\/code> table, then add this run's row (round = the previous last round + 1, or 1) with the counts of the finding lines you write below.<\/li><li>With no previous <code>review.md<\/code> (the first Review call of the task), list every finding seen in the reviewed files. The rules for later rounds are unchanged.<\/li><li>With a previous <code>review.md<\/code>, the reviewer checks each of its BLOCKER and SHOULD-FIX findings again and lists one that is still present again. This matters most for <code>[criterion none]<\/code> findings, which no verifier re-judges.<\/li><li>BLOCKER: a problem that, if shipped as is, leaves the person unable to use it or believing something wrong. SHOULD-FIX: a problem worth fixing. NITPICK: something minor.<\/li><li>An observation with nothing to fix is not a finding line.<\/li><li>Each NITPICK line ends with <code>(new)<\/code> or <code>(carried)<\/code>: compare with the previous <code>review.md<\/code> path, if any, that L1 passes in the input; a NITPICK already in it is <code>(carried)<\/code>. With no previous review every NITPICK is <code>(new)<\/code>.<\/li><li>Do not write an <code>## Applied after review<\/code> section in this file. That section is for L1, which made small fixes after the verdict and got only Review again without Verify; L1 adds what it fixed, one line each, at the end of the new <code>review.md<\/code> (<code>phases/accept.md<\/code>).<\/li><\/ul>"}]},{"id":"deliverable/","steps":["8"],"writer":"L1","comment":"(optional) final deliverable when the scope document set no save location (4.4)","sources":[{"title":"Storing the deliverable after G3","from":"plugins/my-agent/docs/build-guide/my-agent-architecture.md","html":"<p>Nothing is saved to the Obsidian vault (decided 2026-10-24, Q13). The dev profile does not use this table, since the commit is the deliverable.<\/p><div class=\"tbl\"><table><thead><tr><th>Item<\/th><th>Rule<\/th><\/tr><\/thead><tbody><tr><td>Location<\/td><td>The save path goes in the deliverable format of the scope document (<code>scope.md<\/code>) and is confirmed at G1-A. If none is set, it goes in the task folder's <code>deliverable/<\/code>.<\/td><\/tr><tr><td>File name<\/td><td>English, lowercase, hyphen-separated (CLAUDE.md naming rule).<\/td><\/tr><tr><td>Overwriting<\/td><td>If a file with the same name exists, do not overwrite it; use a new name with <code>-2<\/code>. If the work edits an existing file, the scope document names that path and G3 shows the diff.<\/td><\/tr><tr><td>Who, when<\/td><td>After <code>Accept<\/code> is chosen at G3, L1 copies the final version from the task folder to that location. Workers do not write outside the task folder (scope-guard).<\/td><\/tr><tr><td>Approval<\/td><td>The G3 popup shows <strong>the exact path to save to<\/strong>. If the path is outside <code>~/dev<\/code>, the CLAUDE.md rules require approval before writing, so choosing <code>Accept<\/code> serves as that approval.<\/td><\/tr><tr><td>Record<\/td><td>The saved path goes into <code>intake.md<\/code> as <code>Delivered: &lt;path&gt;<\/code> and into run-log as a <code>deliver<\/code> line. Follow-up tasks (<code>Follows:<\/code>) find the earlier deliverable by this path.<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"id":"gate-tally.md","steps":["R"],"writer":"L4 gate-report.py tally","comment":"retrospective: L4 tally (gate-report.py tally) and gate-analyst's decision report (4.11)","sources":[{"title":"Input","from":"plugins/my-agent/l2-design-judge/agents/gate-analyst.md","html":"<p>The <code>gate-tally.md<\/code> path, the result path <code>gate-report.md<\/code>, and the profile written in the prompt (<code>general<\/code>, <code>research<\/code>, <code>dev<\/code>). Use the profile value L1 passes; do not read <code>intake.md<\/code>.<\/p><p><code>gate-tally.md<\/code> (written by L4 <code>gate-report.py tally<\/code>) has three sections.<\/p><ul><li><code>## Decision table<\/code>: <code>| # | Gate | Question | Recommended | Choice | Picked recommended | Note |<\/code>. Picked recommended is <code>yes<\/code> / <code>no<\/code> / <code>delegated<\/code> (answered by L1) / <code>in advance<\/code> / <code>prose reply<\/code> / <code>typed (Other)<\/code> / <code>none<\/code> (no recommendation offered) / <code>unknown<\/code>; only <code>yes<\/code> and <code>no<\/code> rows count toward the picked-recommended share; Note marks lines that did not pair up (<code>no answer<\/code>, <code>answer only<\/code>, <code>answered twice<\/code>). If there are no decisions, one line <code>No decisions …<\/code>.<\/li><li><code>## Metrics<\/code>: Verify count, Plan Review count (runs of the plan-reviewer), subagent count, model mismatch count, L1 small fix count, adjustments within the approved scope, plan rewrites before approval, in-flight revisions, calls raised to opus, and the <code>Judge misses<\/code> row (a verifier <code>Verdict: ALL PASS<\/code> followed by a G3 <code>Rework<\/code> with no Verify in between; a <code>Reworks on open review items<\/code> row counts the G3 answers <code>Rework: fix all open items<\/code>, which are not judge misses; a <code>Back to Execute reasons<\/code> row lists the <code>back=<\/code> reason of each return to Execute, among them what the person named at a G3 <code>Rework<\/code>).<\/li><li><code>## Cost and tokens per stretch<\/code>: <code>| Stretch | Steps | Cost USD (approx.) | Subagent tokens |<\/code>.<\/li><\/ul>"}]},{"id":"gate-report.md","steps":["R"],"writer":"my-agent:gate-analyst","comment":"retrospective: L4 tally (gate-report.py tally) and gate-analyst's decision report (4.11)","sources":[{"title":"`gate-report.md` format","from":"plugins/my-agent/l2-design-judge/agents/gate-analyst.md","html":"<p>Put the sections below in this order.<\/p><pre class=\"code\" data-lang=\"text\"><code># Gate report: &lt;task-id&gt;\n\n## Summary\n1. &lt;one line&gt;\n2. &lt;one line&gt;\n3. &lt;one line&gt;\n\n## Decision table\n| Gate | Question | Choice | Picked recommended |\n|---|---|---|---|\n\n## Tendencies\n- (clear|weak) &lt;tendency&gt; (&lt;count&gt;/&lt;total&gt;)\n\n## Suggested improvements\n- [L1, clear|weak] &lt;suggestion&gt;<\/code><\/pre><ul><li><code>## Summary<\/code>: 3 numbered lines. L1 copies them to the chat as is.<\/li><li><code>## Decision table<\/code>: from the tally's decision table, copy only four columns: Gate, Question, Choice, Picked recommended (drop the #, Recommended and Note columns). A decision confirmed after a change request at the same gate may go on one line, like <code>Request changes → Confirm<\/code>.<\/li><li><code>## Tendencies<\/code>: 3–5 bullets. Tag each tendency <code>(clear)<\/code> or <code>(weak)<\/code>. Clear when the same choice repeats and the count is enough; weak when there is a single sample or the choices are mixed.<\/li><li><code>## Suggested improvements<\/code>: <code>- [L1, clear|weak] &lt;suggestion&gt;<\/code>. L1 files the clear ones as feedback. For each clear tendency in <code>## Tendencies<\/code>, suggest one popup-side action: in the same kind of popup, if the recommended option is always picked, skip that popup's question or keep its default; if another option is always picked, adjust the recommendation (default). Write suggestions outside the popup, such as how things are recorded, after those.<\/li><li>If there are no decisions, write <code>No decisions<\/code> in place of the decision table, and <code>- none<\/code> for tendencies and suggested improvements. In the summary, write only the metrics (Verify, Plan Review, subagent count).<\/li><\/ul>"}]},{"id":"main-usage.json","steps":["R"],"writer":"L4 usage-snapshot.py","comment":"main session tokens per step, saved at the end of the task (usage-snapshot.py, 4.8.2)","sources":[{"title":"ma_usage.py (docstring)","from":"plugins/my-agent/l4-tools-guards/lib/ma_usage.py","html":"<p>Main-session token usage per step, from the session transcript, and its snapshot in the task folder.<\/p><p>The usage of each assistant response in <code>&lt;projects&gt;/*/&lt;session&gt;.jsonl<\/code> (counted once per response ID) is summed per model inside each step window: from a <code>step:<\/code> line to the next <code>step:<\/code> line; the last window of a finished task ends 1 second after the last run-log line (monitor design 5.3). Claude Code deletes transcripts after <code>cleanupPeriodDays<\/code> (default 30 days), so at the end of a task L1 runs <code>usage-snapshot.py<\/code>, which writes the same sums to <code>&lt;task&gt;/main-usage.json<\/code> (architecture 4.8.2 \"Task records over time\"). The monitor reads that file for a finished task. The monitor also uses <code>parse_entry<\/code> and <code>windows<\/code> here, so both count the same way. <code>write_snapshot<\/code> returns a message with the cost from <code>ma_prices<\/code> (the same table and override as the monitor); the scripts print it.<\/p><p>A Codex session's record (<code>ma_host.codex_record<\/code>) is read when no Claude transcript exists for the session id. Its <code>token_usage_record<\/code> lines of the session's own thread (<code>payload.thread_id<\/code> = session) are one response each and are all summed, in the same four keys: Codex counts cached and cache-written tokens inside <code>input_tokens<\/code> (<code>total_tokens<\/code> = input + output), so <code>input_tokens<\/code> here is the input less those two, as Claude counts it. The model of a record is the <code>turn_context<\/code> model of its turn. Codex has no per-response cost, so cost is tokens times <code>prices.json<\/code>; a model without a row has no cost.<\/p>"},{"title":"shape (ma_usage.to_json)","from":"plugins/my-agent/l4-tools-guards/lib/ma_usage.py","html":"<pre class=\"code\" data-lang=\"json\"><code>{\n &quot;written&quot;: &quot;2026-01-01 00:00:00&quot;,\n &quot;sessions&quot;: [\n  &quot;&lt;session-id&gt;&quot;\n ],\n &quot;windows&quot;: [\n  {\n   &quot;rev&quot;: 0,\n   &quot;step&quot;: 1,\n   &quot;model&quot;: &quot;claude-opus-5-5&quot;,\n   &quot;usage&quot;: {\n    &quot;input_tokens&quot;: 0,\n    &quot;output_tokens&quot;: 0,\n    &quot;cache_creation_input_tokens&quot;: 0,\n    &quot;cache_read_input_tokens&quot;: 0\n   }\n  }\n ]\n}<\/code><\/pre>"}]},{"id":"archive/","steps":["G1-B","5","R"],"writer":"L1","comment":"copies: right before a revision &lt;YYMMDD-hhmmss&gt;-rev&lt;N&gt;/, rewrite before approval -rev&lt;N&gt;-draft/, verdicts before going back or before a Review-only rerun -run&lt;n&gt;/, a Scope Review <code>REVISE<\/code> -scope-run&lt;n&gt;/ (4.8.1)","sources":[{"title":"4.8.1 Change requests during a task","from":"plugins/my-agent/docs/build-guide/my-agent-architecture.md","html":"<p>The procedure for when the person changes the request before the task ends (before G3 acceptance). It is based on the my-dev Revisions procedure and adds what only my-agent has: parallel runs, worktrees, workflows and <code>.active<\/code> (P16).<\/p><ul><li><strong>The record of truth (v0.27, review B4):<\/strong> the single source of the revision history is the run-log <code>revision:<\/code> lines. <code>## Revisions<\/code> at the end of <code>plan.md<\/code> is a secondary record for people to read. It survives when the architect rewrites <code>plan.md<\/code> (4.4), and even if it does not, the history is in the run-log.<\/li><li><strong>Core rule in SKILL.md (review B6):<\/strong> this procedure is outside SKILL.md, in <code>l1-orchestration/changes.md<\/code> (\"Rewrite before approval\" in <code>phases/plan.md<\/code>), and is read when a change request comes (4.7.1 \"Procedure files\"). 2026-11-26, plugin 0.33.0: L1 also reads it for a <code>[plan]<\/code> review finding, by the pointer in <code>accept.md<\/code> step 4B (\"Plan findings (Review)\" below). So the core rules hold a one-line \"change requests\" rule (do not fix right away, follow this procedure; before approval, archive and write a <code>revision<\/code> line).<\/li><\/ul><p><strong>1. Classify the request (L1, popup)<\/strong><\/p><p>When L1 gets a message that looks like a change, it first confirms the kind in a popup. If the user answered with a question, L1 answers it and then asks the same decision again in a popup (P3).<\/p><div class=\"tbl\"><table><thead><tr><th>Choice<\/th><th>Meaning<\/th><th>Next<\/th><\/tr><\/thead><tbody><tr><td>Revise this task<\/td><td>The completion criteria, non-goals, constraints or exception cases change, or the method, work units or files of the approved plan change<\/td><td>Items 2–8 below<\/td><\/tr><tr><td>Adjust within approved scope<\/td><td>Keeping the approved request needs one more file, behavior or dependency<\/td><td>Record it as a <code>Scope change:<\/code> line under <code>## Approval<\/code> in <code>plan.md<\/code> (edit only that section with Edit), write a <code>fix: what=&quot;Scope change: &lt;what&gt;&quot; files=plan.md<\/code> line to the run-log, then go on (v0.27, review B3). The tally counts this line apart from L1 small fixes, as <code>adjustments within approved scope<\/code>, and the monitor shows it in the record list. Verify and Review also judge against this line. Since 2026-11-22 (#11) no Verify run starts while an adjustment is still being built (its coder call has not returned and been merged): a run started then is stale within minutes and counts as a FAIL toward E.<\/td><\/tr><tr><td>Split into a new task<\/td><td>A request independent of the current task<\/td><td>Finish or abort the current task, then start with a new task ID (4.7.3).<\/td><\/tr><tr><td>Cancel<\/td><td>No change<\/td><td>Continue the current step.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>L1 picks the recommended option for the situation and puts it first with <code>(Recommended)<\/code>.<\/li><li><strong>Deferred direct checks (2026-10-26):<\/strong> if the person defers a check they must do themselves, such as a hands-on check, L1 writes a <code>Scope change: criterion &lt;n&gt; is checked by the user later<\/code> line under <code>## Approval<\/code> in <code>plan.md<\/code> on the spot (and the same run-log <code>fix:<\/code> line). Verify takes this line and judges that criterion within that scope, so the deferred check does not make Verify end in FAIL. The G3 report lists such criteria. A <code>[check: person]<\/code> criterion the person did check gets a <code>Scope change: criterion &lt;n&gt; checked by the person: &lt;what they reported&gt;<\/code> line from L1 at Verify; the verifier judges that criterion only from one of these two lines and marks it FAIL when both are missing. For every criterion the verifier accepts only evidence it can cite (a command result, a file location, a fetched page); inferred or \"likely\" evidence is FAIL.<\/li><li><strong>Profile change at the first gate (2026-10-29):<\/strong> at G1-A, or at G1-B in a small task, the person can switch the profile until that gate's approval line. To dev outside a git repository it is refused. L1 archives to <code>archive/&lt;time&gt;-rev&lt;N&gt;-profile/<\/code> (rev does not go up), updates <code>Profile:<\/code> (<code>Request:<\/code> stays as written), converts the files (to general: <code>scope.md<\/code> becomes the scope summary at the top of <code>plan.md<\/code>, back to ② Plan; from general: <code>scope.md<\/code> is written, <code>plan.md<\/code> archived, back to ① Define; before <code>scope.md<\/code> exists nothing is rolled back), and writes a <code>profile:<\/code> line. After G1-B approval a profile change is a new task (<code>Follows:<\/code>): the kind popup offers <code>Split into a new task (Recommended)<\/code>. The preset is asked again for the new profile with the Intake rule (<code>presets --profile &lt;new profile&gt;<\/code>; a popup only with 2 or more presets), <code>Models:<\/code> in <code>intake.md<\/code> is replaced or removed, and a new <code>models:<\/code> line is written when <code>Models:<\/code> is written.<\/li><li><strong>Rewrite before approval (v0.27, review B1):<\/strong> every case where the architect rewrites <code>plan.md<\/code> before G1-B approval (G1-B <code>Request changes<\/code>, Plan Review <code>REVISE<\/code>, applying Plan Review findings, prototype popup <code>Plan change<\/code>) skips this classification popup and items 2–8. There is no approved plan yet, so rev does not go up either. Instead, before handing it back to the architect, L1 archives the task folder to <code>archive/&lt;YYMMDD-hhmmss&gt;-rev&lt;N&gt;-draft/<\/code> (N is the current rev, 0 if there was no revision) (the same way as item 4) and writes a <code>revision: rev=&lt;N&gt; before=G1-B why=… archive=…<\/code> line to the run-log. A small change (2 task files or fewer, about 10 lines) may be made by L1 with Edit instead, with the same archive and a <code>fix: … files=plan.md before=G1-B archive=…<\/code> line in place of <code>revision<\/code> (Plan Review runs again only after a BLOCKER fix). In a hand-back the architect changes the parts that change with Edit, and uses Write only for a full rewrite (most of the file changes). Nothing is written to <code>## Revisions<\/code>. The monitor shows this line as \"plan rewrite before approval\", and the tally counts it as <code>plan rewrites before approval<\/code>. If that request changes the confirmed scope (<code>scope.md<\/code>), it follows this procedure (revise the same task).<\/li><\/ul><p><strong>2. Pause<\/strong><\/p><div class=\"tbl\"><table><thead><tr><th>What is running<\/th><th>Handling<\/th><\/tr><\/thead><tbody><tr><td>New delegation<\/td><td>Not started.<\/td><\/tr><tr><td>Background subagent<\/td><td>Wait until it ends; its result is not thrown away. Add a new <code>stale: id=&lt;agent_id&gt; rev=&lt;new rev&gt;<\/code> line to the run-log (lines already written are not changed), and set that work unit in <code>plan.md<\/code> to <code>stale<\/code>. For a long research job, ask in a popup: <code>Stop (Recommended)<\/code> / <code>Wait until done<\/code>.<\/td><\/tr><tr><td>workflow<\/td><td>It takes no input while running (F4), so stop it (TaskStop). Record the finished units and the unhandled units in the run-log.<\/td><\/tr><tr><td>coder worktree<\/td><td>Neither deleted nor merged; left as is. Item 7 decides what to do with it.<\/td><\/tr><tr><td>Code rollback<\/td><td>Not done. Only after the changed plan is approved.<\/td><\/tr><\/tbody><\/table><\/div><p><strong>3. Decide which phase to go back to<\/strong><\/p><ul><li>If the WHAT/WHY changes (purpose, completion criteria, non-goals, constraints or exception cases; the last two named here since 2026-11-26, as in the kind table above), go to ① Define (Scope). In the general profile the scope summary is at the top of <code>plan.md<\/code>, so go to ② Plan.<\/li><li>If only the HOW changes (method, work units, files), go to ② Plan.<\/li><li>Tell the person in one line which phase and why.<\/li><\/ul><p><strong>4. Archive<\/strong><\/p><ul><li><strong>Location:<\/strong> <code>&lt;task_dir&gt;/&lt;task-id&gt;/archive/&lt;YYMMDD-hhmmss&gt;-rev&lt;N&gt;/<\/code><ul><li>The time is set once with <code>date +%y%m%d-%H%M%S<\/code>.<\/li><li>If the same name exists, add <code>-b<\/code>, <code>-c<\/code>. Never write into an existing archive folder.<\/li><li>A rewrite before approval ends in <code>-rev&lt;N&gt;-draft<\/code>, a verdict archive before going back to Execute or before a Review-only rerun ends in <code>-run&lt;n&gt;<\/code> (below), and the archive of a Scope Review <code>REVISE<\/code> judgment ends in <code>-scope-run&lt;n&gt;<\/code>. The monitor treats only folders ending in <code>-rev&lt;N&gt;<\/code> (N ≥ 1) as old approved plans and puts them in the mock-up history.<\/li><\/ul><\/li><li><strong>What is copied:<\/strong> the whole task folder. Since 2026-11-16 L1 runs <code>l4-tools-guards/scripts/archive.py --task &lt;task folder&gt; --name &lt;name&gt;<\/code> (<code>--only verify.md review.md changed-files.md<\/code> for Back to Execute and a Review-only rerun, <code>--only scope-review.md<\/code> for a Scope Review <code>REVISE<\/code>): one call makes <code>archive/&lt;time&gt;-&lt;name&gt;/<\/code> from the clock, copies with the file times kept, compares every copy byte for byte and prints the folder, the <code>archive=<\/code> value; a copy that fails or differs is exit 3 and L1 stops. Before, L1 ran <code>date<\/code>, <code>mkdir -p<\/code>, <code>cp -pR<\/code> and one <code>cmp<\/code> per file, with absolute paths and without <code>cd<\/code>. The G1-B hook treats a relative path after <code>cd<\/code> as relative to every folder the <code>cd<\/code> could reach (4.4), so the archive for a rewrite before approval would be asked about instead of passing (v0.27 saw it blocked; since 2026-10-31 it is asked). The <code>work/<\/code> and <code>prototype/<\/code> subfolders are included; <code>archive/<\/code> itself is left out.<\/li><li><strong>Check:<\/strong> compare every file with <code>cmp<\/code>. If even one is missing or different, stop and tell the person. Nothing in the original is deleted at that point.<\/li><li><strong>The archive folder is only a record.<\/strong> It keeps earlier states, and none of them counts as current: no gate hook reads it, and a resumed task takes its state from the task folder and the run-log. It is read only where a rule says so, for example: the findings count and the monitor read the archived judgment copies for the earlier rounds (4.4); <code>continue<\/code> checks that the folder of a cut-off revision exists (item 6 below); and a rerun of a work unit gets the archived judgment paths (Back to Execute below). A judge (L2) gets a path in it only where a rule names it: on a rerun the verifier gets the previous <code>verify.md<\/code> and the reviewer the previous <code>review.md<\/code> from <code>archive/&lt;ts&gt;-run&lt;N&gt;/<\/code> (steps 4A and 4B). One named exception (2026-11-26, plugin 0.33.0): after a plan-finding <code>Revise this task<\/code>, L1 passes the architect (an L2 agent) the archived <code>archive/&lt;time&gt;-rev&lt;N&gt;/review.md<\/code> path as the change request (\"Plan findings (Review)\" below).<\/li><\/ul><p><strong>5. Record<\/strong><\/p><ul><li>Write a <code>revision: rev=&lt;N&gt; why=… archive=… to=&lt;phase to go back to&gt; invalidated=… keep=… state=pending<\/code> line to the run-log (example in 4.7.2). <code>to=<\/code> lets <code>continue<\/code> set the <code>phase:<\/code> of <code>.active<\/code> if this revision is cut off midway. It is written before anything else changes. The run-log belongs to the same task, so it is not moved; writing continues in it.<\/li><li>Add one line to <code>## Revisions<\/code> at the end of <code>plan.md<\/code> (after <code>## Approval<\/code>). Create the section if it is missing. Even when going back to ①, write it in <code>plan.md<\/code>, not <code>scope.md<\/code> (v0.27, review B5: the monitor and hooks look only at <code>plan.md<\/code>). When the architect rewrites <code>plan.md<\/code>, it carries this section over as is (4.4).<\/li><li><strong>How to edit the sections (2026-10-26):<\/strong> find <code>## Revisions<\/code> and <code>## Approval<\/code> (item 6) by headings that start at the beginning of a line (<code>## Revisions<\/code>, <code>## Approval<\/code>), and edit only that section with the Edit tool. Do not cut the file by string position, and do not overwrite the whole file with Write. If the body quotes the same text, cutting by position duplicates or loses body text (my-dev feedback).<pre class=\"code\" data-lang=\"text\"><code>- rev&lt;N&gt; &lt;YYYY-MM-DD HH:MM&gt; &lt;what changed, the user&#x27;s request&gt;; archive &lt;path&gt;; back to &lt;phase&gt;<\/code><\/pre><\/li><\/ul><ul><li>Whether invalidation is finished is recorded not on this line but on the run-log <code>state=<\/code> line (item 6). The <code>; invalidated: pending|done<\/code> tail used through v0.26 is no longer written.<\/li><li>An archive folder that appears in no <code>archive=<\/code> of any <code>revision:<\/code> line and no <code>archive=<\/code> of any <code>step:<\/code> line is the trace of a revision cut off midway. Leave it and ignore it.<\/li><\/ul><p>**6. Invalidation and <code>.active<\/code>**<\/p><ul><li>Delete the files that judged the old version: <code>plan-review.md<\/code>, <code>verify.md<\/code>, <code>review.md<\/code>. Copies are in the archive folder.<\/li><li>Empty <code>## Approval<\/code> in <code>plan.md<\/code>. Empty the <code>Scope change:<\/code> lines with it. When going back to ①, also delete <code>scope-review.md<\/code> and empty <code>## Confirmation<\/code> in <code>scope.md<\/code>.<\/li><li>Rebuild <code>prototype/<\/code> only when the mock-up changed.<\/li><li>Change the <code>phase:<\/code> of <code>.active<\/code> to the phase gone back to. The approval line is now empty, so the hook again blocks delegation and writes (4.4).<\/li><li>When done, write a <code>revision: rev=&lt;N&gt; state=done<\/code> line to the run-log. The monitor shows the two lines of the same rev as one, and <code>check-run.py<\/code> counts a rev without <code>state=done<\/code> as a failure. When <code>continue<\/code> sees a rev without <code>state=done<\/code>, it finishes the rest. The archive was finished before the <code>revision<\/code> line, so it is not compared again (the verdict files may already be deleted); <code>continue<\/code> only checks that the archive folder exists and is not empty, then goes through the <code>## Revisions<\/code> line, deleting the verdict files, emptying <code>## Approval<\/code> and (for ①) <code>## Confirmation<\/code>, the <code>phase:<\/code> of <code>.active<\/code> (<code>to=<\/code>) and the <code>state=done<\/code> line in order, skipping what is already done.<\/li><li>The Verify consecutive FAIL count is the number of <code>Verdict: FAIL<\/code>s since the last <code>Verdict: ALL PASS<\/code> or the last same-task revision. L1 and the monitor both count it from <code>result=<\/code> on the verifier's <code>stop:<\/code> lines in the run-log. <code>Run:<\/code> in <code>verify.md<\/code> is the verdict round and goes up even after a PASS, so it is not used as the consecutive count (review D5).<\/li><\/ul><p><strong>7. Continue again<\/strong><\/p><ul><li>Proceed in order from the phase gone back to, and pass every gate again. The skip rules (4.3) are also decided again against the changed request.<\/li><li>If deliverables already exist, the architect puts an <code>## Existing work<\/code> table (<code>| Target | Decision | Reason |<\/code>) in the changed plan after <code>## Estimate<\/code> and before <code>## Approval<\/code> (v0.27, position and columns aligned with the architect definition). The decisions available per target:<div class=\"tbl\"><table><thead><tr><th>Target<\/th><th>Decision<\/th><\/tr><\/thead><tbody><tr><td>Notes and drafts in <code>work/<\/code><\/td><td>keep / revise / discard. Discarded files are not deleted but moved to <code>archive/&lt;this revision&#x27;s folder&gt;/discarded/<\/code>.<\/td><\/tr><tr><td>Unmerged coder worktree<\/td><td>merge / redo / discard. Discard makes the worktree cleanup one work unit.<\/td><\/tr><tr><td>Already merged code (dev)<\/td><td>keep / revise / revert. A revert is a work unit of its own.<\/td><\/tr><\/tbody><\/table><\/div><\/li><\/ul><ul><li>Nothing is deleted or rolled back before the changed plan is approved at G1-B.<\/li><\/ul><p><strong>8. Count<\/strong><\/p><ul><li>When the same task reaches its 4th revision (four-unit principle), ask in a popup before entering the revision procedure: <code>Keep revising (Recommended)<\/code> / <code>Restart as a new task<\/code> / <code>Abort<\/code><\/li><\/ul><p><strong>Before and after G3<\/strong><\/p><div class=\"tbl\"><table><thead><tr><th>When<\/th><th>Request<\/th><th>Handling<\/th><\/tr><\/thead><tbody><tr><td><code>Rework<\/code> in the G3 popup<\/td><td>The criteria stay; the result falls short<\/td><td>No revision procedure (rev); go to ③ Build through \"Back to Execute\" below. The shortfalls are passed like failed criteria, and the map step gets them as <code>--rework-criterion<\/code> arguments and the picked SHOULD-FIX locations as <code>--rework-finding<\/code> arguments (\"Verify and Review scope\"). 2026-11-26, plugin 0.33.0: when the items sent back include a <code>[plan]<\/code> finding, the plan-finding popup comes first, and its <code>Revise this task<\/code> does follow the revision procedure (\"Plan findings (Review)\" below).<\/td><\/tr><tr><td>A request in the G3 popup that changes the criteria<\/td><td>The criteria change<\/td><td>Follows this procedure (revise the same task).<\/td><\/tr><tr><td>After G3 acceptance<\/td><td>The deliverable is already saved, the retrospective is over and <code>.active<\/code> is deleted<\/td><td>A <strong>new task<\/strong>. Create a new task ID and write <code>Follows: &lt;previous task ID&gt;<\/code> in <code>intake.md<\/code>. The previous task folder is not touched.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The final deliverable (research note, document, commit) is saved only after G3. So a revision before G3 leaves no deliverable outside the project to clean up.<\/li><li>The exception is code already merged into the main working tree in the dev profile. It is handled in <code>## Existing work<\/code> in item 7.<\/li><\/ul><p><strong>Back to Execute (v0.27, review B2)<\/strong><\/p><p>This is for going back to ③ Build on Verify FAIL, a Review BLOCKER (when an L1 small fix is not enough), or G3 <code>Rework<\/code>. rev does not go up. The nex
